    <script>
    // Повний fallback для L якщо Leaflet не завантажився
    function ensureLeafletFallback() {
        if (typeof L !== 'undefined') return; // Leaflet є — все добре
        window.L = {
            _maps: [],
            map: function(el) {
                if (typeof el === 'string') el = document.getElementById(el);
                if (!el) return this._dummyMap();
                // Показуємо OSM iframe як fallback
                const mapObj = {
                    _el: el, _lat: 49, _lng: 32, _zoom: 6,
                    _markers: [],
                    setView: function(latlng, zoom) {
                        this._lat = Array.isArray(latlng) ? latlng[0] : latlng.lat || 49;
                        this._lng = Array.isArray(latlng) ? latlng[1] : latlng.lng || 32;
                        this._zoom = zoom || 6;
                        this._render();
                        return this;
                    },
                    _render: function() {
                        const lat = this._lat, lng = this._lng, z = Math.min(this._zoom, 14);
                        // Bbox для iframe
                        const d = 180 / Math.pow(2, z) * 0.5;
                        const url = `https://www.openstreetmap.org/export/embed.html?bbox=${lng-d},${lat-d},${lng+d},${lat+d}&layer=mapnik`;
                        this._el.innerHTML = `
                            <iframe src="${url}" style="width:100%;height:100%;border:none;border-radius:28px;"></iframe>
                            <div style="position:absolute;bottom:6px;right:8px;font-size:0.65rem;background:rgba(255,255,255,0.85);padding:2px 6px;border-radius:8px;">
                                <a href="https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=${z}/${lat}/${lng}" target="_blank" style="color:#1e3a3a;">🗺️ Відкрити</a>
                            </div>
                            <div id="pins_${Date.now()}" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;"></div>`;
                        this._pinsEl = this._el.querySelector('[id^="pins_"]');
                        return this;
                    },
                    addLayer: function() { return this; },
                    remove: function() { if(this._el) this._el.innerHTML = ''; },
                    invalidateSize: function() { return this; },
                    bindPopup: function() { return this; },
                    on: function() { return this; }
                };
                L._maps.push(mapObj);
                return mapObj;
            },
            _dummyMap: function() {
                return { setView:function(){return this;}, addLayer:function(){return this;}, remove:function(){}, invalidateSize:function(){}, on:function(){return this;} };
            },
            tileLayer: function() { return { addTo: function() { return this; } }; },
            marker: function() { return { addTo: function(){return this;}, bindPopup: function(){return this;}, openPopup: function(){return this;} }; },
            divIcon: function() { return {}; },
            icon: function() { return {}; }
        };
    }

function saveAll() {
    try {
        localStorage.setItem('mf_waterbodies', JSON.stringify(waterbodies));
        localStorage.setItem('mf_listings', JSON.stringify(listings));
        localStorage.setItem('mf_news', JSON.stringify(newsItems));
        localStorage.setItem('mf_tournaments', JSON.stringify(tournaments));
        localStorage.setItem('mf_campings', JSON.stringify(campings));
        localStorage.setItem('mf_tours', JSON.stringify(tours));
        localStorage.setItem('mf_store_products', JSON.stringify(storeProducts));
        if (currentUser) localStorage.setItem('mf_user', JSON.stringify(currentUser));
    } catch(e) {}
}
function loadAll() {
    try {
        let w=localStorage.getItem('mf_waterbodies'); 
        if(w) waterbodies=JSON.parse(w);
        // Ініціалізація 20 водойм при першому запуску
        else if(waterbodies.length === 0) {
            localStorage.setItem('mf_waterbodies', JSON.stringify(waterbodies));
        }
        let l=localStorage.getItem('mf_listings'); if(l) listings=JSON.parse(l);
        let n=localStorage.getItem('mf_news'); if(n) newsItems=JSON.parse(n);
        let u=localStorage.getItem('mf_user'); if(u) currentUser=JSON.parse(u);
        let tr=localStorage.getItem('mf_tournaments'); if(tr) tournaments=JSON.parse(tr);
        let cp=localStorage.getItem('mf_campings'); if(cp) campings=JSON.parse(cp);
        let to=localStorage.getItem('mf_tours'); if(to) tours=JSON.parse(to);
        let sp=localStorage.getItem('mf_store_products'); if(sp) storeProducts=JSON.parse(sp);
    } catch(e) {}
}

// ========== ГЕОЛОКАЦІЯ (покращена точність) ==========
function getUserLocation(callback) {
    if (!navigator.geolocation) { 
        console.log('Geolocation not supported');
        if (callback) callback(false); 
        return; 
    }

    // Покращені опції для точності
    const options = {
        enableHighAccuracy: true,  // Максимальна точність
        timeout: 15000,            // 15 секунд на отримання
        maximumAge: 0              // Не використовувати кеш
    };

    const tryGeo = () => navigator.geolocation.getCurrentPosition(
        pos => { 
            currentLocation = {
                lat: pos.coords.latitude, 
                lng: pos.coords.longitude,
                accuracy: pos.coords.accuracy
            };
            console.log('Location obtained:', currentLocation);
            if(callback) callback(true); 
        },
        (err) => {
            console.log('Geolocation error:', err.code, err.message);
            // Показуємо зрозумілу помилку користувачу
            if (err.code === 1) {
                alert('❌ Доступ до геолокації заборонено.\n\nДозвольте доступ до місцезнаходження в налаштуваннях браузера.');
            } else if (err.code === 2) {
                alert('❌ Не вдалося визначити місце.\n\nПеревірте що GPS увімкнено.');
            } else if (err.code === 3) {
                alert('⏱️ Час очікування вийшов.\n\nСпробуйте ще раз.');
            }
            if (callback) callback(false);
        },
        options
    );

    if (window.location.protocol !== 'https:' && window.location.protocol !== 'http:') {
        try { tryGeo(); } catch(e) { 
            console.log('Geolocation exception:', e);
            if (callback) callback(false); 
        }
    } else { 
        tryGeo(); 
    }
}

// ========== UNIVERSAL LOCATION PICKER ==========
function createLocationPicker(opts = {}) {
    const { 
        initialLat = null, 
        initialLng = null, 
        onChange = null,  // callback(lat, lng, address)
        showMap = true,
        country = 'Україна'
    } = opts;

    let selectedLat = initialLat;
    let selectedLng = initialLng;
    let selectedRegion = '';
    let selectedCity = '';
    let pickerMap = null;
    let marker = null;

    const container = document.createElement('div');
    container.style.cssText = 'margin-bottom:14px;';
    
    container.innerHTML = `
        <div style="font-weight:700;margin-bottom:8px;">📍 Місцезнаходження</div>
        
        <!-- GPS Auto -->
        <button id="gpsAutoBtn" type="button" style="width:100%;background:#2c5a6e;color:white;border:none;border-radius:40px;padding:10px;font-weight:700;cursor:pointer;margin-bottom:8px;">📍 Визначити автоматично (GPS)</button>
        
        <!-- Address selector -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
            <select id="regionSelect" style="padding:10px;border-radius:16px;border:1.5px solid #ddd;">
                <option value="">Оберіть область</option>
                ${Object.keys(UA_REGIONS).map(r=>`<option value="${r}">${r}</option>`).join('')}
            </select>
            <select id="citySelect" style="padding:10px;border-radius:16px;border:1.5px solid #ddd;" disabled>
                <option value="">Спочатку область</option>
            </select>
        </div>
        
        <!-- Map -->
        ${showMap ? '<div id="locationPickerMap" style="height:250px;border-radius:16px;margin-bottom:8px;border:2px solid #ddd;"></div>' : ''}
        
        <!-- Manual coords -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <input id="manualLatInput" type="number" step="0.0001" placeholder="Широта" value="${initialLat||''}" style="padding:10px;border-radius:16px;border:1.5px solid #ddd;">
            <input id="manualLngInput" type="number" step="0.0001" placeholder="Довгота" value="${initialLng||''}" style="padding:10px;border-radius:16px;border:1.5px solid #ddd;">
        </div>
        <div id="locationStatus" style="font-size:0.8rem;color:#888;margin-top:6px;"></div>
    `;

    // Initialize map if showMap
    setTimeout(() => {
        if (showMap) {
            ensureLeafletFallback();
            const mapDiv = container.querySelector('#locationPickerMap');
            if (mapDiv && typeof L !== 'undefined') {
                pickerMap = L.map(mapDiv).setView([initialLat || 49, initialLng || 32], initialLat ? 12 : 6);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {attribution:'OSM'}).addTo(pickerMap);
                
                if (initialLat && initialLng) {
                    marker = L.marker([initialLat, initialLng], {draggable: true}).addTo(pickerMap);
                    marker.on('dragend', function(e) {
                        const pos = e.target.getLatLng();
                        updateLocation(pos.lat, pos.lng, 'Переміщено на карті');
                    });
                }
                
                // Click to place marker
                pickerMap.on('click', function(e) {
                    if (marker) pickerMap.removeLayer(marker);
                    marker = L.marker([e.latlng.lat, e.latlng.lng], {draggable: true}).addTo(pickerMap);
                    marker.on('dragend', function(ev) {
                        const pos = ev.target.getLatLng();
                        updateLocation(pos.lat, pos.lng, 'Переміщено на карті');
                    });
                    updateLocation(e.latlng.lat, e.latlng.lng, 'Обрано на карті');
                });
                
                setTimeout(() => { if (pickerMap) pickerMap.invalidateSize(); }, 100);
            }
        }
    }, 100);

    function updateLocation(lat, lng, source) {
        selectedLat = lat;
        selectedLng = lng;
        container.querySelector('#manualLatInput').value = lat.toFixed(6);
        container.querySelector('#manualLngInput').value = lng.toFixed(6);
        const status = container.querySelector('#locationStatus');
        status.textContent = `✅ ${source}: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
        status.style.color = '#27ae60';
        
        if (pickerMap && marker) {
            marker.setLatLng([lat, lng]);
            pickerMap.setView([lat, lng], 12);
        } else if (pickerMap) {
            if (marker) pickerMap.removeLayer(marker);
            marker = L.marker([lat, lng], {draggable: true}).addTo(pickerMap);
            marker.on('dragend', function(e) {
                const pos = e.target.getLatLng();
                updateLocation(pos.lat, pos.lng, 'Переміщено на карті');
            });
            pickerMap.setView([lat, lng], 12);
        }
        
        const address = [selectedCity, selectedRegion, country].filter(Boolean).join(', ');
        if (onChange) onChange(lat, lng, address);
    }

    // GPS button
    container.querySelector('#gpsAutoBtn').onclick = () => {
        const btn = container.querySelector('#gpsAutoBtn');
        btn.textContent = '⏳ Визначаємо...';
        btn.disabled = true;
        getUserLocation(ok => {
            btn.disabled = false;
            btn.textContent = '📍 Визначити автоматично (GPS)';
            if (ok && currentLocation) {
                updateLocation(currentLocation.lat, currentLocation.lng, 'GPS');
            } else {
                const status = container.querySelector('#locationStatus');
                status.textContent = '❌ GPS недоступний. Оберіть на карті або вкажіть область/місто.';
                status.style.color = '#c62828';
            }
        });
    };

    // Region selector
    container.querySelector('#regionSelect').onchange = (e) => {
        selectedRegion = e.target.value;
        const citySelect = container.querySelector('#citySelect');
        if (selectedRegion) {
            const region = UA_REGIONS[selectedRegion];
            citySelect.disabled = false;
            citySelect.innerHTML = '<option value="">Оберіть місто</option>' + 
                region.cities.map(c=>`<option value="${c}">${c}</option>`).join('');
            // Auto-set to region center if no city selected yet
            if (!selectedCity) {
                updateLocation(region.lat, region.lng, `Область: ${selectedRegion}`);
            }
        } else {
            citySelect.disabled = true;
            citySelect.innerHTML = '<option value="">Спочатку область</option>';
        }
    };

    // City selector
    container.querySelector('#citySelect').onchange = (e) => {
        selectedCity = e.target.value;
        if (selectedCity && selectedRegion) {
            const region = UA_REGIONS[selectedRegion];
            // Approximate: use region center + small offset based on city index
            const cityIndex = region.cities.indexOf(selectedCity);
            const lat = region.lat + (cityIndex * 0.05);
            const lng = region.lng + (cityIndex * 0.05);
            updateLocation(lat, lng, `${selectedCity}, ${selectedRegion}`);
        }
    };

    // Manual input
    container.querySelector('#manualLatInput').oninput = (e) => {
        const lat = parseFloat(e.target.value);
        const lng = parseFloat(container.querySelector('#manualLngInput').value);
        if (!isNaN(lat) && !isNaN(lng)) {
            updateLocation(lat, lng, 'Введено вручну');
        }
    };
    container.querySelector('#manualLngInput').oninput = (e) => {
        const lat = parseFloat(container.querySelector('#manualLatInput').value);
        const lng = parseFloat(e.target.value);
        if (!isNaN(lat) && !isNaN(lng)) {
            updateLocation(lat, lng, 'Введено вручну');
        }
    };

    return {
        el: container,
        getLocation: () => ({ lat: selectedLat, lng: selectedLng, region: selectedRegion, city: selectedCity }),
        setLocation: (lat, lng) => updateLocation(lat, lng, 'Встановлено'),
    };
}

// ========== УТИЛІТИ ==========
function getDistance(lat1,lng1,lat2,lng2) {
    const R=6371000, dlat=(lat2-lat1)*Math.PI/180, dlng=(lng2-lng1)*Math.PI/180;
    const a=Math.sin(dlat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dlng/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function canChangeStatus(lat,lng) { return currentLocation && getDistance(currentLocation.lat,currentLocation.lng,lat,lng)<=300; }
function canOrganizeTournament() { return currentUser && ['waterowner','manufacturer','camping','resort','travelagency'].includes(currentUser.role); }
function canAddListing() {
    if (!currentUser) return false;
    const myListings = listings.filter(l=>l.seller===currentUser.nickname&&l.status!=='deleted').length;
    if (currentUser.role==='manufacturer') return true; // unlimited
    if (currentUser.role==='store') return myListings < 50;
    if (currentUser.role==='travelagency') return myListings < 10;
    if (currentUser.role==='waterowner'||currentUser.role==='resort') return myListings < 5;
    if (currentUser.role==='camping') return myListings < 3;
    // Base access (user) gets 50 listings
    return myListings < 50;
}
function myActiveListingsCount() { return listings.filter(l=>l.seller===currentUser.nickname&&l.status==='active').length; }
function getActiveTournamentsCount() { return tournaments.filter(t=>new Date(t.date)>=new Date()).length; }
function getTotalParticipantsCount() { return tournaments.reduce((s,t)=>s+(t.participants?t.participants.length:0),0); }

function updateSubscriptionStatus() {
    const now = new Date();
    const roles = ['seller','store','waterowner','manufacturer'];
    const expFields = { store:'storeExpiry', waterowner:'waterOwnerExpiry', manufacturer:'manufacturerExpiry', camping:'campingExpiry', resort:'resortExpiry', travelagency:'travelagencyExpiry' };
    roles.forEach(r => { if (currentUser.role===r && currentUser[expFields[r]] && new Date(currentUser[expFields[r]])<now) { currentUser.role='user'; currentUser[expFields[r]]=null; } });
    saveAll();
}

// Повертає DOM-елемент + метод getBase64()
function createPhotoUploader(opts = {}) {
    const {
        label = '📷 Фото',
        maxPhotos = 5,
        existingPhotos = [],  // масив base64 або URL
        capture = false       // true = одразу відкриває камеру
    } = opts;

    let photos = [...existingPhotos]; // масив base64

    const wrap = document.createElement('div');
    wrap.style.cssText = 'margin-bottom:16px;';

    function render() {
        wrap.innerHTML = `
        <div style="font-weight:600;font-size:0.9rem;margin-bottom:8px;">${label}</div>
        <div id="photoGrid" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;">
            ${photos.map((p, i) => `
            <div style="position:relative;width:80px;height:80px;flex-shrink:0;">
                <img src="${p}" style="width:80px;height:80px;object-fit:cover;border-radius:14px;border:2px solid #eee;">
                <button data-del="${i}" style="position:absolute;top:-6px;right:-6px;background:#e74c3c;color:white;border:none;border-radius:50%;width:22px;height:22px;font-size:0.75rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:900;line-height:1;">✕</button>
            </div>`).join('')}
            ${photos.length < maxPhotos ? `
            <label style="width:80px;height:80px;border:2px dashed #ccc;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#fafafa;flex-shrink:0;transition:0.2s;" id="addPhotoLabel">
                <span style="font-size:1.5rem;">📷</span>
                <span style="font-size:0.65rem;color:#aaa;margin-top:2px;">Додати</span>
                <input type="file" accept="image/*" ${capture?'capture="environment"':''} multiple style="display:none;" id="photoFileInput">
            </label>` : ''}
        </div>
        <div style="font-size:0.72rem;color:#aaa;">До ${maxPhotos} фото · JPG, PNG · Перше фото — головне</div>`;

        // Видалення фото
        wrap.querySelectorAll('[data-del]').forEach(btn => {
            btn.onclick = e => {
                e.preventDefault();
                photos.splice(parseInt(btn.dataset.del), 1);
                render();
            };
        });

        // Завантаження нових фото
        const fileInput = wrap.querySelector('#photoFileInput');
        if (fileInput) {
            fileInput.onchange = async function() {
                const files = Array.from(this.files).slice(0, maxPhotos - photos.length);
                for (const file of files) {
                    const b64 = await fileToBase64(file);
                    // Стиснення якщо > 500кб
                    const compressed = await compressImage(b64, 800);
                    photos.push(compressed);
                }
                render();
            };
        }
    }

    render();

    return {
        el: wrap,
        getPhotos: () => photos,
        getFirst: () => photos[0] || '',
        setPhotos: (arr) => { photos = [...arr]; render(); }
    };
}

// Файл → base64
function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

// Стиснення зображення через canvas
function compressImage(base64, maxWidth = 800) {
    return new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.75));
        };
        img.onerror = () => resolve(base64); // якщо помилка — повертаємо оригінал
        img.src = base64;
    });
}

            <h3>${isUk?'❓ Як користуватись MagicFish':'❓ How to use MagicFish'}</h3>
            <div style="display:flex;flex-direction:column;gap:10px;max-height:65vh;overflow-y:auto;">
                ${steps.map(s=>`
                <div style="background:#f5f7f0;border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;">
                    <div style="font-size:1.3rem;flex-shrink:0;">${s.icon}</div>
                    <div>
                        <div style="font-weight:700;font-size:0.9rem;color:#1f3b4c;margin-bottom:2px;">${s.title}</div>
                        <div style="font-size:0.82rem;color:#666;">${s.desc}</div>
                    </div>
                </div>`).join('')}
            </div>
            <button class="close-modal" style="margin-top:14px;">${isUk?'Зрозуміло!':'Got it!'}</button>
        `);
        modal.querySelector('.close-modal').onclick = () => modal.remove();
    };

    // ---- Supabase Auth helpers ----
    async function afterSupabaseLogin(user) {
        // Перевіряємо чи вже є профіль у localStorage
        const savedUser = localStorage.getItem('mf_user');
        if (savedUser) {
            try {
                const parsed = JSON.parse(savedUser);
                if (parsed.email === user.email && parsed.nickname) {
                    currentUser = parsed;
                    renderMainMenu();
                    return;
                }
            } catch(e) {}
        }
        // Новий користувач — вибір нікнейму
        currentUser = { nickname:'', email: user.email, role:'user', hasBasicPaid:true, lang:appLang, country:appCountry, currency:appCurrency };
        saveAll();
        renderPickNickname('supabase');
    }

    // ---- Email OTP ----
    let otpSent = false;
    document.getElementById('emailAuthBtn').onclick = async function() {
        const email = document.getElementById('authEmail').value.trim();
        const statusDiv = document.getElementById('authStatus');
        const btn = document.getElementById('emailAuthBtn');

        if (!otpSent) {
            // Крок 1 — надсилаємо OTP
            if (!email || !email.includes('@')) {
                statusDiv.textContent = '❌ Введіть коректний email';
                return;
            }
            btn.disabled = true;
            btn.textContent = '⏳ Надсилаємо код...';
            statusDiv.textContent = '';
            const { error } = await supabase.auth.signInWithOtp({ email });
            if (error) {
                statusDiv.textContent = '❌ ' + error.message;
                btn.disabled = false;
                btn.textContent = '📧 Увійти через Email';
                return;
            }
            otpSent = true;
            document.getElementById('authEmail').disabled = true;
            document.getElementById('otpBlock').style.display = 'block';
            btn.disabled = false;
            btn.textContent = '✅ Підтвердити код';
            statusDiv.style.color = '#27ae60';
            statusDiv.textContent = '📨 Код надіслано на ' + email;
        } else {
            // Крок 2 — перевіряємо OTP
            const otp = document.getElementById('authOtp').value.trim();
            if (otp.length !== 6) {
                statusDiv.style.color = '#e74c3c';
                statusDiv.textContent = '❌ Введіть 6-значний код';
                return;
            }
            btn.disabled = true;
            btn.textContent = '⏳ Перевіряємо...';
            const { data, error } = await supabase.auth.verifyOtp({ email, token: otp, type: 'email' });
            if (error) {
                statusDiv.style.color = '#e74c3c';
                statusDiv.textContent = '❌ Невірний код. Спробуйте ще раз.';
                btn.disabled = false;
                btn.textContent = '✅ Підтвердити код';
                return;
            }
            await afterSupabaseLogin(data.user);
        }
    };

    // ---- Google OAuth ----
    document.getElementById('googleBtn').onclick = async function() {
        const { error } = await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.href }
        });
        if (error) alert('❌ ' + error.message);
    };

    // ---- Apple — заглушка ----
    document.getElementById('appleBtn').onclick = function() {
        alert('🍎 Вхід через Apple буде доступний найближчим часом');
    };

    // ---- Перевірка сесії при завантаженні ----
    supabase.auth.getSession().then(function(result) {
        const session = result.data && result.data.session;
        if (session && session.user) {
            afterSupabaseLogin(session.user);
        }
    });
}

    const nickInput = document.getElementById('pickNick');

    nickInput.oninput = () => {

        if (v.length < 2) { hint.style.color='#aaa'; hint.textContent='2–24 characters'; }
        else if (!/^[a-zA-Zа-яА-ЯіІїЇєЄёЁ0-9_]+$/.test(v)) { hint.style.color='#e74c3c'; hint.textContent='❌ Only letters, numbers, _'; }

        addPoints('first_login');
        saveAll();
        renderAskGeolocation();
    };
}

// ========== ЗАПИТ ГЕОЛОКАЦІЇ ПІСЛЯ РЕЄСТРАЦІЇ ==========
function renderAskGeolocation() {
    const app = document.getElementById('appRoot');
    app.innerHTML = '<div class="card" style="text-align:center;">' +
      '<div style="font-size:3.5rem;margin-bottom:8px;">📍</div>' +
      '<div style="font-size:1.25rem;font-weight:900;color:#1f3b4c;margin-bottom:8px;">Дозвольте визначити ваше місце</div>' +
      '<div style="font-size:0.88rem;color:#555;margin-bottom:20px;line-height:1.6;">' +
        'MagicFish використовує геолокацію для:<br>' +
        '🎣 <b>Водойми поруч</b> — сортування за відстанню<br>' +
        '🆘 <b>SOS</b> — точні координати для рятувальників<br>' +
        '📍 <b>Чекіни</b> — підтвердження що ви на місці<br>' +
        '🏕️ <b>Кемпінги і бази</b> — найближчі до вас' +
      '</div>' +
      '<button id="geoAllowBtn" class="btn btn-block" style="margin-bottom:12px;background:#27ae60;font-size:1rem;">' +
        '📍 Дозволити геолокацію' +
      '</button>' +
      '<button id="geoSkipBtn" class="btn btn-block btn-secondary" style="font-size:0.9rem;">' +
        '✖ Пропустити' +
      '</button>' +
      '<div id="geoStatus" style="margin-top:14px;font-size:0.82rem;color:#888;"></div>' +
    '</div>';

    document.getElementById('geoAllowBtn').onclick = function() {
        var statusDiv = document.getElementById('geoStatus');
        var allowBtn  = document.getElementById('geoAllowBtn');
        allowBtn.disabled = true;
        allowBtn.textContent = '⏳ Визначаємо...';
        statusDiv.textContent = '';
        if (!navigator.geolocation) {
            statusDiv.innerHTML = '❌ Геолокація не підтримується браузером';
            allowBtn.disabled = false;
            allowBtn.textContent = '📍 Дозволити геолокацію';
            return;
        }
        navigator.geolocation.getCurrentPosition(
            function(pos) {
                currentLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
                currentUser.locationDenied = false;
                saveAll();
                statusDiv.innerHTML = '✅ Визначено: ' + pos.coords.latitude.toFixed(4) + ', ' + pos.coords.longitude.toFixed(4) + ' (±' + Math.round(pos.coords.accuracy) + 'м)';
                setTimeout(function() { renderMainMenu(); }, 800);
            },
            function(err) {
                statusDiv.innerHTML = '⚠️ Не вдалось визначити. Перевірте дозволи браузера.';
                allowBtn.disabled = false;
                allowBtn.textContent = '📍 Спробувати ще раз';
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    };

    document.getElementById('geoSkipBtn').onclick = function() {
        currentUser.locationDenied = true;
        saveAll();
        renderMainMenu();
        setTimeout(function() { showGeoWarningBanner(); }, 300);
    };
}

function showGeoWarningBanner() {
    if (document.getElementById('geoWarningBanner')) return;
    var warn = document.createElement('div');
    warn.id = 'geoWarningBanner';
    warn.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#e65100;color:#fff;padding:10px 16px;font-size:0.82rem;z-index:9999;display:flex;align-items:center;gap:10px;';
    var span = document.createElement('span');
    span.style.flex = '1';
    span.textContent = '⚠️ Геолокація вимкнена — SOS, «Поруч» і чекіни будуть неточними';
    var btn1 = document.createElement('button');
    btn1.textContent = 'Увімкнути';
    btn1.style.cssText = 'background:#fff;color:#e65100;border:none;border-radius:8px;padding:4px 10px;font-weight:700;cursor:pointer;';
    btn1.onclick = function() { warn.remove(); renderAskGeolocation(); };
    var btn2 = document.createElement('button');
    btn2.textContent = '✕';
    btn2.style.cssText = 'background:transparent;color:#fff;border:none;font-size:1.1rem;cursor:pointer;';
    btn2.onclick = function() { warn.remove(); };
    warn.appendChild(span);
    warn.appendChild(btn1);
    warn.appendChild(btn2);
    document.body.appendChild(warn);
}

function getUserPoints() { return currentUser.points || 0; }
function addPoints(type, customLabel) {
    if (!currentUser.points) currentUser.points = 0;
    if (!currentUser.pointsHistory) currentUser.pointsHistory = [];
    const cfg = POINTS_CONFIG[type];
    if (!cfg) return;
    currentUser.points += cfg.points;
    currentUser.pointsHistory.unshift({
        label: customLabel || cfg.label,
        points: cfg.points,
        date: new Date().toLocaleDateString('uk-UA'),
        time: new Date().toLocaleTimeString('uk-UA', {hour:'2-digit',minute:'2-digit'})
    });
    if (currentUser.pointsHistory.length > 50) currentUser.pointsHistory.pop();
    saveAll();
    return cfg.points;
}
function spendPoints(cost) {
    if ((currentUser.points||0) < cost) return false;
    currentUser.points -= cost;
    if (!currentUser.pointsHistory) currentUser.pointsHistory = [];
    currentUser.pointsHistory.unshift({
        label: '🛍️ Обмін балів на нагороду',
        points: -cost,
        date: new Date().toLocaleDateString('uk-UA'),
        time: new Date().toLocaleTimeString('uk-UA', {hour:'2-digit',minute:'2-digit'})
    });
    saveAll();
    return true;
}

function renderCabinet() {
    updateSubscriptionStatus();
    const app = document.getElementById('appRoot');
    const role = currentUser.role || 'user';
    const hasBasic = currentUser.hasBasicPaid;
    const myListings = listings.filter(l => l.seller === currentUser.nickname);
    const activeCount = myListings.filter(l=>l.status==='active').length;
    const soldCount = myListings.filter(l=>l.status==='sold').length;
    const totalViews = myListings.reduce((s,l)=>s+(l.views||0),0);

    // Ліміт оголошень
    let listingLimit = 0, limitLabel = '';
    if (role==='user')        { listingLimit=50;  limitLabel='базовий доступ'; }
    else if (role==='store')        { listingLimit=50;  limitLabel='магазин'; }
    else if (role==='manufacturer') { listingLimit=999; limitLabel='виробник'; }
    else if (role==='waterowner')   { listingLimit=5;   limitLabel='власник водойми'; }

    // ---- Моя водойма ----
    function renderMyWaterTab(content) {
        // Якщо ліцензій немає — показуємо кнопку купити
        if (!currentUser.waterLicenses || currentUser.waterLicenses.length === 0) {
            content.innerHTML = `
            <div class="plan-card" style="text-align:center;">
                <div style="font-size:3rem;margin-bottom:12px;">💧</div>
                <div style="font-weight:700;font-size:1rem;margin-bottom:8px;">У вас ще немає прив'язаної водойми</div>
                <div style="font-size:0.85rem;color:#888;margin-bottom:16px;">Додайте свою водойму безкоштовно</div>
                <button id="buyFirstWaterLic" class="btn btn-block">💧 Додати водойму (Безкоштовно)</button>
            </div>`;
            document.getElementById('buyFirstWaterLic').onclick = () => payWaterOwner();
            return;
        }

        let activeIdx = currentUser.activeWaterIdx || 0;
        const licenses = currentUser.waterLicenses;
        if (activeIdx >= licenses.length) activeIdx = 0;

        function renderWaterEditor() {
            const lic = licenses[activeIdx];
            const myWater = waterbodies.find(w => w.name === lic.name) || waterbodies[0];
            const expDate = lic.expiry ? new Date(lic.expiry).toLocaleDateString('uk-UA') : '—';

            // Перемикач водойм
            let switcherHtml = '';
            if (licenses.length > 1) {
                switcherHtml = `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;">` +
                    licenses.map((l,i) => `<button data-idx="${i}" style="padding:6px 14px;border:2px solid ${i===activeIdx?'#2a5f7a':'#ddd'};border-radius:40px;background:${i===activeIdx?'#e8f4fd':'white'};font-weight:${i===activeIdx?'700':'400'};cursor:pointer;font-size:0.82rem;">${l.name}</button>`).join('') +
                    `</div>`;
            }

            content.innerHTML = `
            <div class="plan-card">
                ${switcherHtml}
                <div style="font-weight:700;font-size:1rem;margin-bottom:2px;">💧 ${lic.name}</div>
                <div style="font-size:0.78rem;color:#27ae60;margin-bottom:14px;">✅ Ліцензія до: ${expDate}</div>
                <div id="wPhotoSlot"></div>
                <div class="input-group"><label>Назва водойми</label>
                <input id="wName" value="${myWater.name}"></div>
                <div class="input-group"><label>📞 Телефон</label>
                <input id="wPhone" type="tel" value="${myWater.phone||currentUser.phone||''}" placeholder="+380XXXXXXXXX"></div>
                <div class="input-group"><label>🌐 Сайт водойми</label>
                <input id="wSite" type="url" value="${myWater.site||currentUser.site||''}" placeholder="https://..."></div>
                <div class="input-group"><label>⏰ Години роботи</label>
                <input id="wHours" value="${myWater.workingHours||''}"></div>
                <div class="input-group"><label>💰 Ціна за день</label>
                <input id="wPrice" value="${myWater.price||''}"></div>
                <div class="input-group"><label>🎁 Акція / промо</label>
                <input id="wPromo" value="${myWater.promo||''}"></div>
                <div class="input-group"><label>🎯 Послуги</label>
                <input id="wServices" value="${myWater.services||''}"></div>
                <div class="input-group"><label>📝 Опис</label>
                <textarea id="wDesc" rows="3" style="border-radius:16px;">${myWater.description||''}</textarea></div>
                <div style="font-weight:700;margin:12px 0 8px;">📍 Геолокація водойми</div>
                <button id="wGeoBtn" class="btn btn-location btn-block" style="margin-bottom:8px;">📍 Визначити автоматично</button>
                <div style="display:flex;gap:8px;">
                    <input id="wLat" type="number" step="0.0001" value="${myWater.lat||''}" placeholder="Широта" style="flex:1;">
                    <input id="wLng" type="number" step="0.0001" value="${myWater.lng||''}" placeholder="Довгота" style="flex:1;">
                </div>
                <button id="saveWaterBtn" class="btn btn-block" style="margin-top:8px;">💾 Зберегти</button>
                <button id="addWaterLicBtn" class="btn btn-secondary btn-block" style="margin-top:8px;">➕ Додати ще одну водойму (Безкоштовно)</button>
                ${(myWater.site||currentUser.site)?`<a href="${myWater.site||currentUser.site}" target="_blank" class="btn btn-secondary btn-block" style="display:block;text-align:center;text-decoration:none;margin-top:8px;">🌐 Сайт водойми</a>`:''}
            </div>`;

            // Фото аплодер
            const wPhotoUploader = createPhotoUploader({
                label: '📷 Фото водойми (до 8 шт)',
                maxPhotos: 8,
                existingPhotos: myWater.photos || (myWater.photo ? [myWater.photo] : [])
            });
            content.querySelector('#wPhotoSlot').appendChild(wPhotoUploader.el);

            // Перемикач
            content.querySelectorAll('[data-idx]').forEach(btn => {
                btn.onclick = () => { activeIdx = parseInt(btn.dataset.idx); currentUser.activeWaterIdx = activeIdx; saveAll(); renderWaterEditor(); };
            });
            document.getElementById('wGeoBtn').onclick = () => getUserLocation(ok => {
                if (ok) { document.getElementById('wLat').value=currentLocation.lat.toFixed(6); document.getElementById('wLng').value=currentLocation.lng.toFixed(6); }
            });
            document.getElementById('saveWaterBtn').onclick = () => {
                myWater.name = document.getElementById('wName').value.trim() || myWater.name;
                myWater.phone = document.getElementById('wPhone').value.trim();
                myWater.site = document.getElementById('wSite').value.trim();
                myWater.workingHours = document.getElementById('wHours').value.trim();
                myWater.price = document.getElementById('wPrice').value.trim();
                myWater.promo = document.getElementById('wPromo').value.trim();
                myWater.services = document.getElementById('wServices').value.trim();
                myWater.description = document.getElementById('wDesc').value.trim();
                myWater.photos = wPhotoUploader.getPhotos();
                myWater.photo = wPhotoUploader.getFirst();
                const lat = parseFloat(document.getElementById('wLat').value);
                const lng = parseFloat(document.getElementById('wLng').value);
                if (!isNaN(lat) && !isNaN(lng)) { myWater.lat=lat; myWater.lng=lng; }
                saveAll(); alert("✅ Водойму оновлено!");
            };
            document.getElementById('addWaterLicBtn').onclick = () => payWaterOwner();
        }
        renderWaterEditor();
    }

                        </div>
                    </div>
                    <div style="display:flex;gap:8px;margin-top:10px;">
                        <button class="btn-edit-tour" data-id="${tour.id}" style="flex:1;background:#e3f2fd;color:#1565c0;border:none;border-radius:40px;padding:8px;font-weight:700;cursor:pointer;font-size:0.82rem;">✏️ Редагувати</button>
                        <button class="btn-del-tour" data-id="${tour.id}" style="flex:1;background:#fce4ec;color:#c62828;border:none;border-radius:40px;padding:8px;font-weight:700;cursor:pointer;font-size:0.82rem;">🗑️ Видалити</button>
                    </div>`;
                listDiv.appendChild(div);
                div.querySelector('.btn-del-tour').onclick = () => {
                    if (confirm(`Видалити тур "${tour.title}"?`)) {

                        if (idx>=0) tours.splice(idx,1);
                        saveAll(); renderMyToursTab(content);
                    }
                };
                div.querySelector('.btn-edit-tour').onclick = () => showAddTourModal(() => renderMyToursTab(content), tour);
            });
        }

        document.getElementById('addTourAgencyBtn')?.addEventListener('click', () => {
            showAddTourModal(() => renderMyToursTab(content));
        });
    }

    // ---- Новини виробника ----
    function renderMyNewsTab(content) {
        content.innerHTML = `<button id="addNewsBtn" class="btn btn-block" style="margin-bottom:16px;">📝 Додати новину</button>` +
        newsItems.map((n,i)=>`<div class="plan-card"><strong>${n.title}</strong><br><small>${n.content}</small><br><button class="btn-del-l" data-i="${i}" style="border:none;border-radius:40px;padding:6px 14px;cursor:pointer;margin-top:8px;background:#fce4ec;color:#c62828;">🗑️ Видалити</button></div>`).join('');
        document.getElementById('addNewsBtn').onclick = () => {
            const modal = openModal(`<h3>📝 Нова новина</h3><input id="nTitle" placeholder="Заголовок"><textarea id="nContent" placeholder="Текст"></textarea><input id="nLink" placeholder="Посилання (необов'язково)"><button id="saveNews" class="btn btn-block">Опублікувати</button><button class="close-modal">Скасувати</button>`);
            modal.querySelector('.close-modal').onclick=()=>modal.remove();
            document.getElementById('saveNews').onclick=()=>{const t=document.getElementById('nTitle').value.trim(),c=document.getElementById('nContent').value.trim();if(!t||!c){alert("Заповніть поля");return;}newsItems.push({title:t,content:c,link:document.getElementById('nLink').value||'#'});saveAll();modal.remove();renderMyNewsTab(content);};
        };
        content.querySelectorAll('.btn-del-l').forEach(b=>{b.onclick=()=>{if(confirm('Видалити?')){newsItems.splice(parseInt(b.dataset.i),1);saveAll();renderMyNewsTab(content);}}});
    }
}

// ---- Форми оголошень ----
function showAddListingModal(onDone, presetCat=null, presetSub=null) {
    const catOptions = SECONDHAND_CATS.map(c=>`<option value="${c.id}" ${c.id===presetCat?'selected':''}>${c.label}</option>`).join('');
    const modal = openModal(`<h3>📢 Нове рекламне оголошення</h3>
        <div id="photoUploaderSlot"></div>
        <input id="lTitle" placeholder="Назва товару" style="margin-top:8px;">
        <input id="lPrice" type="number" placeholder="Ціна (грн)">
        <textarea id="lDesc" placeholder="Опис товару або послуги, контакти, умови..." rows="3"></textarea>
        <select id="lCat" style="margin-bottom:8px;">${catOptions}</select>
        <input id="lSub" placeholder="Підкатегорія (напр. Карпові, Honda, до 5м...)" value="${presetSub||''}">
        <button id="saveListing" class="btn btn-block" style="margin-top:8px;">📢 Розмістити оголошення</button>
        <button class="close-modal">Скасувати</button>`);

    const uploader = createPhotoUploader({ label:'📷 Фото товару (до 5 шт)', maxPhotos:5 });
    modal.querySelector('#photoUploaderSlot').appendChild(uploader.el);
    modal.querySelector('.close-modal').onclick = () => modal.remove();

    modal.querySelector('#saveListing').onclick = async () => {
        const title = modal.querySelector('#lTitle').value.trim();
        const price = parseInt(modal.querySelector('#lPrice').value);
        if (!title || isNaN(price)) { alert("Назва та ціна обов'язкові"); return; }
        const btn = modal.querySelector('#saveListing');
        btn.textContent = '⏳ Зберігаємо...'; btn.disabled = true;
        listings.push({
            id: Date.now(), seller: currentUser.nickname, title, price,
            desc: modal.querySelector('#lDesc').value,
            photo: uploader.getFirst(),
            photos: uploader.getPhotos(),
            category: modal.querySelector('#lCat').value,
            subcategory: modal.querySelector('#lSub').value.trim(),
            status:'active', views:0, date: new Date().toLocaleDateString('uk-UA')
        });
        saveAll(); modal.remove();
        if (onDone) onDone();
    };
}

function showEditListingModal(l, onDone) {
    const catOptions = Object.keys(categoryLabels).map(k=>`<option value="${k}" ${k===l.category?'selected':''}>${categoryLabels[k]}</option>`).join('');
    const modal = openModal(`<h3>✏️ Редагування</h3>
        <div id="photoUploaderSlot"></div>
        <input id="lTitle" value="${l.title}" style="margin-top:8px;">
        <input id="lPrice" type="number" value="${l.price}">
        <textarea id="lDesc" rows="3">${l.desc}</textarea>
        <select id="lCat">${catOptions}</select>
        <button id="saveListing" class="btn btn-block" style="margin-top:8px;">💾 Зберегти</button>
        <button class="close-modal">Скасувати</button>`);

    const existingPhotos = l.photos || (l.photo ? [l.photo] : []);
    const uploader = createPhotoUploader({ label:'📷 Фото товару', maxPhotos:5, existingPhotos });
    modal.querySelector('#photoUploaderSlot').appendChild(uploader.el);
    modal.querySelector('.close-modal').onclick = () => modal.remove();

    modal.querySelector('#saveListing').onclick = async () => {
        l.title = modal.querySelector('#lTitle').value.trim();
        l.price = parseInt(modal.querySelector('#lPrice').value) || l.price;
        l.desc = modal.querySelector('#lDesc').value;
        l.category = modal.querySelector('#lCat').value;
        l.photo = uploader.getFirst();
        l.photos = uploader.getPhotos();
        saveAll(); modal.remove(); if (onDone) onDone();
    };
}

function renderCampings() {
    ensureLeafletFallback();
    
    const app = document.getElementById('appRoot');
    app.innerHTML = `
    <div class="nickname-header">👤 ${currentUser.nickname}</div>
    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h1>🏕️ Кемпінги</h1>
            <button id="backCampings" class="back-btn">← Назад</button>
        </div>
        <div class="search-bar">
            <input id="campSearch" placeholder="🔍 Пошук кемпінгу...">
            <button id="campSortBtn" class="btn btn-secondary">📍 Поруч</button>
        </div>
        <button id="getCampLocation" class="btn btn-location btn-block">📍 Визначити моє місце</button>
        <div id="campLocationStatus" style="margin:8px 0;font-size:0.85rem;color:#888;text-align:center;"></div>
        <div id="campMap" class="map-container"></div>
        <div id="campList"></div>
    </div>`;
    document.getElementById('backCampings').onclick = () => renderMainMenu();
    document.getElementById('getCampLocation').onclick = () => {
        getUserLocation(ok => {
            if(ok) {
                const acc = currentLocation.accuracy ? ` (±${Math.round(currentLocation.accuracy)}м)` : '';
                document.getElementById('campLocationStatus').innerHTML = `✅ Місце визначено: ${currentLocation.lat.toFixed(4)}, ${currentLocation.lng.toFixed(4)}${acc}`;
                renderCampList(true);
            } else {
                document.getElementById('campLocationStatus').innerHTML = '❌ Не вдалося визначити місце';
            }
        });
    };
    document.getElementById('campSortBtn').onclick = () => { 
        if(!currentLocation){alert("❌ Спочатку натисніть 'Визначити моє місце'");return;} 
        renderCampList(true); 
    };
    document.getElementById('campSearch').oninput = () => renderCampList(false);

    let campMap = null;
    function renderCampList(sortByDist) {
        const q = document.getElementById('campSearch').value.toLowerCase();
        let filtered = campings.filter(c => 
            c.name.toLowerCase().includes(q) || 
            c.city.toLowerCase().includes(q) ||
            c.services.toLowerCase().includes(q)
        );
        if (sortByDist && currentLocation) {
            filtered.sort((a,b)=>
                getDistance(currentLocation.lat,currentLocation.lng,a.lat,a.lng)-
                getDistance(currentLocation.lat,currentLocation.lng,b.lat,b.lng)
            );
        }
        const listDiv = document.getElementById('campList');
        listDiv.innerHTML = '';
        const mapDiv = document.getElementById('campMap');
        if (campMap) campMap.remove();
        campMap = L.map(mapDiv).setView([49,32],6);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'OSM'}).addTo(campMap);
        setTimeout(() => { if(campMap) campMap.invalidateSize(); }, 300);
        
        filtered.forEach(c => {
            L.marker([c.lat,c.lng]).addTo(campMap).bindPopup(`<b>${c.name}</b><br>📍 ${c.city}`);
            let dist = currentLocation ? `<div style="color:#27ae60;font-size:0.85rem;font-weight:700;margin-top:8px;">📏 ${Math.round(getDistance(currentLocation.lat,currentLocation.lng,c.lat,c.lng)/1000)} км від вас</div>` : '';
            const card = document.createElement('div');
            card.style.cssText = 'background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);cursor:pointer;';
            card.innerHTML = `
                <div style="font-size:1.8rem;margin-bottom:8px;">⛺</div>
                <div style="font-weight:800;font-size:1.05rem;color:#1f3b4c;margin-bottom:4px;">${c.name}</div>
                <div style="font-size:0.85rem;color:#888;margin-bottom:8px;">📍 ${c.city}</div>
                <div style="font-size:0.82rem;color:#555;margin-bottom:8px;">${c.services}</div>
                <div style="display:flex;gap:6px;align-items:center;">
                    <a href="tel:${c.phone}" style="background:#27ae60;color:white;padding:6px 14px;border-radius:20px;text-decoration:none;font-size:0.8rem;font-weight:700;">📞 ${c.phone}</a>
                    <button onclick="event.stopPropagation();window.open('https://www.google.com/maps?q=${c.lat},${c.lng}','_blank')" style="background:#3b82f6;color:white;border:none;padding:6px 14px;border-radius:20px;font-size:0.8rem;font-weight:700;cursor:pointer;">🗺️ Карта</button>
                </div>
                ${dist}`;
            listDiv.appendChild(card);
        });
        if (currentLocation) { 
            campMap.setView([currentLocation.lat,currentLocation.lng],8); 
            L.marker([currentLocation.lat,currentLocation.lng]).addTo(campMap).bindPopup('📍 Ви тут'); 
        }
    }
    renderCampList(false);
}

function renderWaterbodies() {
    ensureLeafletFallback();
    
    const app = document.getElementById('appRoot');
    app.innerHTML = `
    <div class="nickname-header">👤 ${currentUser.nickname}</div>
    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h1>🗺️ Водойми</h1><button id="backWater" class="back-btn">← Назад</button>
        </div>
        <button id="getLocationBtn" class="btn btn-location btn-block">📍 Визначити моє місце</button>
        <div id="locationStatus" style="margin-bottom:12px;font-size:0.85rem;color:#888;"></div>
        <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
            <button id="waterSortNearby" class="btn btn-secondary" style="flex:1;min-width:80px;">📍 Поруч</button>
            <button id="waterFilterAll"  class="btn btn-secondary" style="flex:1;min-width:60px;">🗺️ Всі</button>
            <button id="waterFilterFree" class="btn btn-secondary" style="flex:1;min-width:80px;">🎣 Безкоштовні</button>
            <button id="waterFilterPaid" class="btn btn-secondary" style="flex:1;min-width:60px;">💰 Платні</button>
        </div>
        <div id="waterMap" class="map-container"></div>
        <div id="waterList"></div>
    </div>`;
    document.getElementById('backWater').onclick = () => renderMainMenu();
    function renderWaterCards() {
        const acc = currentLocation?.accuracy ? ` (±${Math.round(currentLocation.accuracy)}м)` : '';
        document.getElementById('locationStatus').innerHTML = currentLocation ? `✅ ${currentLocation.lat.toFixed(5)}, ${currentLocation.lng.toFixed(5)}${acc}` : '❌ Місце не визначено';
        var listDiv = document.getElementById('waterList');
        listDiv.innerHTML = '';
        var displayList = waterbodies.slice();
        if (typeof waterFilter !== 'undefined') {
            if (waterFilter === 'free') displayList = displayList.filter(function(w){ return !w.paid; });
            if (waterFilter === 'paid') displayList = displayList.filter(function(w){ return  w.paid; });
        }
        if (typeof waterSortNearby !== 'undefined' && waterSortNearby && currentLocation) {
            displayList.sort(function(a,b){ return getDistance(currentLocation.lat,currentLocation.lng,a.lat,a.lng) - getDistance(currentLocation.lat,currentLocation.lng,b.lat,b.lng); });
        }
        if (displayList.length === 0) {
            listDiv.innerHTML = '<div style="text-align:center;padding:24px;color:#888;">Нічого не знайдено</div>';
        }
        displayList.forEach(water => {
            const statusClass = water.status==='biting'?'status-biting':water.status==='not_biting'?'status-not-biting':'status-unknown';
            const statusText = water.status==='biting'?'🟢 Клює!':water.status==='not_biting'?'🔴 Не клює':'⚪ Немає даних';
            const crowns = '👑'.repeat(Math.min(water.crown||0,5))+(water.crown>5?`+${water.crown-5}`:'');
            const card = document.createElement('div');
            card.className = 'water-card';
            if (water.paid) card.onclick = e => { if(e.target.tagName!=='BUTTON') showWaterDetails(water); };
            card.innerHTML = `
                <div class="water-header">
                    <span class="water-name">${water.name} <span style="color:#f39c12">${crowns}</span></span>
                    ${water.paid?'<span class="price-badge">💰 Платна</span>':'<span class="free-badge">🎣 Безкоштовна</span>'}
                </div>
                ${water.promo?`<div class="promo">🎁 ${water.promo}</div>`:''}
                <div class="status ${statusClass}">${statusText}</div>
                <div class="clickable-coord" data-lat="${water.lat}" data-lng="${water.lng}">📍 ${water.lat}, ${water.lng}</div>
                <div>
                    <button class="action-btn" id="bite_${water.id}" ${!canChangeStatus(water.lat,water.lng)?'disabled':''}>🐟 Клює</button>
                    <button class="action-btn" id="nobite_${water.id}" ${!canChangeStatus(water.lat,water.lng)?'disabled':''}>😴 Не клює</button>
                    <button class="action-btn" id="crown_${water.id}" ${!canChangeStatus(water.lat,water.lng)?'disabled':''}>👑 +Рейтинг</button>
                </div>
                <div class="alarm-future">📡 Сигналізатор GTR (підключення)</div>`;
            listDiv.appendChild(card);
            card.querySelector(`#bite_${water.id}`).onclick = e => { e.stopPropagation();  if(!canChangeStatus(water.lat,water.lng)){alert("❌ Потрібно бути в радіусі 300 м");return;} water.status='biting'; saveAll(); const p=addPoints('checkin',`📍 Чекін «Клює» — ${water.name}`); if(p) alert(`✅ Чекін збережено! +${p} балів 🏅`); renderWaterCards(); };
            card.querySelector(`#nobite_${water.id}`).onclick = e => { e.stopPropagation();  if(!canChangeStatus(water.lat,water.lng)){alert("❌ Потрібно бути в радіусі 300 м");return;} water.status='not_biting'; saveAll(); const p=addPoints('checkin',`📍 Чекін «Не клює» — ${water.name}`); if(p) alert(`✅ Чекін збережено! +${p} балів 🏅`); renderWaterCards(); };
            card.querySelector(`#crown_${water.id}`).onclick = e => { e.stopPropagation(); if(!canChangeStatus(water.lat,water.lng)){alert("❌ Потрібно бути в радіусі 300 м");return;} water.crown=(water.crown||0)+1; saveAll(); renderWaterCards(); };
            card.querySelector('.clickable-coord').onclick = e => { e.stopPropagation(); window.open(`https://www.google.com/maps?q=${water.lat},${water.lng}`,'_blank'); };
        });
        if (mapWater) mapWater.remove();
        const mapDiv = document.getElementById('waterMap');
        if (!mapDiv) return;
        mapWater = L.map(mapDiv, { zoomControl: true }).setView([49,32],6);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'OSM'}).addTo(mapWater);
        waterbodies.forEach(w => {
            const icon = L.divIcon({ html: w.status==='biting'?'🟢':w.status==='not_biting'?'🔴':'⚪', className:'', iconSize:[24,24] });
            const wStatusText = w.status==='biting'?'🟢 Клює':w.status==='not_biting'?'🔴 Не клює':'⚪ Невідомо';
            L.marker([w.lat,w.lng], {icon}).addTo(mapWater).bindPopup('<b>'+w.name+'</b><br>'+wStatusText+'<br>👑 '+(w.crown||0));
        });
        if (currentLocation) { mapWater.setView([currentLocation.lat,currentLocation.lng],12); L.marker([currentLocation.lat,currentLocation.lng]).addTo(mapWater).bindPopup('📍 Ви тут'); }
        // Фікс для планшету — карта не рендерилась в прихованому контейнері
        setTimeout(() => { if(mapWater) mapWater.invalidateSize(); }, 300);
    }
    document.getElementById('getLocationBtn').onclick = () => getUserLocation(()=>{ updateWaterFilterButtons(); renderWaterCards(); });

    var waterFilter = 'all';
    var waterSortNearby = false;

    function updateWaterFilterButtons() {
        var btnAll  = document.getElementById('waterFilterAll');
        var btnFree = document.getElementById('waterFilterFree');
        var btnPaid = document.getElementById('waterFilterPaid');
        var btnNear = document.getElementById('waterSortNearby');
        if (!btnAll) return;
        [btnAll, btnFree, btnPaid].forEach(function(b) { b.style.background=''; b.style.color=''; });
        var active = waterFilter==='free' ? btnFree : waterFilter==='paid' ? btnPaid : btnAll;
        active.style.background = '#2196F3';
        active.style.color = '#fff';
        btnNear.style.background = waterSortNearby ? '#27ae60' : '';
        btnNear.style.color      = waterSortNearby ? '#fff'    : '';
    }

    document.getElementById('waterFilterAll').onclick = function() {
        waterFilter = 'all'; waterSortNearby = false; updateWaterFilterButtons(); renderWaterCards();
    };
    document.getElementById('waterFilterFree').onclick = function() {
        waterFilter = 'free'; updateWaterFilterButtons(); renderWaterCards();
    };
    document.getElementById('waterFilterPaid').onclick = function() {
        waterFilter = 'paid'; updateWaterFilterButtons(); renderWaterCards();
    };
    document.getElementById('waterSortNearby').onclick = function() {
        if (!currentLocation) {
            getUserLocation(function() { waterSortNearby = true; updateWaterFilterButtons(); renderWaterCards(); });
            return;
        }
        waterSortNearby = !waterSortNearby;
        updateWaterFilterButtons(); renderWaterCards();
    };

    updateWaterFilterButtons();
    renderWaterCards();
}

        <p>💰 ${water.price||'—'}</p><p>📞 ${water.phone||'—'}</p>
        <p>⏰ ${water.workingHours||'—'}</p><p>🎯 ${water.services||'—'}</p>

}

            : '<button id="gtrAdminLoginBtn" style="background:transparent;border:none;color:#bbb;font-size:0.72rem;cursor:pointer;">⚙️</button>'
        ) +
    '</div>';

    gtrShopProducts.forEach(function(p) {
        html += '<div style="background:#fff;border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.07);' + (!p.available ? 'opacity:0.5;' : '') + '">' +
            '<div style="display:flex;align-items:center;gap:12px;">' +
                '<div style="font-size:2rem;flex-shrink:0;">' + p.emoji + '</div>' +
                '<div style="flex:1;">' +
                    '<div style="font-weight:700;font-size:0.92rem;">' + p.name + '</div>' +
                    '<div style="font-size:0.78rem;color:#888;margin-top:2px;">' + p.desc + '</div>' +
                '</div>' +
            '</div>' +
            '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;">' +
                '<div style="font-size:1.2rem;font-weight:900;color:#f39c12;">&#x20B4;' + p.price + '</div>' +
                '<div style="display:flex;gap:8px;">' +
                    (isAdmin ? '<button onclick="gtrEditProduct(' + p.id + ')" style="background:#eee;border:none;border-radius:40px;padding:8px 12px;font-size:0.78rem;cursor:pointer;">✏️ Ред.</button>' : '') +
                    (p.available
                        ? '<button onclick="showOrderForm('' + p.name + '',' + p.price + ')" style="background:#1f3b4c;color:#fff;border:none;border-radius:40px;padding:8px 16px;font-weight:700;font-size:0.82rem;cursor:pointer;">🛒 Замовити</button>'
                        : '<span style="color:#bbb;font-size:0.78rem;">Немає в наявності</span>'
                    ) +
                '</div>' +
            '</div>' +
        '</div>';
    });

    if (isAdmin) {
        html += '<button onclick="gtrAddProduct()" style="width:100%;background:#27ae60;color:#fff;border:none;border-radius:16px;padding:14px;font-weight:700;font-size:0.9rem;cursor:pointer;margin-top:4px;">+ Додати товар</button>';
        html += '<button onclick="sessionStorage.removeItem('gtr_admin');renderGTRShop();" style="width:100%;background:#eee;border:none;border-radius:16px;padding:12px;font-size:0.82rem;cursor:pointer;margin-top:8px;">Вийти з адміну</button>';
    }

    el.innerHTML = html;

    if (!isAdmin) {
        var adminBtn = document.getElementById('gtrAdminLoginBtn');
        if (adminBtn) adminBtn.onclick = function() {
            var pass = prompt('Пароль адміністратора:');
            if (pass === GTR_ADMIN_PASS) {
                sessionStorage.setItem('gtr_admin', '1');
                renderGTRShop();
            } else if (pass !== null) {
                alert('Невірний пароль');
            }
        };
    }
}

function gtrEditProduct(id) {
    var p = gtrShopProducts.find(function(x) { return x.id === id; });
    if (!p) return;
    var name  = prompt('Назва:', p.name);
    if (name === null) return;
    var desc  = prompt('Опис:', p.desc);
    if (desc === null) return;
    var price = prompt('Ціна (грн):', p.price);
    if (price === null) return;
    var avail = confirm('Є в наявності?');
    p.name = name;
    p.desc = desc;
    p.price = parseInt(price) || p.price;
    p.available = avail;
    saveGTRProducts();
    renderGTRShop();
}

function gtrAddProduct() {
    var name  = prompt('Назва товару:');
    if (!name) return;
    var desc  = prompt('Опис:');
    var price = prompt('Ціна (грн):');
    var emoji = prompt('Емодзі:', '📦');
    var newId = Math.max.apply(null, gtrShopProducts.map(function(x){return x.id;})) + 1;
    gtrShopProducts.push({ id: newId, name: name, desc: desc || '', price: parseInt(price) || 0, emoji: emoji || '📦', available: true });
    saveGTRProducts();
    renderGTRShop();
}

    // ---- КАРТА МАГАЗИНІВ ----
    function renderStoreList(sortByDist=false) {

                        <span style="font-size:0.82rem;color:#888;">📍 ${s.address}</span><br>
                        <span style="font-size:0.8rem;color:#555;">🎣 ${s.gear.substring(0,55)}...</span><br>
                        ${s.site
                            ? `<a href="${s.site}" target="_blank" style="color:#1565c0;font-size:0.8rem;font-weight:600;">🌐 ${s.site.replace('https://','')}</a>`
                            : `<span style="font-size:0.75rem;color:#f39c12;font-weight:600;">💡 Немає сайту? Замовляйте на site@magicfish.club</span>`}
                    </div>
                    <div style="text-align:right;flex-shrink:0;">
                        ${dist}
                        ${prodCount > 0 ? `<div style="background:#e8f5e9;color:#2e7d32;border-radius:40px;padding:3px 10px;font-size:0.75rem;font-weight:700;margin-top:4px;">${prodCount} товарів</div>` : ''}
                    </div>
                </div>`;
            card.onclick = () => showStoreModal(s);
            listDiv.appendChild(card);
        });
        if (currentLocation) { storeMap.setView([currentLocation.lat,currentLocation.lng],12); L.marker([currentLocation.lat,currentLocation.lng]).addTo(storeMap).bindPopup('Ви тут'); }

    // ---- КАТАЛОГ ТОВАРІВ ----
    function renderCatalogCategories() {
        currentCatId = null; currentSub = null; currentBrand = null;
        const content = document.getElementById('catalogContent');
        const counts = {};
        storeProducts.forEach(p => { counts[p.category] = (counts[p.category]||0)+1; });

        content.innerHTML = `
        <div style="font-size:0.8rem;font-weight:700;color:#888;letter-spacing:1px;margin-bottom:12px;">КАТЕГОРІЇ НОВИХ ТОВАРІВ</div>

            ${SECONDHAND_CATS.filter(c => counts[c.id] > 0 || true).map(cat => {
                const cnt = counts[cat.id] || 0;
                return `<button data-cat="${cat.id}" style="background:white;border:1.5px solid ${cnt>0?'#2a5f7a':'#eee'};border-radius:18px;padding:14px 10px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 2px 6px rgba(0,0,0,0.06);${cnt===0?'opacity:0.5':''}">
                    <span style="font-size:1.3rem;">${cat.icon}</span>
                    <div>

                    </div>
                </button>`;
            }).join('')}
        </div>`;

        content.querySelectorAll('[data-cat]').forEach(btn => {
            btn.onclick = () => { currentCatId = btn.dataset.cat; renderCatalogSubcats(); };
        });
    }

    function renderCatalogSubcats() {
        const cat = SECONDHAND_CATS.find(c=>c.id===currentCatId);
        const content = document.getElementById('catalogContent');
        const prods = storeProducts.filter(p=>p.category===currentCatId);

        let brandsHtml = '';
        if (cat.brands) {
            const activeBrands = [...new Set(prods.map(p=>p.brand).filter(Boolean))];
            if (activeBrands.length > 0) {
                brandsHtml = `<div style="font-size:0.8rem;font-weight:700;color:#888;margin:12px 0 8px;">БРЕНДИ</div>
                <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;">
                    ${activeBrands.map(b=>`<button data-brand="${b}" style="background:#e8f4fd;color:#1565c0;border:none;border-radius:40px;padding:6px 14px;font-size:0.82rem;font-weight:600;cursor:pointer;">${b}</button>`).join('')}
                </div>`;
            }
        }

        content.innerHTML = `
        <button id="backToCatsCat" style="background:#eee;border:none;border-radius:40px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:0.85rem;margin-bottom:12px;">← Назад</button>
        <div style="font-weight:800;font-size:1rem;color:#1f3b4c;margin-bottom:12px;">${cat.label}</div>
        <button data-sub="__all__" style="width:100%;background:linear-gradient(135deg,#1f3b4c,#2a5f7a);color:white;border:none;border-radius:16px;padding:12px;font-weight:700;cursor:pointer;margin-bottom:12px;">
            📋 Всі товари категорії (${prods.length})
        </button>
        ${brandsHtml}
        <div style="font-size:0.8rem;font-weight:700;color:#888;margin-bottom:8px;">ПІДКАТЕГОРІЇ</div>
        <div style="display:flex;flex-direction:column;gap:6px;">
            ${cat.sub.map(s => {
                const cnt = prods.filter(p=>p.subcategory===s).length;
                return `<button data-sub="${s}" style="background:white;border:1.5px solid #eee;border-radius:14px;padding:12px 16px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,0.05);${cnt===0?'opacity:0.5':''}">
                    <span style="font-size:0.88rem;font-weight:600;color:#1f3b4c;">${s}</span>
                    <span style="font-size:0.75rem;color:#aaa;background:#f0f0f0;padding:2px 10px;border-radius:40px;">${cnt}</span>
                </button>`;
            }).join('')}
        </div>`;

        document.getElementById('backToCatsCat').onclick = () => renderCatalogCategories();
        content.querySelectorAll('[data-brand]').forEach(btn => {
            btn.onclick = () => { currentBrand = btn.dataset.brand; currentSub = null; renderCatalogProducts(); };
        });
        content.querySelectorAll('[data-sub]').forEach(btn => {
            btn.onclick = () => {
                currentSub = btn.dataset.sub === '__all__' ? null : btn.dataset.sub;
                currentBrand = null;
                renderCatalogProducts();
            };
        });
    }

    function renderCatalogProducts() {
        const cat = SECONDHAND_CATS.find(c=>c.id===currentCatId);
        const content = document.getElementById('catalogContent');
        let prods = storeProducts.filter(p=>p.category===currentCatId);
        if (currentSub) prods = prods.filter(p=>p.subcategory===currentSub);
        if (currentBrand) prods = prods.filter(p=>p.brand===currentBrand);

        content.innerHTML = `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
            <button id="backToSubsCat" style="background:#eee;border:none;border-radius:40px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:0.85rem;">← Назад</button>
            <div style="font-weight:700;font-size:0.9rem;color:#1f3b4c;">${cat?.label||''} ${currentSub?'· '+currentSub:''} ${currentBrand?'· '+currentBrand:''}</div>
            <span style="font-size:0.8rem;color:#aaa;">${prods.length} товарів</span>
        </div>
        <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;">
            <button class="sort-cat-btn active" data-s="az" style="background:#1e3a3a;color:white;border:none;border-radius:40px;padding:6px 14px;font-size:0.8rem;font-weight:700;cursor:pointer;">💰 Дешевші</button>
            <button class="sort-cat-btn" data-s="za" style="background:#eee;border:none;border-radius:40px;padding:6px 14px;font-size:0.8rem;font-weight:600;cursor:pointer;">💎 Дорожчі</button>
        </div>
        <div id="catalogProductsList"></div>`;

        document.getElementById('backToSubsCat').onclick = () => renderCatalogSubcats();
        content.querySelectorAll('.sort-cat-btn').forEach(btn => {
            btn.onclick = () => {
                content.querySelectorAll('.sort-cat-btn').forEach(b=>{b.style.background='#eee';b.style.color='#333';});
                btn.style.background='#1e3a3a'; btn.style.color='white';
                if (btn.dataset.s==='za') prods.sort((a,b)=>b.price-a.price);
                else prods.sort((a,b)=>a.price-b.price);
                renderProdList(prods);
            };
        });
        prods.sort((a,b)=>a.price-b.price);
        renderProdList(prods);
    }

    function renderProdList(prods) {
        const listDiv = document.getElementById('catalogProductsList');
        if (!listDiv) return;
        if (prods.length === 0) {
            listDiv.innerHTML = '<div style="text-align:center;padding:30px;color:#aaa;">😕 Товарів не знайдено</div>';
            return;
        }
        listDiv.innerHTML = '';
        prods.forEach(p => {
            const store = stores.find(s=>s.id===p.storeId);
            const div = document.createElement('div');
            div.style.cssText = 'background:white;border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.07);cursor:pointer;transition:0.15s;';
            div.onmouseover = () => div.style.background='#fef9e6';
            div.onmouseout  = () => div.style.background='white';
            div.innerHTML = `
                <div style="display:flex;gap:12px;align-items:flex-start;">
                    <div style="width:80px;height:80px;border-radius:14px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0;">
                        ${p.photo ? `<img src="${p.photo}" style="width:100%;height:100%;object-fit:cover;border-radius:14px;">` : (SECONDHAND_CATS.find(c=>c.id===p.category)?.icon||'🎣')}
                    </div>
                    <div style="flex:1;min-width:0;">
                        <div style="font-size:0.72rem;color:#1565c0;font-weight:600;">${p.brand||''} · ${p.storeName}</div>
                        <div style="font-weight:700;font-size:0.95rem;color:#1f3b4c;margin:2px 0;">${p.title}</div>
                        <div style="font-size:1.1rem;font-weight:900;color:#f39c12;">${sym}${p.price.toLocaleString()}</div>
                        <div style="font-size:0.78rem;color:#888;margin-top:2px;">${p.desc.substring(0,60)}${p.desc.length>60?'...':''}</div>
                        <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;">
                            ${p.inStock ? '<span style="background:#e8f5e9;color:#2e7d32;padding:3px 10px;border-radius:40px;font-size:0.72rem;font-weight:700;">✅ В наявності</span>' : '<span style="background:#fce4ec;color:#c62828;padding:3px 10px;border-radius:40px;font-size:0.72rem;font-weight:700;">❌ Немає</span>'}
                            ${p.subcategory ? `<span style="background:#f3e5f5;color:#6a1b9a;padding:3px 10px;border-radius:40px;font-size:0.72rem;">${p.subcategory}</span>` : ''}
                        </div>
                    </div>
                </div>`;
            div.onclick = () => showStoreProductModal(p, store);
            listDiv.appendChild(div);
        });
    }

    // Пошук по каталогу
    document.getElementById('catSearchBtn').onclick = () => {
        const q = document.getElementById('catSearch').value.trim().toLowerCase();
        if (!q) { renderCatalogCategories(); return; }
        const found = storeProducts.filter(p =>
            p.title.toLowerCase().includes(q) ||
            (p.brand||'').toLowerCase().includes(q) ||
            p.desc.toLowerCase().includes(q) ||
            (p.subcategory||'').toLowerCase().includes(q) ||
            p.storeName.toLowerCase().includes(q)
        );
        const content = document.getElementById('catalogContent');
        content.innerHTML = `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
            <button id="backFromSearch" style="background:#eee;border:none;border-radius:40px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:0.85rem;">← Назад</button>
            <div>🔍 «${q}» — ${found.length} товарів</div>
        </div>
        <div id="catalogProductsList"></div>`;
        document.getElementById('backFromSearch').onclick = () => renderCatalogCategories();
        renderProdList(found);
    };
    document.getElementById('catSearch').onkeydown = e => {
        if (e.key==='Enter') document.getElementById('catSearchBtn').click();
    };
}

function showStoreModal(s) {
    const sym = getCurrencySymbol();
    const prodCount = storeProducts.filter(p=>p.storeId===s.id).length;
    const m = openModal(`
        <h3>${s.name}</h3>
        <p>📍 ${s.address}</p>
        <p>📞 <a href="tel:${s.phone}" style="color:#1e3a3a;font-weight:700;">${s.phone}</a></p>
        <p>⏰ ${s.hours}</p>

function renderMarketplace() {
    const app = document.getElementById('appRoot');
    const canAdd = canAddListing();

    let currentSub = null;
    let searchQuery = '';

    app.innerHTML = `

    <div class="card" style="padding:0;overflow:hidden;">
      <!-- Шапка -->
      <div style="background:linear-gradient(135deg,#1f3b4c,#2a5f7a);padding:16px 20px;border-radius:48px 48px 0 0;display:flex;align-items:center;justify-content:space-between;">
