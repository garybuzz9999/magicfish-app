    <script>
    // Повний fallback для L якщо Leaflet не завантажився
    function ensureLeafletFallback() {
        if (typeof L !== 'undefined') return; // Leaflet є — все добре
        window.L = {
            _maps: [],
            map: function(el) {
                if (typeof el === 'string') el = document.getElementById(el);
                if (!el) return this._dummyMap();
                // Показуємо OSM iframe як fallback
                const mapObj = {
                    _el: el, _lat: 49, _lng: 32, _zoom: 6,
                    _markers: [],
                    setView: function(latlng, zoom) {
                        this._lat = Array.isArray(latlng) ? latlng[0] : latlng.lat || 49;
                        this._lng = Array.isArray(latlng) ? latlng[1] : latlng.lng || 32;
                        this._zoom = zoom || 6;
                        this._render();
                        return this;
                    },
                    _render: function() {
                        const lat = this._lat, lng = this._lng, z = Math.min(this._zoom, 14);
                        // Bbox для iframe
                        const d = 180 / Math.pow(2, z) * 0.5;
                        const url = `https://www.openstreetmap.org/export/embed.html?bbox=${lng-d},${lat-d},${lng+d},${lat+d}&layer=mapnik`;
                        this._el.innerHTML = `
                            <iframe src="${url}" style="width:100%;height:100%;border:none;border-radius:28px;"></iframe>
                            <div style="position:absolute;bottom:6px;right:8px;font-size:0.65rem;background:rgba(255,255,255,0.85);padding:2px 6px;border-radius:8px;">
                                <a href="https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=${z}/${lat}/${lng}" target="_blank" style="color:#1e3a3a;">🗺️ Відкрити</a>
                            </div>
                            <div id="pins_${Date.now()}" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;"></div>`;
                        this._pinsEl = this._el.querySelector('[id^="pins_"]');
                        return this;
                    },
                    addLayer: function() { return this; },
                    remove: function() { if(this._el) this._el.innerHTML = ''; },
                    invalidateSize: function() { return this; },
                    bindPopup: function() { return this; },
                    on: function() { return this; }
                };
                L._maps.push(mapObj);
                return mapObj;
            },
            _dummyMap: function() {
                return { setView:function(){return this;}, addLayer:function(){return this;}, remove:function(){}, invalidateSize:function(){}, on:function(){return this;} };
            },
            tileLayer: function() { return { addTo: function() { return this; } }; },
            marker: function() { return { addTo: function(){return this;}, bindPopup: function(){return this;}, openPopup: function(){return this;} }; },
            divIcon: function() { return {}; },
            icon: function() { return {}; }
        };
    }

        <div style="font-size:0.75rem;color:#888;margin-bottom:16px;">Оновлюється автоматично</div>

            </div>

                <span style="font-weight:700;color:#27ae60;">1$ = ${uahRate(rates.USD)} ₴</span>
            </div>
            <div style="display:flex;justify-content:space-between;padding:10px;background:#f5f5f5;border-radius:12px;">

// Оновлюємо індикатор курсу в хедері
function updateRateIndicator() {
    const el = document.getElementById('rateIndicator');
    if (!el || appCurrency === 'UAH') return;
    const rate = exchangeRates[appCurrency];
    if (!rate) return;
    const uahRate = Math.round(1/rate);
    el.textContent = ` · 1${CURRENCIES.find(c=>c.code===appCurrency)?.symbol||''} = ${uahRate}₴`;
}

        'блять','бляд','сука','пизд','хуй','хуєв','хуєм','хуєц','піздеж','пізда','піздат',
        'їбать','їбан','єбать','єбан','йобать','йобан','ахуй','нахуй','захуй','похуй',
        'мудак','мудил','мудо','залупа','залуп','дрочи','дроч','дрочун',
        'шлюха','шльоха','повія','бл*','бля',
        // Російські (транслітом)
        'blyad','suka','pizd','khuy','yebat','yoban','mudak','zalupa','droch','shlyukha',
        // З замінами літер
        'п1зд','х*й','б@ять','е6ать',
    ];
    let result = text;
    mats.forEach(mat => {
        const regex = new RegExp(mat, 'gi');
        result = result.replace(regex, m => '*'.repeat(m.length));
    });
    return result;
}

// ========== СИСТЕМА РЕЙТИНГУ ==========
function getUserRank(points) {
    if (points >= 1001) return { label:'Легенда', icon:'👑', color:'#f39c12' };
    if (points >= 501)  return { label:'Майстер', icon:'🏆', color:'#8b5cf6' };
    if (points >= 201)  return { label:'Досвідчений', icon:'🎣', color:'#27ae60' };
    if (points >= 51)   return { label:'Рибалка', icon:'🐟', color:'#3b82f6' };
    return { label:'Новачок', icon:'🪱', color:'#888' };
}

function getUserStage(regDate) {
    if (!regDate) return '';
    const diff = Date.now() - new Date(regDate).getTime();
    const days  = Math.floor(diff / 86400000);
    const months = Math.floor(days / 30);
    const years  = Math.floor(days / 365);
    if (years >= 1)  return `${years} р.`;
    if (months >= 1) return `${months} міс.`;
    return `${days} дн.`;
}

function addPoints(user, action) {
    if (!user) return;
    if (!user.points) user.points = 0;
    const pts = { forum:5, review:3, checkin:2, report:5, news:10, like:1 };
    user.points += (pts[action] || 0);
    saveAll();
}

function renderUserBadge(u, size) {
    // Показує аватар + нікнейм + ранг + стаж
    size = size || 36;
    const rank = getUserRank(u.points || 0);
    const stage = getUserStage(u.regDate);
    const avatar = getUserAvatar(u.nickname, size, u.avatar);
    return `<div style="display:flex;align-items:center;gap:8px;">
        ${avatar}
        <div>
            <div style="font-weight:700;font-size:0.85rem;color:#1f3b4c;">${u.nickname}</div>
            <div style="font-size:0.72rem;color:${rank.color};">${rank.icon} ${rank.label}${stage ? ' · '+stage : ''}</div>
        </div>
    </div>`;
}

function getUserAvatar(nickname, size, avatar) {
    size = size || 36;
    if (avatar) {
        return `<img src="${avatar}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;border:2px solid #e0e0e0;flex-shrink:0;">`;

// ========== ГЕОЛОКАЦІЯ (покращена точність) ==========
function getUserLocation(callback) {
    if (!navigator.geolocation) { 
        console.log('Geolocation not supported');
        if (callback) callback(false); 
        return; 
    }

    // Покращені опції для точності
    const options = {
        enableHighAccuracy: true,  // Максимальна точність
        timeout: 15000,            // 15 секунд на отримання
        maximumAge: 0              // Не використовувати кеш
    };

    const tryGeo = () => navigator.geolocation.getCurrentPosition(
        pos => { 
            currentLocation = {
                lat: pos.coords.latitude, 
                lng: pos.coords.longitude,
                accuracy: pos.coords.accuracy
            };
            console.log('Location obtained:', currentLocation);
            if(callback) callback(true); 
        },
        (err) => {
            console.log('Geolocation error:', err.code, err.message);
            // Показуємо зрозумілу помилку користувачу
            if (err.code === 1) {
                alert('❌ Доступ до геолокації заборонено.\n\nДозвольте доступ до місцезнаходження в налаштуваннях браузера.');
            } else if (err.code === 2) {
                alert('❌ Не вдалося визначити місце.\n\nПеревірте що GPS увімкнено.');
            } else if (err.code === 3) {
                alert('⏱️ Час очікування вийшов.\n\nСпробуйте ще раз.');
            }
            if (callback) callback(false);
        },
        options
    );

    if (window.location.protocol !== 'https:' && window.location.protocol !== 'http:') {
        try { tryGeo(); } catch(e) { 
            console.log('Geolocation exception:', e);
            if (callback) callback(false); 
        }
    } else { 
        tryGeo(); 
    }
}

// ========== UNIVERSAL LOCATION PICKER ==========
function createLocationPicker(opts = {}) {
    const { 
        initialLat = null, 
        initialLng = null, 
        onChange = null,  // callback(lat, lng, address)
        showMap = true,
        country = 'Україна'
    } = opts;

    let selectedLat = initialLat;
    let selectedLng = initialLng;
    let selectedRegion = '';
    let selectedCity = '';
    let pickerMap = null;
    let marker = null;

    const container = document.createElement('div');
    container.style.cssText = 'margin-bottom:14px;';
    
    container.innerHTML = `
        <div style="font-weight:700;margin-bottom:8px;">📍 Місцезнаходження</div>
        
        <!-- GPS Auto -->
        <button id="gpsAutoBtn" type="button" style="width:100%;background:#2c5a6e;color:white;border:none;border-radius:40px;padding:10px;font-weight:700;cursor:pointer;margin-bottom:8px;">📍 Визначити автоматично (GPS)</button>
        
        <!-- Address selector -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
            <select id="regionSelect" style="padding:10px;border-radius:16px;border:1.5px solid #ddd;">
                <option value="">Оберіть область</option>
                ${Object.keys(UA_REGIONS).map(r=>`<option value="${r}">${r}</option>`).join('')}
            </select>
            <select id="citySelect" style="padding:10px;border-radius:16px;border:1.5px solid #ddd;" disabled>
                <option value="">Спочатку область</option>
            </select>
        </div>
        
        <!-- Map -->
        ${showMap ? '<div id="locationPickerMap" style="height:250px;border-radius:16px;margin-bottom:8px;border:2px solid #ddd;"></div>' : ''}
        
        <!-- Manual coords -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <input id="manualLatInput" type="number" step="0.0001" placeholder="Широта" value="${initialLat||''}" style="padding:10px;border-radius:16px;border:1.5px solid #ddd;">
            <input id="manualLngInput" type="number" step="0.0001" placeholder="Довгота" value="${initialLng||''}" style="padding:10px;border-radius:16px;border:1.5px solid #ddd;">
        </div>
        <div id="locationStatus" style="font-size:0.8rem;color:#888;margin-top:6px;"></div>
    `;

    // Initialize map if showMap
    setTimeout(() => {
        if (showMap) {
            ensureLeafletFallback();
            const mapDiv = container.querySelector('#locationPickerMap');
            if (mapDiv && typeof L !== 'undefined') {
                pickerMap = L.map(mapDiv).setView([initialLat || 49, initialLng || 32], initialLat ? 12 : 6);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {attribution:'OSM'}).addTo(pickerMap);
                
                if (initialLat && initialLng) {
                    marker = L.marker([initialLat, initialLng], {draggable: true}).addTo(pickerMap);
                    marker.on('dragend', function(e) {
                        const pos = e.target.getLatLng();
                        updateLocation(pos.lat, pos.lng, 'Переміщено на карті');
                    });
                }
                
                // Click to place marker
                pickerMap.on('click', function(e) {
                    if (marker) pickerMap.removeLayer(marker);
                    marker = L.marker([e.latlng.lat, e.latlng.lng], {draggable: true}).addTo(pickerMap);
                    marker.on('dragend', function(ev) {
                        const pos = ev.target.getLatLng();
                        updateLocation(pos.lat, pos.lng, 'Переміщено на карті');
                    });
                    updateLocation(e.latlng.lat, e.latlng.lng, 'Обрано на карті');
                });
                
                setTimeout(() => { if (pickerMap) pickerMap.invalidateSize(); }, 100);
            }
        }
    }, 100);

    function updateLocation(lat, lng, source) {
        selectedLat = lat;
        selectedLng = lng;
        container.querySelector('#manualLatInput').value = lat.toFixed(6);
        container.querySelector('#manualLngInput').value = lng.toFixed(6);
        const status = container.querySelector('#locationStatus');
        status.textContent = `✅ ${source}: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
        status.style.color = '#27ae60';
        
        if (pickerMap && marker) {
            marker.setLatLng([lat, lng]);
            pickerMap.setView([lat, lng], 12);
        } else if (pickerMap) {
            if (marker) pickerMap.removeLayer(marker);
            marker = L.marker([lat, lng], {draggable: true}).addTo(pickerMap);
            marker.on('dragend', function(e) {
                const pos = e.target.getLatLng();
                updateLocation(pos.lat, pos.lng, 'Переміщено на карті');
            });
            pickerMap.setView([lat, lng], 12);
        }
        
        const address = [selectedCity, selectedRegion, country].filter(Boolean).join(', ');
        if (onChange) onChange(lat, lng, address);
    }

    // GPS button
    container.querySelector('#gpsAutoBtn').onclick = () => {
        const btn = container.querySelector('#gpsAutoBtn');
        btn.textContent = '⏳ Визначаємо...';
        btn.disabled = true;
        getUserLocation(ok => {
            btn.disabled = false;
            btn.textContent = '📍 Визначити автоматично (GPS)';
            if (ok && currentLocation) {
                updateLocation(currentLocation.lat, currentLocation.lng, 'GPS');
            } else {
                const status = container.querySelector('#locationStatus');
                status.textContent = '❌ GPS недоступний. Оберіть на карті або вкажіть область/місто.';
                status.style.color = '#c62828';
            }
        });
    };

    // Region selector
    container.querySelector('#regionSelect').onchange = (e) => {
        selectedRegion = e.target.value;
        const citySelect = container.querySelector('#citySelect');
        if (selectedRegion) {
            const region = UA_REGIONS[selectedRegion];
            citySelect.disabled = false;
            citySelect.innerHTML = '<option value="">Оберіть місто</option>' + 
                region.cities.map(c=>`<option value="${c}">${c}</option>`).join('');
            // Auto-set to region center if no city selected yet
            if (!selectedCity) {
                updateLocation(region.lat, region.lng, `Область: ${selectedRegion}`);
            }
        } else {
            citySelect.disabled = true;
            citySelect.innerHTML = '<option value="">Спочатку область</option>';
        }
    };

    // City selector
    container.querySelector('#citySelect').onchange = (e) => {
        selectedCity = e.target.value;
        if (selectedCity && selectedRegion) {
            const region = UA_REGIONS[selectedRegion];
            // Approximate: use region center + small offset based on city index
            const cityIndex = region.cities.indexOf(selectedCity);
            const lat = region.lat + (cityIndex * 0.05);
            const lng = region.lng + (cityIndex * 0.05);
            updateLocation(lat, lng, `${selectedCity}, ${selectedRegion}`);
        }
    };

    // Manual input
    container.querySelector('#manualLatInput').oninput = (e) => {
        const lat = parseFloat(e.target.value);
        const lng = parseFloat(container.querySelector('#manualLngInput').value);
        if (!isNaN(lat) && !isNaN(lng)) {
            updateLocation(lat, lng, 'Введено вручну');
        }
    };
    container.querySelector('#manualLngInput').oninput = (e) => {
        const lat = parseFloat(container.querySelector('#manualLatInput').value);
        const lng = parseFloat(e.target.value);
        if (!isNaN(lat) && !isNaN(lng)) {
            updateLocation(lat, lng, 'Введено вручну');
        }
    };

    return {
        el: container,
        getLocation: () => ({ lat: selectedLat, lng: selectedLng, region: selectedRegion, city: selectedCity }),
        setLocation: (lat, lng) => updateLocation(lat, lng, 'Встановлено'),
    };
}

// ========== УТИЛІТИ ==========
function getDistance(lat1,lng1,lat2,lng2) {
    const R=6371000, dlat=(lat2-lat1)*Math.PI/180, dlng=(lng2-lng1)*Math.PI/180;
    const a=Math.sin(dlat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dlng/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function canChangeStatus(lat,lng) { return currentLocation && getDistance(currentLocation.lat,currentLocation.lng,lat,lng)<=300; }
function canOrganizeTournament() { return currentUser && ['waterowner','manufacturer','camping','resort','travelagency'].includes(currentUser.role); }
function canAddListing() {
    if (!currentUser) return false;
    const myListings = listings.filter(l=>l.seller===currentUser.nickname&&l.status!=='deleted').length;
    if (currentUser.role==='manufacturer') return true; // unlimited
    if (currentUser.role==='store') return myListings < 50;
    if (currentUser.role==='travelagency') return myListings < 10;
    if (currentUser.role==='waterowner'||currentUser.role==='resort') return myListings < 5;
    if (currentUser.role==='camping') return myListings < 3;
    // Base access (user) gets 50 listings
    return myListings < 50;
}
function myActiveListingsCount() { return listings.filter(l=>l.seller===currentUser.nickname&&l.status==='active').length; }
function getActiveTournamentsCount() { return tournaments.filter(t=>new Date(t.date)>=new Date()).length; }
function getTotalParticipantsCount() { return tournaments.reduce((s,t)=>s+(t.participants?t.participants.length:0),0); }

function updateSubscriptionStatus() {
    const now = new Date();
    const roles = ['seller','store','waterowner','manufacturer'];
    const expFields = { store:'storeExpiry', waterowner:'waterOwnerExpiry', manufacturer:'manufacturerExpiry', camping:'campingExpiry', resort:'resortExpiry', travelagency:'travelagencyExpiry' };
    roles.forEach(r => { if (currentUser.role===r && currentUser[expFields[r]] && new Date(currentUser[expFields[r]])<now) { currentUser.role='user'; currentUser[expFields[r]]=null; } });
    saveAll();
}

function openModal(html) {
    const modal = document.createElement('div');
    modal.className = 'modal active';
    modal.innerHTML = `<div class="modal-content">${html}</div>`;
    document.body.appendChild(modal);
    modal.addEventListener('click', e => { if(e.target===modal) modal.remove(); });
    return modal;
}

// Повертає DOM-елемент + метод getBase64()
function createPhotoUploader(opts = {}) {
    const {
        label = '📷 Фото',
        maxPhotos = 5,
        existingPhotos = [],  // масив base64 або URL
        capture = false       // true = одразу відкриває камеру
    } = opts;

    let photos = [...existingPhotos]; // масив base64

    const wrap = document.createElement('div');
    wrap.style.cssText = 'margin-bottom:16px;';

    function render() {
        wrap.innerHTML = `
        <div style="font-weight:600;font-size:0.9rem;margin-bottom:8px;">${label}</div>
        <div id="photoGrid" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;">
            ${photos.map((p, i) => `
            <div style="position:relative;width:80px;height:80px;flex-shrink:0;">
                <img src="${p}" style="width:80px;height:80px;object-fit:cover;border-radius:14px;border:2px solid #eee;">
                <button data-del="${i}" style="position:absolute;top:-6px;right:-6px;background:#e74c3c;color:white;border:none;border-radius:50%;width:22px;height:22px;font-size:0.75rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:900;line-height:1;">✕</button>
            </div>`).join('')}
            ${photos.length < maxPhotos ? `
            <label style="width:80px;height:80px;border:2px dashed #ccc;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#fafafa;flex-shrink:0;transition:0.2s;" id="addPhotoLabel">
                <span style="font-size:1.5rem;">📷</span>
                <span style="font-size:0.65rem;color:#aaa;margin-top:2px;">Додати</span>
                <input type="file" accept="image/*" ${capture?'capture="environment"':''} multiple style="display:none;" id="photoFileInput">
            </label>` : ''}
        </div>
        <div style="font-size:0.72rem;color:#aaa;">До ${maxPhotos} фото · JPG, PNG · Перше фото — головне</div>`;

        // Видалення фото
        wrap.querySelectorAll('[data-del]').forEach(btn => {
            btn.onclick = e => {
                e.preventDefault();
                photos.splice(parseInt(btn.dataset.del), 1);
                render();
            };
        });

        // Завантаження нових фото
        const fileInput = wrap.querySelector('#photoFileInput');
        if (fileInput) {
            fileInput.onchange = async function() {
                const files = Array.from(this.files).slice(0, maxPhotos - photos.length);
                for (const file of files) {
                    const b64 = await fileToBase64(file);
                    // Стиснення якщо > 500кб
                    const compressed = await compressImage(b64, 800);
                    photos.push(compressed);
                }
                render();
            };
        }
    }

    render();

    return {
        el: wrap,
        getPhotos: () => photos,
        getFirst: () => photos[0] || '',
        setPhotos: (arr) => { photos = [...arr]; render(); }
    };
}

// Файл → base64
function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

// Стиснення зображення через canvas
function compressImage(base64, maxWidth = 800) {
    return new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.75));
        };
        img.onerror = () => resolve(base64); // якщо помилка — повертаємо оригінал
        img.src = base64;
    });
}

// ========== СИСТЕМА ВАЛЮТ ==========
// Курси відносно UAH (оновлюються з НБУ)
let exchangeRates = {
    UAH: 1,
    USD: 0.024,  // приблизно
    EUR: 0.022,
    PLN: 0.098,
    GBP: 0.019,
};

// Завантажуємо курси НБУ
async function loadExchangeRates() {
    try {
        const res = await fetch('https://bank.gov.ua/NBUStatService/v1/statdirectory/exchange?json');
        const data = await res.json();
        const usd = data.find(r => r.cc === 'USD');
        const eur = data.find(r => r.cc === 'EUR');
        const pln = data.find(r => r.cc === 'PLN');
        const gbp = data.find(r => r.cc === 'GBP');
        if (usd) exchangeRates.USD = 1 / usd.rate;
        if (eur) exchangeRates.EUR = 1 / eur.rate;
        if (pln) exchangeRates.PLN = 1 / pln.rate;
        if (gbp) exchangeRates.GBP = 1 / gbp.rate;
        localStorage.setItem('mf_rates', JSON.stringify({rates: exchangeRates, updated: Date.now()}));
    } catch(e) {
        // Використовуємо збережені або дефолтні
        const saved = JSON.parse(localStorage.getItem('mf_rates') || 'null');
        if (saved && saved.rates) exchangeRates = saved.rates;
    }
}

// Конвертація ціни
// fromCurrency - валюта продавця, toCurrency - валюта покупця
function convertPrice(amount, fromCurrency, toCurrency) {
    if (!amount || isNaN(amount)) return 0;
    if (fromCurrency === toCurrency) return Math.round(amount);
    // Конвертуємо через UAH
    const inUAH = fromCurrency === 'UAH' ? amount : amount / exchangeRates[fromCurrency];
    const result = toCurrency === 'UAH' ? inUAH : inUAH * exchangeRates[toCurrency];
    return Math.round(result);
}

// Форматування ціни з символом валюти
function formatPrice(amount, currency) {
    if (!amount || isNaN(amount) || amount === 0) return '';
    currency = currency || appCurrency;
    const cur = CURRENCIES.find(c => c.code === currency) || CURRENCIES[0];
    const formatted = amount >= 1000 ? amount.toLocaleString('uk-UA') : amount;
    return `${cur.symbol}${formatted}`;
}

// Показуємо ціну в валюті юзера + оригінал якщо різні
function displayPrice(amount, sellerCurrency, showOriginal) {
    if (!amount || isNaN(amount) || amount === 0) return '';
    sellerCurrency = sellerCurrency || 'UAH';
    const converted = convertPrice(amount, sellerCurrency, appCurrency);
    const mainPrice = formatPrice(converted, appCurrency);
    if (showOriginal && sellerCurrency !== appCurrency) {
        const origPrice = formatPrice(amount, sellerCurrency);
        return `${mainPrice} <span style="font-size:0.75em;opacity:0.6;">(${origPrice})</span>`;
    }
    return mainPrice;
}

// Завантажуємо курси при старті (не блокуємо UI)
loadExchangeRates();

    // ---- Supabase Auth helpers ----
    async function afterSupabaseLogin(user, restoreSection) {
        // Перевіряємо чи вже є профіль у localStorage
        const savedUser = localStorage.getItem('mf_user');
        if (savedUser) {
            try {
                const parsed = JSON.parse(savedUser);
                if (parsed.email === user.email && parsed.nickname) {
                    currentUser = parsed;
                    // Відновлюємо останній розділ після оновлення сторінки
                    if (restoreSection) {
                        const lastSection = localStorage.getItem('mf_current_section');
                        if (lastSection && lastSection !== 'main' && lastSection !== 'login') {
                            try { renderSection(lastSection); return; } catch(e) {}
                        }
                    }
                    renderMainMenu();
                    return;
                }
            } catch(e) {}
        }
        // Новий користувач — вибір нікнейму
        currentUser = { nickname:'', email: user.email, role:'user', hasBasicPaid:true, lang:appLang, country:appCountry, currency:appCurrency, regDate: new Date().toISOString(), points: 0 };
        saveAll();
        renderPickNickname('supabase');
    }

    // ---- Email OTP ----
    let otpSent = false;
    document.getElementById('emailAuthBtn').onclick = async function() {
        const email = document.getElementById('authEmail').value.trim();
        const statusDiv = document.getElementById('authStatus');
        const btn = document.getElementById('emailAuthBtn');

        if (!otpSent) {
            // Крок 1 — надсилаємо OTP
            if (!email || !email.includes('@')) {
                statusDiv.textContent = '❌ Введіть коректний email';
                return;
            }
            btn.disabled = true;
            btn.textContent = '⏳ Надсилаємо код...';
            statusDiv.textContent = '';
            const { error } = await supabaseClient.auth.signInWithOtp({ email });
            if (error) {
                statusDiv.textContent = '❌ ' + error.message;
                btn.disabled = false;
                btn.textContent = '📧 Увійти через Email';
                return;
            }
            otpSent = true;
            document.getElementById('authEmail').disabled = true;
            document.getElementById('otpBlock').style.display = 'block';
            btn.disabled = false;
            btn.textContent = '✅ Підтвердити код';
            statusDiv.style.color = '#27ae60';
            statusDiv.textContent = '📨 Код надіслано на ' + email;
        } else {
            // Крок 2 — перевіряємо OTP
            const otp = document.getElementById('authOtp').value.trim();
            if (otp.length !== 6) {
                statusDiv.style.color = '#e74c3c';
                statusDiv.textContent = '❌ Введіть 6-значний код';
                return;
            }
            btn.disabled = true;
            btn.textContent = '⏳ Перевіряємо...';
            const { data, error } = await supabaseClient.auth.verifyOtp({ email, token: otp, type: 'email' });
            if (error) {
                statusDiv.style.color = '#e74c3c';
                statusDiv.textContent = '❌ Невірний код. Спробуйте ще раз.';
                btn.disabled = false;
                btn.textContent = '✅ Підтвердити код';
                return;
            }
            await afterSupabaseLogin(data.user);
        }
    };

    // ---- Google OAuth ----
    document.getElementById('googleBtn').onclick = async function() {
        const { error } = await supabaseClient.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.href }
        });
        if (error) alert('❌ ' + error.message);
    };

    // ---- Apple — заглушка ----
    document.getElementById('appleBtn').onclick = function() {
        alert('🍎 Вхід через Apple буде доступний найближчим часом');
    };

    // ---- Перевірка сесії при завантаженні ----
    supabaseClient.auth.getSession().then(function(result) {
        const session = result.data && result.data.session;
        if (session && session.user) {
            afterSupabaseLogin(session.user, true); // true = відновити секцію
        }
    });
}

function renderPickNickname(provider) {
    const app = document.getElementById('appRoot');
    app.innerHTML = `
    <div class="card">
      <div style="text-align:center;margin-bottom:20px;">
        <div style="font-size:2.5rem;">🎣</div>
        <div style="font-size:1.3rem;font-weight:900;color:#1f3b4c;margin-top:8px;">Welcome to MagicFish!</div>
        <div style="font-size:0.85rem;color:#888;margin-top:4px;">Signed in via ${provider === 'google' ? 'Google 🔵' : 'Apple 🍎'}</div>
      </div>
      <div style="background:#e8f5e9;border-radius:20px;padding:14px;margin-bottom:20px;font-size:0.85rem;color:#1b5e20;">
        🎉 <strong>Вітаємо у MagicFish!</strong><br>
        Оберіть унікальний нікнейм — так вас бачитимуть інші рибалки.<br>
        <span style="opacity:0.8;">Доступ повністю безкоштовний 🐟</span>
      </div>
      <div class="input-group">
        <label>🎣 Your unique nickname</label>
        <input type="text" id="pickNick" placeholder="e.g. SomFisher, Щука_Pro, Carp_King" maxlength="24">
        <div id="nickHint" style="font-size:0.78rem;color:#aaa;margin-top:4px;padding-left:12px;">2–24 characters, letters, numbers, _</div>
      </div>
      <button id="confirmNickBtn" class="btn btn-block" style="margin-top:8px;">✅ Confirm nickname →</button>
    </div>`;

    const nickInput = document.getElementById('pickNick');
    const hint = document.getElementById('nickHint');
    nickInput.oninput = () => {
        const v = nickInput.value.trim();
        const taken = ['admin','magicfish','support','gtr'];
        if (v.length < 2) { hint.style.color='#aaa'; hint.textContent='2–24 characters'; }
        else if (!/^[a-zA-Zа-яА-ЯіІїЇєЄёЁ0-9_]+$/.test(v)) { hint.style.color='#e74c3c'; hint.textContent='❌ Only letters, numbers, _'; }
        else if (taken.includes(v.toLowerCase())) { hint.style.color='#e74c3c'; hint.textContent='❌ This nickname is taken'; }
        else { hint.style.color='#27ae60'; hint.textContent=`✅ "${v}" is available!`; }
    };

    document.getElementById('confirmNickBtn').onclick = () => {
        const nick = nickInput.value.trim();
        if (nick.length < 2) { alert('Min 2 characters'); return; }
        if (!/^[a-zA-Zа-яА-ЯіІїЇєЄёЁ0-9_]+$/.test(nick)) { alert('Only letters, numbers, _'); return; }
        currentUser.nickname = nick;
        saveAll();
        currentUser.hasBasicPaid = true;
        addPoints('first_login');
        saveAll();
        renderAskGeolocation();
    };
}

// ========== ЗАПИТ ГЕОЛОКАЦІЇ ПІСЛЯ РЕЄСТРАЦІЇ ==========
function renderAskGeolocation() {
    const app = document.getElementById('appRoot');
    app.innerHTML = '<div class="card" style="text-align:center;">' +
      '<div style="font-size:3.5rem;margin-bottom:8px;">📍</div>' +
      '<div style="font-size:1.25rem;font-weight:900;color:#1f3b4c;margin-bottom:8px;">Дозвольте визначити ваше місце</div>' +
      '<div style="font-size:0.88rem;color:#555;margin-bottom:20px;line-height:1.6;">' +
        'MagicFish використовує геолокацію для:<br>' +
        '🎣 <b>Водойми поруч</b> — сортування за відстанню<br>' +
        '🆘 <b>SOS</b> — точні координати для рятувальників<br>' +
        '📍 <b>Чекіни</b> — підтвердження що ви на місці<br>' +
        '🏕️ <b>Кемпінги і бази</b> — найближчі до вас' +
      '</div>' +
      '<button id="geoAllowBtn" class="btn btn-block" style="margin-bottom:12px;background:#27ae60;font-size:1rem;">' +
        '📍 Дозволити геолокацію' +
      '</button>' +
      '<button id="geoSkipBtn" class="btn btn-block btn-secondary" style="font-size:0.9rem;">' +
        '✖ Пропустити' +
      '</button>' +
      '<div id="geoStatus" style="margin-top:14px;font-size:0.82rem;color:#888;"></div>' +
    '</div>';

    document.getElementById('geoAllowBtn').onclick = function() {
        var statusDiv = document.getElementById('geoStatus');
        var allowBtn  = document.getElementById('geoAllowBtn');
        allowBtn.disabled = true;
        allowBtn.textContent = '⏳ Визначаємо...';
        statusDiv.textContent = '';
        if (!navigator.geolocation) {
            statusDiv.innerHTML = '❌ Геолокація не підтримується браузером';
            allowBtn.disabled = false;
            allowBtn.textContent = '📍 Дозволити геолокацію';
            return;
        }
        navigator.geolocation.getCurrentPosition(
            function(pos) {
                currentLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
                currentUser.locationDenied = false;
                saveAll();
                statusDiv.innerHTML = '✅ Визначено: ' + pos.coords.latitude.toFixed(4) + ', ' + pos.coords.longitude.toFixed(4) + ' (±' + Math.round(pos.coords.accuracy) + 'м)';
                setTimeout(function() {
                    const lastSection = localStorage.getItem('mf_current_section');
                    if (lastSection && lastSection !== 'main' && lastSection !== 'login') {
                        try { renderSection(lastSection); } catch(e) { renderMainMenu(); }
                    } else { renderMainMenu(); }
                }, 800);
            },
            function(err) {

function globalSearch(q) {
    var results = [];

    // Водойми
    if (typeof waterbodies !== 'undefined') {
        waterbodies.forEach(function(w) {
            if (w.name.toLowerCase().includes(q) || (w.city && w.city.toLowerCase().includes(q))) {
                results.push({ emoji:'🗺️', title: w.name, subtitle: (w.city||'') + (w.paid ? ' · Платна' : ' · Безкоштовна'), section:'waterbodies' });
            }
        });
    }

    // Магазини
    if (typeof fishStores !== 'undefined') {
        fishStores.forEach(function(s) {
            if (s.name.toLowerCase().includes(q) || (s.city && s.city.toLowerCase().includes(q))) {
                results.push({ emoji:'🏪', title: s.name, subtitle: s.address || s.city || '', section:'stores' });
            }
        });
    }

    // Кемпінги
    if (typeof campings !== 'undefined') {
        campings.forEach(function(c) {
            if (c.name.toLowerCase().includes(q)) {
                results.push({ emoji:'🏕️', title: c.name, subtitle: c.region || '', section:'campings' });
            }
        });
    }

    // Бази відпочинку
    if (typeof resorts !== 'undefined') {
        resorts.forEach(function(r) {
            if (r.name.toLowerCase().includes(q)) {
                results.push({ emoji:'🏖️', title: r.name, subtitle: r.region || '', section:'resorts' });
            }
        });
    }

    // Звіти
    var reports = JSON.parse(localStorage.getItem('mf_reports') || '[]');
    reports.forEach(function(r) {
        if ((r.title && r.title.toLowerCase().includes(q)) ||
            (r.water && r.water.toLowerCase().includes(q)) ||
            (r.author && r.author.toLowerCase().includes(q))) {
            results.push({ emoji:'🐟', title: r.author + ': ' + (r.title||r.water||'Звіт'), subtitle: r.date + (r.water ? ' · ' + r.water : ''), section:'reports' });
        }
    });

    // GTR товари
    if (typeof gtrShopProducts !== 'undefined') {
        gtrShopProducts.forEach(function(p) {
            if (p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q)) {
                results.push({ emoji: p.emoji||'📦', title: p.name, subtitle: '₴' + convertPrice(p.price, p.currency||'UAH', 'UAH') + ' · $' + convertPrice(p.price, p.currency||'UAH', 'USD') + ' · GTR Shop', section:'alarm' });
            }
        });
    }

    // Розділи сайту
    var sections = [
        { emoji:'🗺️', title:'Водойми', subtitle:'Карта та список водойм', section:'waterbodies', keys:['водойм','озер','річк','ставок','водосховищ'] },
        { emoji:'🔮', title:'Прогноз клювання', subtitle:'Коли краще ловити рибу', section:'forecast', keys:['прогноз','клюв','погод','ловити'] },
        { emoji:'🏕️', title:'Кемпінги', subtitle:'Місця для відпочинку', section:'campings', keys:['кемпінг','намет','відпочин'] },
        { emoji:'🏖️', title:'Бази відпочинку', subtitle:'Рибальські бази', section:'resorts', keys:['база','відпочин','котедж'] },
        { emoji:'⭐', title:'Рейтинг приманок', subtitle:'Голосування за снасті', section:'lure_rating', keys:['рейтинг','приманк','воблер','блесн','силікон'] },
        { emoji:'🔧', title:'Майстерня', subtitle:'Ремонт та саморобки', section:'workshop', keys:['майстерн','ремонт','саморобк'] },
        { emoji:'❄️', title:'Зимова рибалка', subtitle:'Мормишка, жерлиці', section:'winter_fishing', keys:['зимов','мормишк','жерлиц','балансир','лід'] },
        { emoji:'🎣', title:'Способи ловлі', subtitle:'Спінінг, фідер, нахлист', section:'fishing_methods', keys:['спінінг','фідер','нахлист','троллінг','джиг','карп'] },
        { emoji:'🚤', title:'Човни та мотори', subtitle:'ПВХ, алюміній, мотори', section:'boats', keys:['човен','мотор','катер','пвх','алюмін'] },
        { emoji:'🤿', title:'Підводне полювання', subtitle:'Рушниці, маски, костюми', section:'underwater', keys:['підводн','рушниц','маска','гідрокостюм'] },
        { emoji:'📋', title:'Плани рибалок', subtitle:'Спільні виїзди', section:'fishing_plans', keys:['план','виїзд','спільн'] },
        { emoji:'💬', title:'Форум', subtitle:'Обговорення', section:'forum', keys:['форум','обговор','питанн'] },
        { emoji:'📢', title:'Дошка оголошень', subtitle:'Купити/продати', section:'marketplace', keys:['оголошен','купити','продати','барахолк'] },
        { emoji:'🏪', title:'Магазини', subtitle:'Рибальські магазини України', section:'stores', keys:['магазин','купити','снасті'] },
        { emoji:'🆘', title:'SOS', subtitle:'Екстрена допомога', section:'sos', keys:['sos','допомог','рятувал','екстрен'] },
    ];

    sections.forEach(function(s) {
        if (s.title.toLowerCase().includes(q) || s.keys.some(function(k){ return k.includes(q) || q.includes(k); })) {
            if (!results.find(function(r){ return r.section === s.section && r.title === s.title; })) {
                results.push(s);
            }
        }
    });

    return results.slice(0, 8);
}

                body: JSON.stringify({

                    product: productName,

function saveGTRProducts() {
    try {
        localStorage.setItem('mf_gtr_products', JSON.stringify(gtrShopProducts));
    } catch(e) {}
}

function loadGTRProducts() {
    try {
        var saved = localStorage.getItem('mf_gtr_products');
        if (saved) {
            var parsed = JSON.parse(saved);
            // Мержимо: беремо базові дані з коду, але оновлюємо ціни та фото з localStorage
            gtrShopProducts = gtrShopProducts.map(function(base) {
                var stored = parsed.find(function(p){ return p.id === base.id; });
                if (stored) {
                    return Object.assign({}, base, {
                        price:     stored.price     !== undefined ? stored.price     : base.price,
                        priceUSD:  stored.priceUSD  !== undefined ? stored.priceUSD  : base.priceUSD,
                        priceEUR:  stored.priceEUR  !== undefined ? stored.priceEUR  : base.priceEUR,
                        available: stored.available !== undefined ? stored.available : base.available,
                        photos:    stored.photos    || base.photos || [],
                        name:      stored.name      || base.name,
                        desc:      stored.desc      || base.desc,
                        emoji:     stored.emoji     || base.emoji,
                    });
                }
                return base;
            });
            // Додаємо нові товари що були додані через адмін-панель
            parsed.forEach(function(stored) {
                if (!gtrShopProducts.find(function(b){ return b.id === stored.id; })) {
                    gtrShopProducts.push(stored);
                }
            });
        }
    } catch(e) {}
}

// Перевірка ліцензії пристрою
async function checkPhantomLicense(deviceId) {
    const key = `mf_phantom_license_${deviceId}`;
    const stored = JSON.parse(localStorage.getItem(key) || 'null');
    if (stored) {
        const expiry = new Date(stored.expiry);
        const now = new Date();
        const daysLeft = Math.ceil((expiry - now) / 86400000);
        return { ...stored, daysLeft, expired: daysLeft <= 0 };
    }
    return null;
}

// Реєстрація пристрою в Supabase
async function registerPhantomDevice(macHash, deviceType) {
    try {
        const { data, error } = await supabaseClient
            .from('phantom_devices')
            .insert({
                user_id: (await supabaseClient.auth.getUser()).data.user?.id,
                email: currentUser.email,
                mac_hash: macHash,
                device_type: deviceType,
                max_devices: deviceType === 'original' ? 8 : 1,
                is_active: deviceType === 'original', // оригінал активний одразу
            })
            .select()
            .single();
        if (error) throw error;
        return data;
    } catch(e) {
        console.warn('Supabase registerPhantomDevice:', e.message);
        return null;
    }
}

// Показуємо банер ліцензії DIY
function showLicenseBanner(deviceId, daysLeft, expired) {
    const existing = document.getElementById('licenseBanner');
    if (existing) existing.remove();

    const dismissed = localStorage.getItem(`mf_banner_dismissed_${deviceId}`);
    if (dismissed === 'forever') return;
    if (dismissed) {
        const dismissedTime = parseInt(dismissed);
        if (Date.now() - dismissedTime < 86400000) return; // до наступного входу
    }

    const banner = document.createElement('div');
    banner.id = 'licenseBanner';
    const bg = expired ? '#e74c3c' : '#f39c12';
    const msg = expired
        ? '🔴 Ліцензія DIY закінчилась! Пристрій заблоковано.'
        : `🟡 Ліцензія DIY закінчується через ${daysLeft} дн.`;

    banner.style.cssText = `position:fixed;bottom:0;left:0;right:0;background:${bg};color:white;padding:10px 16px;z-index:9999;display:flex;align-items:center;justify-content:space-between;gap:8px;`;
    banner.innerHTML = `
        <div style="flex:1;font-size:0.82rem;font-weight:700;">${msg}</div>
        <button onclick="showPhantomLicenseModal()" style="background:white;color:${bg};border:none;border-radius:20px;padding:6px 12px;font-weight:800;font-size:0.78rem;cursor:pointer;white-space:nowrap;">💳 Продовжити $1</button>
        <button onclick="dismissLicenseBanner('${deviceId}', false)" style="background:rgba(255,255,255,0.2);color:white;border:none;border-radius:20px;padding:6px 10px;font-size:0.78rem;cursor:pointer;">✕</button>

                if (p.daysLeft > 14) { licIcon = '🟢'; licText = `DIY · ${p.daysLeft} дн.`; }

                else { licIcon = '🔴'; licText = 'DIY · Прострочено'; }

    // Журнал
    function renderPhLog() {
        const el = document.getElementById('phLog');
        if(!el) return;
        if(!window.gtrPhantomLog.length){el.innerHTML='<div style="text-align:center;padding:30px;color:#bbb;">Поклювань ще не було</div>';return;}
        el.innerHTML = window.gtrPhantomLog.slice(0,30).map(e=>`
        <div style="background:white;border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:8px;box-shadow:0 2px 6px rgba(0,0,0,0.06);">
            <div style="width:10px;height:10px;border-radius:50%;background:${e.color};flex-shrink:0;"></div>
            <div style="flex:1;font-size:0.85rem;font-weight:700;color:#1f3b4c;">${e.rod}</div>
            <div style="font-size:0.8rem;color:#aaa;">${e.time}</div>
        </div>`).join('');
    }

    function addPhantomBite(p) {
        const now = new Date();
        const time = [now.getHours(),now.getMinutes(),now.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':');
        p.bites++; window.gtrPhantomBites++;
        window.gtrPhantomLog.unshift({rod:p.rod, color:p.color, time});
        if(window.gtrPhantomLog.length>100) window.gtrPhantomLog.pop();
        renderPhList(); renderPhLog();
        if(window.gtrVibr && navigator.vibrate) navigator.vibrate([300,100,300]);
        try {
            if(window.gtrVolume>0 && !window.gtrNight){
                const ac=new(window.AudioContext||window.webkitAudioContext)();
                const osc=ac.createOscillator(), g=ac.createGain();
                osc.connect(g); g.connect(ac.destination);
                osc.frequency.value=880; g.gain.value=window.gtrVolume/100*0.3;
                osc.start(); osc.stop(ac.currentTime+0.3);
            }
        } catch(e){}
    }

    function connectPhantom(p) {
        if(!navigator.bluetooth){
            p.connected=true; p.battery=Math.floor(70+Math.random()*25); p.signal=Math.floor(60+Math.random()*40);
            p.simTimer=setInterval(()=>{
                if(!p.active||!p.connected) return;
                if(Math.random()>0.65) addPhantomBite(p);
                p.signal=Math.max(30,Math.min(100,p.signal+(Math.random()*10-5)));
                renderPhList();
            },5000);
            renderPhList(); return;
        }
        navigator.bluetooth.requestDevice({
            filters:[{namePrefix:'GTR'}],
            optionalServices:['0000fff0-0000-1000-8000-00805f9b34fb']
        }).then(dev=>{
            p.bleDevice=dev;
            dev.addEventListener('gattserverdisconnected',()=>{p.connected=false;clearInterval(p.simTimer);renderPhList();});
            return dev.gatt.connect();
        }).then(srv=>srv.getPrimaryService('0000fff0-0000-1000-8000-00805f9b34fb'))
        .then(svc=>svc.getCharacteristic('0000fff1-0000-1000-8000-00805f9b34fb'))
        .then(ch=>{
            ch.startNotifications();
            ch.addEventListener('characteristicvaluechanged',evt=>{
                const mag=evt.target.value.getInt16(1,true)/1000;
                const thr=window.gtrSens===1?0.8:window.gtrSens===2?0.4:0.2;
                if(mag>thr&&p.active) addPhantomBite(p);
            });
            p.connected=true; p.battery=87; p.signal=85; renderPhList();
        }).catch(()=>{
            p.connected=true; p.battery=Math.floor(70+Math.random()*25); p.signal=Math.floor(60+Math.random()*40);
            p.simTimer=setInterval(()=>{
                if(!p.active||!p.connected) return;
                if(Math.random()>0.65) addPhantomBite(p);
                p.signal=Math.max(30,Math.min(100,p.signal+(Math.random()*10-5)));
                renderPhList();
            },5000);
            renderPhList();
        });
    }

    function disconnectPhantom(p) {
        clearInterval(p.simTimer);
        if(p.bleDevice?.gatt?.connected) try{p.bleDevice.gatt.disconnect();}catch(e){}
        p.connected=false; p.bleDevice=null; renderPhList();
    }

                gtrShopSec.innerHTML = '<div style="padding:20px;text-align:center;color:#888;">Завантаження...</div>';

                    renderGTRShopInto(gtrShopSec);

    document.addEventListener('click', function gtrTabHandler(e) {
        var t = e.target;
        if (!t) return;
        if (t.id === 'gtrTabShop') { e.preventDefault(); gtrSetTab('shop'); }
        else if (t.id === 'gtrTabDevice') { e.preventDefault(); gtrSetTab('device'); }
        // Видаляємо слухач при поверненні назад
        if (t.id === 'backGTR') { document.removeEventListener('click', gtrTabHandler); }

    // Вкладки GTR


    function renderChannels() {
        const list = document.getElementById('gtrChannelList');
        list.innerHTML = '';
        gtrChannels.forEach(ch => {
            const div = document.createElement('div');
            div.style.cssText = 'background:white;border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 6px rgba(0,0,0,0.07);';
            div.innerHTML = `
                <div style="width:12px;height:12px;border-radius:50%;background:${ch.active ? ch.color : '#ccc'};flex-shrink:0;${ch.active ? `box-shadow:0 0 6px ${ch.color}88;` : ''}"></div>
                <div style="flex:1;">
                    <div style="font-weight:700;font-size:0.9rem;color:#1f3b4c;">${ch.name}</div>
                    <input value="${ch.rod}" data-id="${ch.id}" style="border:none;border-bottom:1px solid #eee;border-radius:0;padding:2px 0;font-size:0.8rem;color:#888;width:100%;margin:0;background:transparent;" placeholder="Назва вудки">
                    <div style="font-size:0.75rem;color:#aaa;margin-top:2px;">🐟 ${ch.bites} ${T('gtr_bites_count')}</div>
                </div>
                <button data-chid="${ch.id}" style="background:${ch.active ? ch.color : '#eee'};color:${ch.active ? 'white' : '#555'};border:none;border-radius:40px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:0.8rem;">
                    ${ch.active ? T('gtr_active') : T('gtr_inactive')}
                </button>
            `;
            div.querySelector('input').addEventListener('change', e => { ch.rod = e.target.value; });
            div.querySelector('button').addEventListener('click', () => { ch.active = !ch.active; renderChannels(); });
            list.appendChild(div);
        });
    }

    function renderLog() {
        const el = document.getElementById('gtrLog');
        if (!el) return;
        if (gtrLog.length === 0) {
            el.innerHTML = '<div style="text-align:center;padding:20px;color:#bbb;font-size:0.85rem;">поклювань ще не було</div>';
            return;
        }
        el.innerHTML = '';
        gtrLog.slice(0, 15).forEach(entry => {
            const div = document.createElement('div');
            div.style.cssText = 'background:white;border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,0.06);';
            div.innerHTML = `
                <div style="width:10px;height:10px;border-radius:50%;background:${entry.color};flex-shrink:0;"></div>
                <div style="flex:1;font-size:0.85rem;color:#1f3b4c;font-weight:600;">${entry.channel}</div>
                <div style="font-size:0.8rem;color:#888;">${entry.rod}</div>
                <div style="font-size:0.8rem;color:#aaa;flex-shrink:0;">${entry.time}</div>
            `;
            el.appendChild(div);
        });
    }

    function addBite(ch) {
        const now = new Date();
        const time = [now.getHours(), now.getMinutes(), now.getSeconds()].map(n => String(n).padStart(2,'0')).join(':');
        ch.bites++;
        gtrTotalBites++;
        const biteEl = document.getElementById('gtrBiteCount');
        if (biteEl) { biteEl.textContent = gtrTotalBites; biteEl.style.animation = 'none'; setTimeout(() => biteEl.style.animation = '', 10); }
        gtrLog.unshift({ channel: ch.name, rod: ch.rod, time, color: ch.color });
        if (gtrLog.length > 50) gtrLog.pop();
        renderChannels();
        renderLog();
        if (gtrVibrOn && navigator.vibrate) navigator.vibrate([300, 100, 300]);
    }

    function startSim() {
        gtrSimTimer = setInterval(() => {
            const active = gtrChannels.filter(c => c.active);
            if (active.length === 0) return;
            if (Math.random() > 0.6) {
                const ch = active[Math.floor(Math.random() * active.length)];
                addBite(ch);
            }
        }, 5000);
    }

    document.getElementById('buyPhantomBtn').addEventListener('click', function() {
        showOrderForm('GTR Phantom BLE 4.0', 1890);
    });

    document.getElementById('gtrApiBtn').addEventListener('click', function() {

            '<ul style="font-size:0.85rem;color:#444;line-height:1.8;padding-left:18px;">' +
              '<li>📳 Вібро-сповіщення на телефон</li>' +
              '<li>📊 Статистика клювань в реальному часі</li>' +
              '<li>🗺️ Прив\'язка до водойми</li>' +
              '<li>👥 Поширення статусу з рибалками</li>' +

            '<p style="font-size:0.82rem;color:#888;">Для отримання API-ключа зверніться до офіційного дистриб\'ютора GTR:</p>' +
            '<a href="mailto:api@gtrfishing.com" style="display:block;background:#1976d2;color:#fff;text-align:center;padding:12px;border-radius:12px;text-decoration:none;font-weight:700;margin-top:8px;">📧 api@gtrfishing.com</a>' +
            '<button class="close-modal" style="margin-top:12px;width:100%;">Зрозуміло</button>'
        );
        document.querySelector('.close-modal').onclick = function() { document.querySelector('.modal-overlay')?.remove(); };
    });

    document.getElementById('gtrConnectBtn').addEventListener('click', () => {
        gtrConnected = !gtrConnected;
        const btn = document.getElementById('gtrConnectBtn');
        const status = document.getElementById('gtrStatus');
        const disc = document.getElementById('gtrDisconnected');
        const conn = document.getElementById('gtrConnected');
        if (gtrConnected) {
            btn.textContent = T('gtr_disconnect');
            btn.style.background = '#e74c3c';
            btn.style.color = 'white';
            status.textContent = T('gtr_connected');
            status.style.color = '#27ae60';
            disc.style.display = 'none';
            conn.style.display = 'block';
            renderChannels();
            renderLog();
            startSim();
        } else {
            btn.textContent = T('gtr_connect');
            btn.style.background = '';
            btn.style.color = '';
            status.textContent = T('gtr_disconnected');
            status.style.color = '#888';
            disc.style.display = 'block';
            conn.style.display = 'none';
            clearInterval(gtrSimTimer);
        }
    });

    document.getElementById('gtrVolSlider').addEventListener('input', function() {
        gtrVolume = this.value;
        document.getElementById('gtrVolLabel').textContent = gtrVolume + '%';
    });
    const sensLabels = { '1':T('gtr_sensitivity_low'), '2':T('gtr_sensitivity_med'), '3':T('gtr_sensitivity_high') };
    document.getElementById('gtrSensSlider').addEventListener('input', function() {
        gtrSens = this.value;
        document.getElementById('gtrSensLabel').textContent = sensLabels[this.value];
    });
    document.getElementById('gtrVibrBtn').addEventListener('click', function() {
        gtrVibrOn = !gtrVibrOn;
        this.textContent = gtrVibrOn ? 'УВІМК.' : 'ВИМК.';
        this.style.background = gtrVibrOn ? '#27ae60' : '#eee';
        this.style.color = gtrVibrOn ? 'white' : '#555';
    });
    let nightMode = false;
    document.getElementById('gtrNightBtn').addEventListener('click', function() {
        nightMode = !nightMode;
        this.textContent = nightMode ? 'УВІМК.' : 'ВИМК.';
        this.style.background = nightMode ? '#1f3b4c' : '#eee';
        this.style.color = nightMode ? 'white' : '#555';
        if (nightMode) { document.getElementById('gtrVolSlider').value = 20; gtrVolume = 20; document.getElementById('gtrVolLabel').textContent = '20%'; }
    });
    document.getElementById('gtrClearLog').addEventListener('click', () => {
        gtrLog = [];
        gtrChannels.forEach(c => c.bites = 0);

        if (biteEl) biteEl.textContent = '0';
        renderChannels();
        renderLog();
    });
}

function renderResorts() {
    localStorage.setItem('mf_current_section', 'resorts');
    ensureLeafletFallback();
    const app = document.getElementById('appRoot');
    let nearbyOnly = false;

    // Об'єднуємо всі бази в один масив
    const allBases = [...(typeof basesKyivChop!=='undefined'?basesKyivChop:[]),
                      ...(typeof basesKyivWarsaw!=='undefined'?basesKyivWarsaw:[])];

    app.innerHTML = `
    <div class="nickname-header">👤 ${currentUser.nickname}</div>
    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h1>${T('resorts_title')}</h1>
            <button id="backResorts" class="back-btn">${T('back')}</button>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:10px;">
            <input id="resortSearch" placeholder="${T('resorts_search')}" style="flex:1;margin:0;">
            <button id="resortNearbyBtn" class="btn btn-secondary" style="white-space:nowrap;">${T('nearby_50')}</button>
        </div>
        <button id="getResortLocation" class="btn btn-location btn-block">${T('your_location')}</button>
        <div id="resortLocationStatus" style="margin:8px 0;font-size:0.85rem;color:#888;text-align:center;"></div>
        <div id="resortMap" class="map-container"></div>
        <div id="resortList"></div>
    </div>`;

    document.getElementById('backResorts').onclick = () => renderMainMenu();

    let resortMap = null;

    document.getElementById('getResortLocation').onclick = () => {
        getUserLocation(ok => {
            if (ok) {
                document.getElementById('resortLocationStatus').innerHTML = `' + T('location_defined') + '`;
                renderResortList();
            } else {
                document.getElementById('resortLocationStatus').innerHTML = T('location_error');
            }
        });
    };

    document.getElementById('resortNearbyBtn').onclick = () => {
        if (!currentLocation) { alert('❌ '+T('your_location')); return; }
        nearbyOnly = !nearbyOnly;
        const btn = document.getElementById('resortNearbyBtn');
        btn.style.background = nearbyOnly ? '#27ae60' : '';
        btn.style.color = nearbyOnly ? 'white' : '';
        renderResortList();
    };

    document.getElementById('resortSearch').oninput = () => renderResortList();

    function renderResortList() {
        const q = document.getElementById('resortSearch').value.toLowerCase();

        let filtered = allBases.filter(b => {
            const matchQ = !q || b.name.toLowerCase().includes(q) ||
                b.city.toLowerCase().includes(q) || b.services.toLowerCase().includes(q);
            const matchNearby = !nearbyOnly || !currentLocation ||
                getDistance(currentLocation.lat, currentLocation.lng, b.lat, b.lng) <= 50000;
            return matchQ && matchNearby;
        });

        if (currentLocation) {
            filtered.sort((a,b) =>
                getDistance(currentLocation.lat,currentLocation.lng,a.lat,a.lng) -
                getDistance(currentLocation.lat,currentLocation.lng,b.lat,b.lng)
            );
        }

        // Карта
        const mapDiv = document.getElementById('resortMap');
        if (resortMap) { try { resortMap.remove(); } catch(e){} }
        resortMap = L.map(mapDiv).setView([49.5,26],7);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'OSM'}).addTo(resortMap);
        setTimeout(() => { try { resortMap.invalidateSize(); } catch(e){} }, 300);
        if (currentLocation) {
            resortMap.setView([currentLocation.lat,currentLocation.lng],8);
            L.marker([currentLocation.lat,currentLocation.lng]).addTo(resortMap).bindPopup(T('you_are_here'));
        }

        const listDiv = document.getElementById('resortList');
        if (filtered.length === 0) {
            listDiv.innerHTML = '<div style="text-align:center;padding:40px;color:#aaa;">' + T('nothing_found') + '</div>';
            return;
        }

        listDiv.innerHTML = filtered.map(b => {
            const distM = currentLocation ? getDistance(currentLocation.lat,currentLocation.lng,b.lat,b.lng) : null;
            const dist = distM !== null ? `<span style="color:#27ae60;font-size:0.85rem;font-weight:700;">📏 ${Math.round(distM/1000)} км від вас</span>` : '';

            // Рейтинг 👑
            if (!b.reviews) b.reviews = [];
            const reviews = b.reviews;
            const avgRating = reviews.length ? Math.round(reviews.reduce((s,r)=>s+(r.rating||0),0)/reviews.length) : 0;
            const crowns = [1,2,3,4,5].map(i =>
                `<span style="font-size:1.3rem;cursor:pointer;opacity:${i<=avgRating?1:0.22};" onclick="window.openResortReview('${b.name}')">👑</span>`
            ).join('');
            const reviewCount = reviews.length
                ? `<span style="font-size:0.78rem;color:#888;margin-left:4px;">(${reviews.length} відгук${reviews.length===1?'':reviews.length<5?'и':'ів'})</span>`
                : '<span style="font-size:0.78rem;color:#bbb;margin-left:4px;">' + T('no_reviews') + '</span>';

            try { L.marker([b.lat,b.lng]).addTo(resortMap).bindPopup(`🏖️ <b>${b.name}</b><br>📍 ${b.city}<br>${avgRating?'👑'.repeat(avgRating):T('no_reviews')}`); } catch(e){}

            return `<div style="background:white;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);border-left:4px solid #27ae60;">
                <div style="font-size:1.6rem;margin-bottom:8px;">🏖️</div>
                <div style="font-weight:800;font-size:1.05rem;color:#1f3b4c;margin-bottom:4px;">${b.name}</div>
                <div style="font-size:0.85rem;color:#888;margin-bottom:6px;">📍 ${b.city}</div>
                <div style="font-size:0.82rem;color:#555;margin-bottom:10px;line-height:1.4;">${b.services}</div>

                <!-- Рейтинг -->
                <div style="display:flex;align-items:center;gap:2px;margin-bottom:10px;">
                    ${crowns}${reviewCount}
                </div>

                <!-- Кнопки -->
                <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
                    <button onclick="window.openResortReview('${b.name}')"
                        style="background:#f5c518;color:#1a0a00;border:none;padding:10px 18px;border-radius:40px;font-weight:800;font-size:0.85rem;cursor:pointer;">${T('review_btn')}</button>
                    <a href="tel:${b.phone}" style="background:#27ae60;color:white;padding:10px 14px;border-radius:40px;text-decoration:none;font-size:0.82rem;font-weight:700;">📞 ${b.phone}</a>
                    <button onclick="window.open('https://www.google.com/maps?q=${b.lat},${b.lng}','_blank')"
                        style="background:#3b82f6;color:white;border:none;padding:10px 14px;border-radius:40px;font-size:0.82rem;font-weight:700;cursor:pointer;">🗺️ Карта</button>
                    ${dist}
                </div>
                ${!b.site ? `<div style="margin-top:10px;background:linear-gradient(135deg,#1f3b4c,#2a5f7a);border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;">
                    <div style="color:white;font-size:0.85rem;font-weight:800;">Немає свого сайту? Зробимо!</div>
                    <a href="mailto:ckbbuild@gmail.com?subject=Реклама MagicFish — ${b.name}" style="background:#f39c12;color:#1a0a00;padding:8px 14px;border-radius:40px;text-decoration:none;font-size:0.78rem;font-weight:900;white-space:nowrap;margin-left:10px;">📧 Написати</a>
                </div>` : ''}

                <!-- Останні відгуки -->
                ${reviews.length ? `<div style="margin-top:12px;border-top:1px solid #f0f0f0;padding-top:10px;">
                    ${reviews.slice(-2).reverse().map(r=>`
                    <div style="font-size:0.82rem;margin-bottom:6px;">
                        <span style="font-weight:700;color:#1f3b4c;">👤 ${r.author}</span>
                        <span style="margin-left:6px;">${'👑'.repeat(r.rating||0)}</span>
                        <div style="color:#666;margin-top:2px;">${r.text}</div>
                    </div>`).join('')}
                </div>` : ''}
            </div>`;
        }).join('');
    }

    renderResortList();
}

window.openResortReview = function(name) {
    const allBases = [...(typeof basesKyivChop!=='undefined'?basesKyivChop:[]),
                      ...(typeof basesKyivWarsaw!=='undefined'?basesKyivWarsaw:[])];
    const b = allBases.find(x=>x.name===name);
    if (!b) return;
    if (!b.reviews) b.reviews = [];
    let selectedRating = 0;

    const modal = openModal(`
        <h2 style="margin-bottom:4px;">✍️ Відгук про базу</h2>
        <div style="font-size:0.9rem;color:#888;margin-bottom:16px;">🏖️ ${b.name}</div>
        <div style="margin-bottom:16px;">
            <div style="font-weight:700;margin-bottom:8px;">Оцінка:</div>
            <div id="resortCrownPicker" style="display:flex;gap:8px;">
                ${[1,2,3,4,5].map(i=>`<span data-r="${i}" style="font-size:2.4rem;cursor:pointer;opacity:0.25;transition:0.15s;">👑</span>`).join('')}
            </div>
        </div>
        <div class="input-group">
            <label>Ваш відгук</label>
            <textarea id="resortReviewText" placeholder="Розкажіть про базу, сервіс, рибалку..." style="min-height:90px;"></textarea>
        </div>
        <button id="saveResortReview" class="btn btn-block">✅ Опублікувати</button>
        <button class="close-modal" style="margin-top:8px;width:100%;padding:10px;background:#f5f5f5;border:none;border-radius:40px;cursor:pointer;font-weight:700;">Скасувати</button>
    `);

    const crownsEl = modal.querySelectorAll('#resortCrownPicker span');
    function hl(n) { crownsEl.forEach((s,i)=>{ s.style.opacity=i<n?'1':'0.25'; s.style.transform=i<n?'scale(1.2)':'scale(1)'; }); }
    crownsEl.forEach(star => {
        star.onclick = () => { selectedRating=parseInt(star.dataset.r); hl(selectedRating); };
        star.onmouseenter = () => hl(parseInt(star.dataset.r));
        star.onmouseleave = () => hl(selectedRating);
    });

    modal.querySelector('.close-modal').onclick = () => modal.remove();
    modal.querySelector('#saveResortReview').onclick = () => {
        const text = modal.querySelector('#resortReviewText').value.trim();
        if (!selectedRating) { alert('Оберіть оцінку 👑'); return; }
        if (!text) { alert('Напишіть відгук'); return; }
        b.reviews.push({ author: currentUser.nickname, rating: selectedRating, text: filterMat(text), date: new Date().toISOString().slice(0,10) });
        saveAll();
        modal.remove();
        renderResorts();
    };
};

function renderForumTopics() {
    const listDiv = document.getElementById('forumTopicsList');
    if (!listDiv) return;
    
    const sorted = [...forumTopics].sort((a,b) => b.lastActivity - a.lastActivity);
    
    if (sorted.length === 0) {
        listDiv.innerHTML = `<div style="text-align:center;padding:40px;color:#aaa;">
            <div style="font-size:2.5rem;margin-bottom:8px;">💬</div>
            <div>Поки немає тем для обговорення</div>
            <div style="font-size:0.85rem;margin-top:6px;">Створи першу тему!</div>
        </div>`;
        return;
    }

    listDiv.innerHTML = sorted.map(topic => {
        const postsCount = forumPosts.filter(p => p.topicId === topic.id).length;
        const timeAgo = getTimeAgo(topic.lastActivity);
        return `<div class="forum-topic-card" data-topic="${topic.id}" style="background:white;border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.07);cursor:pointer;transition:0.15s;">

                    <div style="font-size:0.8rem;color:#888;">👤 ${topic.author} · 📅 ${timeAgo} · 💬 ${postsCount} відповідей</div>
                </div>

        </div>`;
    }).join('');

    document.querySelectorAll('.forum-topic-card').forEach(card => {
        card.onmouseover = () => card.style.background = '#fef9e6';
        card.onmouseout = () => card.style.background = 'white';
        card.onclick = () => {

            renderForumTopic(topicId);
        };
    });

        </div>
    `).join('');
}

function getTimeAgo(timestamp) {
    const now = Date.now();
    const diff = now - timestamp;
    const minutes = Math.floor(diff / 60000);
    const hours = Math.floor(diff / 3600000);
    const days = Math.floor(diff / 86400000);
    if (minutes < 1) return 'щойно';
    if (minutes < 60) return `${minutes} хв тому`;
    if (hours < 24) return `${hours} год тому`;
    return `${days} дн тому`;
}

window.openWaterReview = function(id) {
    const w = waterbodies.find(x=>x.id===id);
    if (!w) return;
    if (!w.reviews) w.reviews = [];
    let selectedRating = 0;

    const modal = openModal(`
        <h2 style="margin-bottom:4px;">✍️ Відгук про водойму</h2>
        <div style="font-size:0.9rem;color:#888;margin-bottom:16px;">🗺️ ${w.name}</div>
        <div style="margin-bottom:16px;">
            <div style="font-weight:700;margin-bottom:8px;">Оцінка:</div>
            <div id="crownPicker" style="display:flex;gap:8px;">
                ${[1,2,3,4,5].map(i=>`<span data-r="${i}" style="font-size:2.4rem;cursor:pointer;opacity:0.25;transition:0.15s;">👑</span>`).join('')}
            </div>
        </div>
        <div class="input-group">
            <label>Ваш відгук</label>
            <textarea id="reviewText" placeholder="Розкажіть про місце, улов, зручності..." style="min-height:90px;"></textarea>
        </div>
        <button id="saveReview" class="btn btn-block">✅ Опублікувати</button>
        <button class="close-modal" style="margin-top:8px;width:100%;padding:10px;background:#f5f5f5;border:none;border-radius:40px;cursor:pointer;font-weight:700;">Скасувати</button>
    `);

    const crownsEl = modal.querySelectorAll('#crownPicker span');
    function highlightCrowns(n) {
        crownsEl.forEach((s,i) => {
            s.style.opacity = i < n ? '1' : '0.25';
            s.style.transform = i < n ? 'scale(1.2)' : 'scale(1)';
        });
    }
    crownsEl.forEach(star => {
        star.onclick = () => { selectedRating = parseInt(star.dataset.r); highlightCrowns(selectedRating); };
        star.onmouseenter = () => highlightCrowns(parseInt(star.dataset.r));
        star.onmouseleave = () => highlightCrowns(selectedRating);
    });

    modal.querySelector('.close-modal').onclick = () => modal.remove();
    modal.querySelector('#saveReview').onclick = () => {
        const text = modal.querySelector('#reviewText').value.trim();
        if (!selectedRating) { alert('Оберіть оцінку 👑'); return; }
        if (!text) { alert('Напишіть відгук'); return; }
        w.reviews.push({ author: currentUser.nickname, rating: selectedRating, text: filterMat(text), date: new Date().toISOString().slice(0,10) });
        addPoints(currentUser, 'review');
        saveAll();
        modal.remove();
        renderWaterbodies();
    };
};
