        </div>

        <div style="background:#fff3cd;border-radius:20px;padding:14px;font-size:0.82rem;color:#856404;margin-top:4px;">
            ℹ️ Погода завантажується з Open-Meteo (реальні дані). Визначте місце для точного прогнозу.
        </div>
    </div>`;

    document.getElementById('backForecast').onclick = () => renderMainMenu();

    // Ініціалізуємо карту
    let fMap = null;
    const mapDiv = document.getElementById('forecastMap');
    fMap = L.map(mapDiv).setView([49, 32], 6);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'OSM'}).addTo(fMap);
    setTimeout(() => { try { fMap.invalidateSize(); } catch(e){} }, 300);

    // Якщо вже є геолокація — одразу завантажуємо
    if (currentLocation) {
        showForecastForLocation(currentLocation.lat, currentLocation.lng);
    } else {
        renderForecastBasic();
    }

    document.getElementById('getForecastLocation').onclick = () => {
        document.getElementById('forecastLocationStatus').innerHTML = '⏳ Визначаємо місце...';
        getUserLocation(ok => {
            if (ok) {
                showForecastForLocation(currentLocation.lat, currentLocation.lng);
            } else {
                document.getElementById('forecastLocationStatus').innerHTML = T('location_error');
                renderForecastBasic();
            }
        });
    };

    // Базовий прогноз без геолокації
    function renderForecastBasic() {
        const timeScore = (hour>=5&&hour<=9)?90:(hour>=17&&hour<=20)?85:(hour>=10&&hour<=16)?65:40;
        const seasonScore = (month>=3&&month<=5)?90:(month>=8&&month<=10)?85:(month>=6&&month<=7)?70:55;
        const totalScore = Math.round((timeScore+seasonScore)/2);
        const scoreColor = totalScore>=75?'#27ae60':totalScore>=50?'#f39c12':'#e74c3c';
        const scoreLabel = totalScore>=75?T('forecast_excellent'):totalScore>=50?T('forecast_good'):T('forecast_bad');
        document.getElementById('forecastMain').innerHTML = `
        <div style="text-align:center;background:linear-gradient(135deg,#1f3b4c,#2a5f7a);border-radius:28px;padding:24px;color:white;margin-bottom:16px;">
            <div style="font-size:3.5rem;font-weight:900;color:${scoreColor};">${totalScore}%</div>
            <div style="font-size:1.1rem;font-weight:700;margin-top:4px;">${scoreLabel} ${T('forecast_biting_today')}</div>
            <div style="font-size:0.85rem;opacity:0.8;margin-top:8px;">${now.toLocaleDateString('uk-UA',{weekday:'long',day:'numeric',month:'long'})}</div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px;">
            <div style="background:#f0fdf4;border-radius:20px;padding:14px;text-align:center;">
                <div style="font-size:1.8rem;">${moonPhase}</div>
                <div style="font-weight:700;margin-top:4px;">${T('forecast_moon')}</div>
                <div style="font-size:0.8rem;color:#666;">Фаза ${Math.floor((now.getDate()%30)/4)+1}/8</div>
            </div>
            <div style="background:#fff3e0;border-radius:20px;padding:14px;text-align:center;">
                <div style="font-size:1.8rem;">⏰</div>
                <div style="font-weight:700;margin-top:4px;">${T('forecast_time')}</div>
                <div style="font-size:0.8rem;color:#666;">${timeScore>=75?T('forecast_best_time'):timeScore>=50?T('forecast_ok_time'):T('forecast_bad_time')}</div>
            </div>
            <div style="background:#e8f5e9;border-radius:20px;padding:14px;text-align:center;">
                <div style="font-size:1.8rem;">🌿</div>
                <div style="font-weight:700;margin-top:4px;">${T('forecast_season')}</div>
                <div style="font-size:0.8rem;color:#666;">${seasonScore>=75?T('forecast_good_season'):seasonScore>=50?T('forecast_normal_season'):T('forecast_off_season')}</div>
            </div>
            <div style="background:#e3f2fd;border-radius:20px;padding:14px;text-align:center;">
                <div style="font-size:1.8rem;">📊</div>
                <div style="font-weight:700;margin-top:4px;">${T('forecast_activity')}</div>
                <div style="font-size:0.8rem;color:#666;">${totalScore>=75?T('forecast_high'):totalScore>=50?T('forecast_medium'):T('forecast_low')}</div>
            </div>
        </div>`;
    }

    // Прогноз з реальною погодою
    async function showForecastForLocation(lat, lng) {
        document.getElementById('forecastLocationStatus').innerHTML = `✅ ${lat.toFixed(4)}, ${lng.toFixed(4)} · ⏳ Завантажуємо погоду...`;

        // Карта — центруємо, малюємо коло 10км
        fMap.setView([lat, lng], 10);
        L.marker([lat, lng]).addTo(fMap).bindPopup('📍 Ваше місце');
        try {
            L.circle([lat, lng], {radius: 10000, color:'#3b82f6', fillColor:'#3b82f6', fillOpacity:0.07, weight:2}).addTo(fMap);
        } catch(e){}

        // Водойми в радіусі 10км
        const nearWater = waterbodies.filter(w =>
            getDistance(lat, lng, w.lat, w.lng) <= 10000
        );
        nearWater.forEach(w => {
            try {
                L.marker([w.lat, w.lng], {
                    icon: L.divIcon({className:'', html:'<div style="font-size:1.2rem;">🗺️</div>', iconSize:[24,24]})
                }).addTo(fMap).bindPopup(`<b>${w.name}</b><br>📍 ${w.city||''}`);
            } catch(e){}
        });

        // Отримуємо погоду з Open-Meteo
        try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,wind_direction_10m,precipitation,surface_pressure,weather_code&wind_speed_unit=ms&timezone=auto`;
            const resp = await fetch(url);
            const data = await resp.json();
            const c = data.current;

            const temp = Math.round(c.temperature_2m);
            const wind = Math.round(c.wind_speed_10m);
            const windDir = c.wind_direction_10m;
            const pressure = Math.round(c.surface_pressure * 0.750064); // гПа → мм рт.ст.
            const rain = c.precipitation || 0;
            const humidity = c.relative_humidity_2m;
            const wcode = c.weather_code;

            // Іконка погоди
            const weatherIcon = wcode===0?'☀️':wcode<=3?'🌤️':wcode<=48?'☁️':wcode<=67?'🌧️':wcode<=77?'❄️':wcode<=82?'🌦️':'⛈️';
            const weatherDesc = wcode===0?'Ясно':wcode<=3?'Мінлива хмарність':wcode<=48?'Хмарно':wcode<=67?'Дощ':wcode<=77?'Сніг':wcode<=82?'Злива':'Гроза';

            // Напрямок вітру
            const dirs = ['Пн','ПнСх','Сх','ПдСх','Пд','ПдЗх','Зх','ПнЗх'];
            const windDirName = dirs[Math.round(windDir/45)%8];

            // Розрахунок індексу клювання з урахуванням погоди
            const timeScore = (hour>=5&&hour<=9)?90:(hour>=17&&hour<=20)?85:(hour>=10&&hour<=16)?65:40;
            const seasonScore = (month>=3&&month<=5)?90:(month>=8&&month<=10)?85:(month>=6&&month<=7)?70:55;
            let weatherScore = 70;
            if (wind <= 2) weatherScore = 90;
            else if (wind <= 4) weatherScore = 80;
            else if (wind <= 7) weatherScore = 60;
            else weatherScore = 35;
            if (rain > 0.5) weatherScore -= 20;
            // Тиск: ідеал 750-760 мм рт.ст.
            let pressureScore = 80;
            if (pressure >= 748 && pressure <= 762) pressureScore = 95;
            else if (pressure >= 740 && pressure <= 770) pressureScore = 75;
            else pressureScore = 50;

            const totalScore = Math.round((timeScore + seasonScore + weatherScore + pressureScore) / 4);
            const scoreColor = totalScore>=75?'#27ae60':totalScore>=50?'#f39c12':'#e74c3c';
            const scoreLabel = totalScore>=75?T('forecast_excellent'):totalScore>=50?T('forecast_good'):T('forecast_bad');

            document.getElementById('forecastLocationStatus').innerHTML = `' + T('forecast_weather_loaded') + ' · ${nearWater.length} ${T('forecast_nearby_water').toLowerCase()}`;

            document.getElementById('forecastMain').innerHTML = `
            <!-- Головний індекс -->
            <div style="text-align:center;background:linear-gradient(135deg,#1f3b4c,#2a5f7a);border-radius:28px;padding:24px;color:white;margin-bottom:16px;">
                <div style="font-size:3.5rem;font-weight:900;color:${scoreColor};">${totalScore}%</div>
                <div style="font-size:1.1rem;font-weight:700;margin-top:4px;">${scoreLabel} клювання</div>
                <div style="font-size:0.85rem;opacity:0.8;margin-top:6px;">${now.toLocaleDateString('uk-UA',{weekday:'long',day:'numeric',month:'long'})}</div>
                <div style="font-size:1.4rem;margin-top:8px;">${weatherIcon} ${weatherDesc}</div>
            </div>

            <!-- Погодні параметри -->
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
                <div style="background:#fff8e1;border-radius:20px;padding:14px;text-align:center;">
                    <div style="font-size:2rem;">🌡️</div>
                    <div style="font-weight:800;font-size:1.3rem;margin-top:2px;">${temp}°C</div>
                    <div style="font-size:0.78rem;color:#888;">${T('forecast_temp')}</div>
                </div>
                <div style="background:#e3f2fd;border-radius:20px;padding:14px;text-align:center;">
                    <div style="font-size:2rem;">💨</div>
                    <div style="font-weight:800;font-size:1.3rem;margin-top:2px;">${wind} м/с</div>
                    <div style="font-size:0.78rem;color:#888;">${T('forecast_wind')} ${windDirName}</div>
                </div>
                <div style="background:#f3e5f5;border-radius:20px;padding:14px;text-align:center;">
                    <div style="font-size:2rem;">🔵</div>
                    <div style="font-weight:800;font-size:1.3rem;margin-top:2px;">${pressure}</div>
                    <div style="font-size:0.78rem;color:#888;">${T('forecast_pressure')}</div>
                </div>
                <div style="background:#e8f5e9;border-radius:20px;padding:14px;text-align:center;">
                    <div style="font-size:2rem;">🌧️</div>
                    <div style="font-weight:800;font-size:1.3rem;margin-top:2px;">${rain} мм</div>
                    <div style="font-size:0.78rem;color:#888;">${T('forecast_rain')}</div>
                </div>
                <div style="background:#f0fdf4;border-radius:20px;padding:14px;text-align:center;">
                    <div style="font-size:2rem;">${moonPhase}</div>
                    <div style="font-weight:700;font-size:0.95rem;margin-top:2px;">${T('forecast_moon')}</div>
                    <div style="font-size:0.78rem;color:#888;">Фаза ${Math.floor((now.getDate()%30)/4)+1}/8</div>
                </div>
                <div style="background:#fff3e0;border-radius:20px;padding:14px;text-align:center;">
                    <div style="font-size:2rem;">💧</div>
                    <div style="font-weight:800;font-size:1.3rem;margin-top:2px;">${humidity}%</div>
                    <div style="font-size:0.78rem;color:#888;">${T('forecast_humidity')}</div>
                </div>
            </div>

            <!-- Водойми поруч -->
            ${nearWater.length ? `
            <div style="background:#e8f5e9;border-radius:20px;padding:14px;margin-bottom:8px;">
                <div style="font-weight:800;color:#2e7d32;margin-bottom:8px;">' + T('forecast_nearby_water') + ' (${nearWater.length}):</div>
                ${nearWater.map(w=>`
                <div style="font-size:0.85rem;color:#555;padding:4px 0;border-bottom:1px solid #c8e6c9;">
                    🎣 ${w.name} · ${Math.round(getDistance(lat,lng,w.lat,w.lng)/1000)} км
                </div>`).join('')}
            </div>` : `
            <div style="background:#fff3cd;border-radius:20px;padding:12px;margin-bottom:8px;font-size:0.85rem;color:#856404;">
                ' + T('forecast_no_nearby') + '
            </div>`}`;

        } catch(err) {
            document.getElementById('forecastLocationStatus').innerHTML = T('forecast_weather_error');
            renderForecastBasic();
        }
    }
}

function renderCampings() {
    localStorage.setItem('mf_current_section', 'campings');
    ensureLeafletFallback();
    const app = document.getElementById('appRoot');
    let nearbyOnly = false;
    app.innerHTML = `
    <div class="nickname-header">👤 ${currentUser.nickname}</div>
    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h1>${T('campings_title')}</h1>
            <button id="backCampings" class="back-btn">${T('back')}</button>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:10px;">
            <input id="campingSearch" placeholder="${T('campings_search')}" style="flex:1;margin:0;">
            <button id="campingNearbyBtn" class="btn btn-secondary" style="white-space:nowrap;">${T('nearby_50')}</button>
        </div>
        <button id="getCampingLocation" class="btn btn-location btn-block">${T('your_location')}</button>
        <div id="campingLocationStatus" style="margin:8px 0;font-size:0.85rem;color:#888;text-align:center;"></div>
        <div id="campingMap" class="map-container"></div>
        <div id="campingList"></div>
    </div>`;
    document.getElementById('backCampings').onclick = () => renderMainMenu();
    document.getElementById('getCampingLocation').onclick = () => {
        getUserLocation(ok => {
            if (ok) {
                document.getElementById('campingLocationStatus').innerHTML = `' + T('location_defined') + '`;
                renderCampingList();
            } else { document.getElementById('campingLocationStatus').innerHTML = T('location_error'); }
        });
    };
    document.getElementById('campingNearbyBtn').onclick = () => {
        if (!currentLocation) { alert('❌ '+T('your_location')); return; }
        nearbyOnly = !nearbyOnly;
        const btn = document.getElementById('campingNearbyBtn');
        btn.style.background = nearbyOnly ? '#27ae60' : '';
        btn.style.color = nearbyOnly ? 'white' : '';
        renderCampingList();
    };
    document.getElementById('campingSearch').oninput = () => renderCampingList();
    let cMap = null;
    function renderCampingList() {
        const q = document.getElementById('campingSearch').value.toLowerCase();
        let filtered = campings.filter(c => {
            const matchQ = !q || c.name.toLowerCase().includes(q) || (c.city||'').toLowerCase().includes(q) || c.services.toLowerCase().includes(q);
            const matchNearby = !nearbyOnly || !currentLocation || getDistance(currentLocation.lat,currentLocation.lng,c.lat,c.lng) <= 50000;
            return matchQ && matchNearby;
        });
        if (currentLocation) filtered.sort((a,b) => getDistance(currentLocation.lat,currentLocation.lng,a.lat,a.lng) - getDistance(currentLocation.lat,currentLocation.lng,b.lat,b.lng));
        const mapDiv = document.getElementById('campingMap');
        if (cMap) { try { cMap.remove(); } catch(e){} }
        cMap = L.map(mapDiv).setView([49.5,26],6);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'OSM'}).addTo(cMap);
        setTimeout(() => { try { cMap.invalidateSize(); } catch(e){} }, 300);
        if (currentLocation) { cMap.setView([currentLocation.lat,currentLocation.lng],9); L.marker([currentLocation.lat,currentLocation.lng]).addTo(cMap).bindPopup(T('you_are_here')); }
        const listDiv = document.getElementById('campingList');
        if (!filtered.length) { listDiv.innerHTML = '<div style="text-align:center;padding:40px;color:#aaa;">' + T('nothing_found') + '</div>'; return; }
        listDiv.innerHTML = filtered.map(c => {
            if (!c.reviews) c.reviews = [];
            const reviews = c.reviews;
            const avg = reviews.length ? Math.round(reviews.reduce((s,r)=>s+(r.rating||0),0)/reviews.length) : 0;
            const crowns = [1,2,3,4,5].map(i=>`<span style="font-size:1.3rem;cursor:pointer;opacity:${i<=avg?1:0.22};" onclick="window.openCampingReview('${c.name}')">👑</span>`).join('');
            const revCount = reviews.length ? `<span style="font-size:0.78rem;color:#888;margin-left:4px;">(${reviews.length} відгук${reviews.length===1?'':reviews.length<5?'и':'ів'})</span>` : '<span style="font-size:0.78rem;color:#bbb;margin-left:4px;">' + T('no_reviews') + '</span>';
            const dist = currentLocation ? `<span style="color:#27ae60;font-weight:700;font-size:0.82rem;">📏 ${Math.round(getDistance(currentLocation.lat,currentLocation.lng,c.lat,c.lng)/1000)} км</span>` : '';
            try { L.marker([c.lat,c.lng]).addTo(cMap).bindPopup(`🏕️ <b>${c.name}</b><br>📍 ${c.city}<br>${avg?'👑'.repeat(avg):T('no_reviews')}`); } catch(e){}
            return `<div class="camping-card">
                <div class="camping-img">🏕️</div>
                <div class="camping-body">
                    <div class="camping-title">${c.name}</div>
                    <div style="font-size:0.83rem;color:#888;margin-bottom:6px;">📍 ${c.city} ${dist}</div>
                    <div style="font-size:0.83rem;color:#555;margin-bottom:10px;">${c.services}</div>
                    <div style="display:flex;align-items:center;gap:2px;margin-bottom:10px;">${crowns}${revCount}</div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                        <button onclick="window.openCampingReview('${c.name}')" style="background:#f5c518;color:#1a0a00;border:none;padding:10px 18px;border-radius:40px;font-weight:800;font-size:0.85rem;cursor:pointer;">${T('review_btn')}</button>
                        <a href="tel:${c.phone}" style="background:#27ae60;color:white;padding:10px 14px;border-radius:40px;text-decoration:none;font-size:0.82rem;font-weight:700;">📞 ${c.phone}</a>
                        <button onclick="window.open('https://www.google.com/maps?q=${c.lat},${c.lng}','_blank')" style="background:#3b82f6;color:white;border:none;padding:10px 14px;border-radius:40px;font-size:0.82rem;font-weight:700;cursor:pointer;">🗺️ Карта</button>
                    </div>
                    ${!c.site ? `<div style="margin-top:10px;background:linear-gradient(135deg,#1f3b4c,#2a5f7a);border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;">
                        <div style="color:white;font-size:0.85rem;font-weight:800;">Немає свого сайту? Зробимо!</div>
                        <a href="mailto:ckbbuild@gmail.com?subject=Реклама MagicFish — ${c.name}" style="background:#f39c12;color:#1a0a00;padding:8px 14px;border-radius:40px;text-decoration:none;font-size:0.78rem;font-weight:900;white-space:nowrap;margin-left:10px;">📧 Написати</a>
                    </div>` : ''}
                    ${reviews.length ? `<div style="margin-top:10px;border-top:1px solid #f0f0f0;padding-top:8px;">${reviews.slice(-2).reverse().map(r=>`<div style="font-size:0.82rem;margin-bottom:6px;"><span style="font-weight:700;color:#1f3b4c;">👤 ${r.author}</span> <span>${'👑'.repeat(r.rating||0)}</span><div style="color:#666;margin-top:2px;">${r.text}</div></div>`).join('')}</div>` : ''}
                </div>
            </div>`;
        }).join('');
    }
    renderCampingList();
}
window.openCampingReview = function(name) {
    const c = campings.find(x=>x.name===name); if (!c) return;
    if (!c.reviews) c.reviews = [];
    let sel = 0;
    const modal = openModal(`
        <h2 style="margin-bottom:4px;">✍️ Відгук про кемпінг</h2>
        <div style="font-size:0.9rem;color:#888;margin-bottom:16px;">🏕️ ${c.name}</div>
        <div style="margin-bottom:16px;"><div style="font-weight:700;margin-bottom:8px;">Оцінка:</div>
        <div id="campCrowns" style="display:flex;gap:8px;">${[1,2,3,4,5].map(i=>`<span data-r="${i}" style="font-size:2.4rem;cursor:pointer;opacity:0.25;transition:0.15s;">👑</span>`).join('')}</div></div>
        <div class="input-group"><label>Відгук</label><textarea id="campRevText" placeholder="Розкажіть про кемпінг..." style="min-height:90px;"></textarea></div>
        <button id="saveCampRev" class="btn btn-block">✅ Опублікувати</button>
        <button class="close-modal" style="margin-top:8px;width:100%;padding:10px;background:#f5f5f5;border:none;border-radius:40px;cursor:pointer;font-weight:700;">Скасувати</button>
    `);
    const stars = modal.querySelectorAll('#campCrowns span');
    const hl = n => stars.forEach((s,i)=>{ s.style.opacity=i<n?'1':'0.25'; s.style.transform=i<n?'scale(1.2)':'scale(1)'; });
    stars.forEach(s=>{ s.onclick=()=>{ sel=parseInt(s.dataset.r); hl(sel); }; s.onmouseenter=()=>hl(parseInt(s.dataset.r)); s.onmouseleave=()=>hl(sel); });
    modal.querySelector('.close-modal').onclick = () => modal.remove();
    modal.querySelector('#saveCampRev').onclick = () => {
        const text = modal.querySelector('#campRevText').value.trim();
        if (!sel) { alert('Оберіть оцінку 👑'); return; }
        if (!text) { alert('Напишіть відгук'); return; }
        c.reviews.push({ author: currentUser.nickname, rating: sel, text: filterMat(text), date: new Date().toISOString().slice(0,10) });
        saveAll(); modal.remove(); renderCampings();
    };
};

            </div>
            ${!t.site ? `<div style="margin-top:10px;background:linear-gradient(135deg,#1f3b4c,#2a5f7a);border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;">

                <a href="mailto:ckbbuild@gmail.com?subject=Реклама MagicFish — ${t.agency}" style="background:#f39c12;color:#1a0a00;padding:8px 14px;border-radius:40px;text-decoration:none;font-size:0.78rem;font-weight:900;white-space:nowrap;margin-left:10px;">📧 Написати</a>
            </div>` : ''}
        </div>`;
    }).join('') || '<div style="text-align:center;padding:40px;color:#aaa;">🚌 Турів поки немає</div>';
}

        const filtered = allItems.filter(item => {
            const matchCat = activeCat==='all' || item.category===activeCat;
            const matchQ = !searchQ || item.title.toLowerCase().includes(searchQ) || (item.desc||'').toLowerCase().includes(searchQ);
            return matchCat && matchQ;
        });
        app.innerHTML = `
        <div class="nickname-header">👤 ${currentUser.nickname}</div>
        <div class="card" style="padding:0;overflow:hidden;">
            <div style="background:linear-gradient(135deg,#1f3b4c,#2a5f7a);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-radius:48px 48px 0 0;">
                <div style="color:white;font-size:1.3rem;font-weight:900;">${T('marketplace_title')}</div>
                <button id="backMarket" class="back-btn">${T('back')}</button>

            <div style="padding:12px 16px 0;">

                <div style="display:flex;gap:8px;margin-bottom:12px;">

                </div>
                <div class="category-tabs" style="margin-bottom:12px;">
                    <button class="category-tab${activeCat==='all'?' active':''}" data-cat="all">Всі</button>
                    ${SECONDHAND_CATS.map(c=>`<button class="category-tab${activeCat===c.id?' active':''}" data-cat="${c.id}" style="font-size:0.78rem;padding:6px 12px;">${c.label}</button>`).join('')}

            </div>
            <div style="padding:0 16px 16px;">

                filtered.map(item => {
                    const isStore = !!item.storeId;

                    return `<div class="listing-card" style="border-left:4px solid ${isStore?'#3b82f6':'#f39c12'};">
                        <div style="display:flex;gap:12px;">
                            <div style="width:70px;height:70px;background:#f5f5f5;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:2rem;flex-shrink:0;">${catIcon}</div>
                            <div style="flex:1;min-width:0;">
                                <div style="font-weight:800;font-size:1rem;color:#1f3b4c;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.title}</div>
                                <div style="font-size:1.1rem;font-weight:900;color:#f39c12;margin-bottom:4px;">${displayPrice(item.price, item.currency||'UAH', true)}</div>
                                <div style="font-size:0.78rem;color:#aaa;">${isStore?`🏪 ${item.storeName}`:`👤 ${item.seller}`}${item.subcategory?' · '+item.subcategory:''}</div>
                                <div style="font-size:0.82rem;color:#666;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${item.desc||''}</div>

function renderStores() {
    localStorage.setItem('mf_current_section', 'stores');
    ensureLeafletFallback();
    const app = document.getElementById('appRoot');
    let nearbyOnly = false;
    app.innerHTML = `
    <div class="nickname-header">👤 ${currentUser.nickname}</div>
    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h1>${T('stores_title')}</h1>
            <button id="backStores" class="back-btn">${T('back')}</button>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:10px;">
            <input id="storeSearch" placeholder="${T('stores_search')}" style="flex:1;margin:0;">
            <button id="storeNearbyBtn" class="btn btn-secondary" style="white-space:nowrap;">${T('nearby_50')}</button>
        </div>
        <button id="getStoreLocation" class="btn btn-location btn-block">${T('your_location')}</button>
        <div id="storeLocationStatus" style="margin:8px 0;font-size:0.85rem;color:#888;text-align:center;"></div>
        <div id="storeMap" class="map-container"></div>
        <div id="storeList"></div>
    </div>`;
    document.getElementById('backStores').onclick = () => renderMainMenu();
    document.getElementById('getStoreLocation').onclick = () => {
        getUserLocation(ok => {
            if (ok) {
                document.getElementById('storeLocationStatus').innerHTML = `' + T('location_defined') + '`;
                renderStoreList();
            } else { document.getElementById('storeLocationStatus').innerHTML = '❌ Не вдалося'; }
        });
    };
    document.getElementById('storeNearbyBtn').onclick = () => {
        if (!currentLocation) { alert('❌ '+T('your_location')); return; }
        nearbyOnly = !nearbyOnly;
        const btn = document.getElementById('storeNearbyBtn');
        btn.style.background = nearbyOnly ? '#27ae60' : '';
        btn.style.color = nearbyOnly ? 'white' : '';
        renderStoreList();
    };
    document.getElementById('storeSearch').oninput = () => renderStoreList();
    let sMap = null;
    function renderStoreList() {
        const q = document.getElementById('storeSearch').value.toLowerCase();
        let filtered = stores.filter(s => {
            const matchQ = !q || s.name.toLowerCase().includes(q) || s.city.toLowerCase().includes(q) || s.gear.toLowerCase().includes(q) || s.address.toLowerCase().includes(q);
            const matchNearby = !nearbyOnly || !currentLocation || getDistance(currentLocation.lat,currentLocation.lng,s.lat,s.lng) <= 50000;
            return matchQ && matchNearby;
        });
        if (currentLocation) filtered.sort((a,b) => getDistance(currentLocation.lat,currentLocation.lng,a.lat,a.lng) - getDistance(currentLocation.lat,currentLocation.lng,b.lat,b.lng));
        const mapDiv = document.getElementById('storeMap');
        if (sMap) { try { sMap.remove(); } catch(e){} }
        sMap = L.map(mapDiv).setView([49.5,32],6);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'OSM'}).addTo(sMap);
        setTimeout(() => { try { sMap.invalidateSize(); } catch(e){} }, 300);
        if (currentLocation) { sMap.setView([currentLocation.lat,currentLocation.lng],10); L.marker([currentLocation.lat,currentLocation.lng]).addTo(sMap).bindPopup(T('you_are_here')); }
        const listDiv = document.getElementById('storeList');
        if (!filtered.length) { listDiv.innerHTML = '<div style="text-align:center;padding:40px;color:#aaa;">' + T('nothing_found') + '</div>'; return; }
        listDiv.innerHTML = filtered.map(s => {
            if (!s.reviews) s.reviews = [];
            const reviews = s.reviews;
            const avg = reviews.length ? Math.round(reviews.reduce((a,r)=>a+(r.rating||0),0)/reviews.length) : 0;
            const crowns = [1,2,3,4,5].map(i=>`<span style="font-size:1.3rem;cursor:pointer;opacity:${i<=avg?1:0.22};" onclick="window.openStoreReview('${s.name}')">👑</span>`).join('');
            const revCount = reviews.length ? `<span style="font-size:0.78rem;color:#888;margin-left:4px;">(${reviews.length} відгук${reviews.length===1?'':reviews.length<5?'и':'ів'})</span>` : '<span style="font-size:0.78rem;color:#bbb;margin-left:4px;">' + T('no_reviews') + '</span>';
            const dist = currentLocation ? `<span style="color:#27ae60;font-size:0.82rem;font-weight:700;">📏 ${Math.round(getDistance(currentLocation.lat,currentLocation.lng,s.lat,s.lng)/1000)} км від вас</span>` : '';
            try { L.marker([s.lat,s.lng]).addTo(sMap).bindPopup(`🏪 <b>${s.name}</b><br>📍 ${s.address}<br>${avg?'👑'.repeat(avg):T('no_reviews')}`); } catch(e){}
            return `<div class="store-card">
                <div style="font-weight:800;font-size:1.05rem;color:#1f3b4c;margin-bottom:4px;">🏪 ${s.name}</div>
                <div style="font-size:0.83rem;color:#888;margin-bottom:4px;">📍 ${s.address}</div>
                <div style="font-size:0.82rem;color:#555;margin-bottom:4px;">🕐 ${s.hours}</div>
                <div style="font-size:0.82rem;color:#555;margin-bottom:10px;">🛒 ${s.gear}</div>
                <div style="display:flex;align-items:center;gap:2px;margin-bottom:10px;">${crowns}${revCount}</div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
                    <button onclick="window.openStoreReview('${s.name}')" style="background:#f5c518;color:#1a0a00;border:none;padding:10px 18px;border-radius:40px;font-weight:800;font-size:0.85rem;cursor:pointer;">${T('review_btn')}</button>
                    <a href="tel:${s.phone}" style="background:#27ae60;color:white;padding:10px 14px;border-radius:40px;text-decoration:none;font-size:0.82rem;font-weight:700;">📞 ${s.phone}</a>
                    <button onclick="window.open('https://www.google.com/maps?q=${s.lat},${s.lng}','_blank')" style="background:#3b82f6;color:white;border:none;padding:10px 14px;border-radius:40px;font-size:0.82rem;font-weight:700;cursor:pointer;">🗺️ Карта</button>
                    ${s.site
                        ? `<a href="${s.site}" target="_blank" style="background:#f39c12;color:white;padding:10px 14px;border-radius:40px;text-decoration:none;font-size:0.82rem;font-weight:700;">🌐 Сайт</a>`
                        : `<button onclick="window.showMagicFishAd('${s.name}')" style="background:#f39c12;color:white;border:none;padding:10px 14px;border-radius:40px;font-size:0.82rem;font-weight:700;cursor:pointer;">🌐 Сайт</button>`
                    }
                    ${dist}
                </div>
                <!-- Рекламний блок MagicFish (якщо немає сайту) -->
                ${!s.site ? `<div style="margin-top:10px;background:linear-gradient(135deg,#1f3b4c,#2a5f7a);border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;">
                    <div style="color:white;font-size:0.78rem;">
                        <div style="font-weight:800;font-size:0.9rem;">${appLang==='uk'?'Немає свого сайту? Зробимо!':'No website? We\'ll make one!'}</div>
                    </div>
                    <a href="mailto:ckbbuild@gmail.com?subject=Реклама MagicFish — ${encodeURIComponent(s.name)}" style="background:#f39c12;color:#1a0a00;padding:8px 14px;border-radius:40px;text-decoration:none;font-size:0.78rem;font-weight:900;white-space:nowrap;margin-left:10px;">📧 Написати</a>
                </div>` : ''}
                </div>
                ${reviews.length ? `<div style="margin-top:10px;border-top:1px solid #f0f0f0;padding-top:8px;">${reviews.slice(-2).reverse().map(r=>`<div style="font-size:0.82rem;margin-bottom:6px;"><span style="font-weight:700;color:#1f3b4c;">👤 ${r.author}</span> <span>${'👑'.repeat(r.rating||0)}</span><div style="color:#666;margin-top:2px;">${r.text}</div></div>`).join('')}</div>` : ''}
            </div>`;
        }).join('');
    }
    renderStoreList();
}

window.openStoreReview = function(name) {
    const s = stores.find(x=>x.name===name); if (!s) return;
    if (!s.reviews) s.reviews = [];
    let sel = 0;
    const modal = openModal(`
        <h2 style="margin-bottom:4px;">✍️ Відгук про магазин</h2>
        <div style="font-size:0.9rem;color:#888;margin-bottom:16px;">🏪 ${s.name}</div>
        <div style="margin-bottom:16px;"><div style="font-weight:700;margin-bottom:8px;">Оцінка:</div>
        <div id="storeCrowns" style="display:flex;gap:8px;">${[1,2,3,4,5].map(i=>`<span data-r="${i}" style="font-size:2.4rem;cursor:pointer;opacity:0.25;transition:0.15s;">👑</span>`).join('')}</div></div>
        <div class="input-group"><label>Відгук</label><textarea id="storeRevText" placeholder="Асортимент, ціни, обслуговування..." style="min-height:90px;"></textarea></div>
        <button id="saveStoreRev" class="btn btn-block">✅ Опублікувати</button>
        <button class="close-modal" style="margin-top:8px;width:100%;padding:10px;background:#f5f5f5;border:none;border-radius:40px;cursor:pointer;font-weight:700;">Скасувати</button>
    `);
    const stars = modal.querySelectorAll('#storeCrowns span');
    const hl = n => stars.forEach((s,i)=>{ s.style.opacity=i<n?'1':'0.25'; s.style.transform=i<n?'scale(1.2)':'scale(1)'; });
    stars.forEach(s=>{ s.onclick=()=>{ sel=parseInt(s.dataset.r); hl(sel); }; s.onmouseenter=()=>hl(parseInt(s.dataset.r)); s.onmouseleave=()=>hl(sel); });
    modal.querySelector('.close-modal').onclick = () => modal.remove();
    modal.querySelector('#saveStoreRev').onclick = () => {
        const text = modal.querySelector('#storeRevText').value.trim();
        if (!sel) { alert('Оберіть оцінку 👑'); return; }
        if (!text) { alert('Напишіть відгук'); return; }
        s.reviews.push({ author: currentUser.nickname, rating: sel, text: filterMat(text), date: new Date().toISOString().slice(0,10) });
        saveAll(); modal.remove(); renderStores();
    };
};

            newsItems.unshift({title,content,link:modal.querySelector('#newsLink').value.trim()||'#',date:new Date().toISOString().slice(0,10)});
            saveAll(); modal.remove(); renderNews();
        };
    };
}

window.editListing = function(id) {

        <button class="close-modal">Скасувати</button>
    `);
    modal.querySelector('.close-modal').onclick = () => modal.remove();

        l.title = modal.querySelector('#editTitle').value.trim()||l.title;
        l.price = parseInt(modal.querySelector('#editPrice').value)||l.price;

window.markSold = function(id) {

};
window.deleteListing = function(id) {
    if (!confirm('Видалити оголошення?')) return;

    if (idx!==-1) { listings.splice(idx,1); saveAll(); }
    renderCabinet();
};

function renderHelpMap() {
    const mapDiv = document.getElementById('helpMap');
    if (!mapDiv) return;
    try {
        const helpMap = L.map(mapDiv).setView([49.5,32], 6);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'OSM'}).addTo(helpMap);
        setTimeout(() => { try { helpMap.invalidateSize(); } catch(e){} }, 300);
        if (currentLocation) {
            helpMap.setView([currentLocation.lat, currentLocation.lng], 10);
            L.marker([currentLocation.lat, currentLocation.lng]).addTo(helpMap).bindPopup(T('you_are_here'));
        }
        window.helpRequests.filter(r => r.status==='active' && r.lat && r.lng).forEach(r => {
            const cat = HELP_CATEGORIES.find(c=>c.id===r.category)||HELP_CATEGORIES[6];
            L.marker([r.lat,r.lng]).addTo(helpMap).bindPopup(`${cat.icon} <b>${cat.label}</b><br>👤 ${r.author}<br>📞 ${r.phone}`);
        });
    } catch(e) {}
}

    const list = document.getElementById('helpList');

        return;
    }
    list.innerHTML = active.map(r => {
        const cat = HELP_CATEGORIES.find(c=>c.id===r.category)||HELP_CATEGORIES[6];
        const dist = currentLocation && r.lat ? Math.round(getDistance(currentLocation.lat,currentLocation.lng,r.lat,r.lng)/1000) : null;
        return `<div style="background:white;border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.08);border-left:4px solid #f39c12;">

            <div style="display:flex;gap:8px;">
                <a href="tel:${r.phone}" style="flex:1;background:#27ae60;color:white;padding:10px;border-radius:40px;text-decoration:none;font-weight:700;font-size:0.85rem;text-align:center;">📞 ${r.phone}</a>

            </div>
        </div>`;
    }).join('');
}

window.closeHelpRequest = function(id) {

};

        </div>
        <button id="sendHelpReq" class="btn btn-block" style="background:#f39c12;">🤝 Надіслати запит</button>
        <button class="close-modal" style="margin-top:8px;width:100%;padding:10px;background:#f5f5f5;border:none;border-radius:40px;cursor:pointer;font-weight:700;">Скасувати</button>
    `);
    let selectedCat = null;
    const helpLat = currentLocation?.lat || null;
    const helpLng = currentLocation?.lng || null;
    modal.querySelectorAll('[data-cat]').forEach(btn => {
        btn.onclick = () => {
            modal.querySelectorAll('[data-cat]').forEach(b=>{b.style.background='white';b.style.borderColor='#eee';});
            btn.style.background='#fff3cd'; btn.style.borderColor='#f39c12';
            selectedCat = btn.dataset.cat;
        };
    });
    modal.querySelector('.close-modal').onclick = () => modal.remove();
    document.getElementById('sendHelpReq').onclick = () => {
        if (!selectedCat) { alert('Оберіть тип допомоги'); return; }
        if (!helpLat) { alert('Спочатку визначте геолокацію кнопкою на карті'); return; }
        window.helpRequests.unshift({
            id: Date.now().toString(), author: currentUser.nickname,
            phone: currentUser.phone, category: selectedCat,
            comment: document.getElementById('helpComment').value.trim(),
            lat: helpLat, lng: helpLng, time: Date.now(), status: 'active',
        });
        if (window.helpRequests.length>100) window.helpRequests.pop();
        saveHelpRequests();
        modal.remove();
        alert('✅ Запит надіслано!');
        renderHelpList();
    };
};

function renderSection(section) {
    localStorage.setItem('mf_current_section', section);
    if (section==='waterbodies') renderWaterbodies();
    else if (section==='campings') renderCampings();
    else if (section==='resorts') renderResorts();
    else if (section==='stores') renderStores();
    else if (section==='sos') renderSOS();
    else if (section==='help') renderHelpSection();
    else if (section==='marketplace') renderMarketplace();
    else if (section==='news') renderNews();
    else if (section==='alarm') renderGTRProducts();
    else if (section==='forecast') renderForecast();
    else if (section==='forum') renderForum();
    else if (section==='tours') renderTours();
    else if (section==='gtr_cases') renderGTRCases();
    else if (section==='cabinet') renderCabinet();
    else if (section==='reports') renderReports();
    else if (section==='lure_rating') renderLureRating();
    else if (section==='workshop') renderWorkshop();
    else if (section==='fishing_plans') renderFishingPlans();
    else if (section==='winter_fishing') renderWinterFishing();
    else if (section==='fishing_methods') renderFishingMethods();
    else if (section==='boats') renderBoats();
    else if (section==='underwater') renderUnderwater();
    else renderMainMenu();
}

// ========== ЗВІТИ З РИБАЛКИ (Instagram стиль) ==========
function renderReports() {
    localStorage.setItem('mf_current_section', 'reports');
    var app = document.getElementById('appRoot');
    var reports = JSON.parse(localStorage.getItem('mf_reports') || '[]');
    var myLikes = JSON.parse(localStorage.getItem('mf_report_likes') || '{}');

    var html = '<div class="nickname-header">👤 ' + (currentUser?currentUser.nickname:'') + '</div>';
    html += '<div class="card" style="padding:0;overflow:hidden;">';

    // Шапка
    html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:16px 16px 12px;">';
    html += '<h1 style="margin:0;font-size:1.3rem;">' + T('reports_title') + '</h1>';
    html += '<button onclick="renderMainMenu()" class="back-btn">' + T('back') + '</button>';
    html += '</div>';

    // Кнопка чекіну
    html += '<div style="padding:0 16px 14px;">';
    html += '<button id="addReportBtn" style="width:100%;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:14px;padding:14px;font-weight:700;font-size:0.95rem;cursor:pointer;">' + T('reports_add') + '</button>';
    html += '</div>';

    if (reports.length === 0) {
        html += '<div style="text-align:center;padding:40px 20px;color:#aaa;">';
        html += '<div style="font-size:4rem;margin-bottom:12px;">🎣</div>';
        html += '<div style="font-weight:700;margin-bottom:6px;">Поки немає звітів</div>';
        html += '<div style="font-size:0.85rem;">Зробіть перший чекін!</div></div>';
    } else {
        reports.slice().reverse().forEach(function(r) {
            var liked = myLikes[r.id] || false;
            html += '<div style="border-top:1px solid #f0f0f0;padding-bottom:4px;">';

            // Шапка поста
            html += '<div style="display:flex;align-items:center;gap:10px;padding:12px 16px 8px;">';
            html += '<div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0;">' + (r.fish||'🐟') + '</div>';
            html += '<div><div style="font-weight:700;font-size:0.9rem;">' + r.author + '</div>';
            if (r.water) html += '<div style="font-size:0.75rem;color:#888;">📍 ' + r.water + '</div>';
            html += '</div>';
            html += '<div style="margin-left:auto;font-size:0.72rem;color:#aaa;">' + r.date + '</div>';
            html += '</div>';

            // Фото або кольоровий блок
            if (r.photo) {
                html += '<div style="position:relative;">';
                html += '<img src="' + r.photo + '" style="width:100%;max-height:300px;object-fit:cover;display:block;">';
                if (r.water) html += '<div style="position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,0.6);color:#fff;padding:4px 10px;border-radius:40px;font-size:0.72rem;">📍 ' + r.water + '</div>';
                if (r.weight) html += '<div style="position:absolute;top:10px;right:10px;background:rgba(0,0,0,0.6);color:#f39c12;padding:4px 10px;border-radius:40px;font-size:0.82rem;font-weight:700;">' + r.weight + ' кг</div>';
                html += '</div>';
            } else {
                var bgColors = ['linear-gradient(135deg,#1a1a2e,#16213e)','linear-gradient(135deg,#1f3b4c,#2a5f7a)','linear-gradient(135deg,#1b4332,#2d6a4f)','linear-gradient(135deg,#3d405b,#6b6d8f)'];
                var bgIdx = r.id % bgColors.length;
                html += '<div style="background:' + bgColors[bgIdx] + ';height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;">';
                html += '<div style="font-size:5rem;margin-bottom:8px;">' + (r.fish||'🐟') + '</div>';
                if (r.weight) html += '<div style="color:#f39c12;font-weight:900;font-size:1.3rem;">' + r.weight + ' кг</div>';
                if (r.length) html += '<div style="color:#fff;font-size:0.9rem;opacity:0.8;">' + r.length + ' см</div>';
                if (r.water) html += '<div style="position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,0.5);color:#fff;padding:4px 10px;border-radius:40px;font-size:0.72rem;">📍 ' + r.water + '</div>';
                html += '</div>';
            }

            // Кнопки дій
            html += '<div style="display:flex;align-items:center;gap:4px;padding:10px 16px 6px;">';
            html += '<span id="like_btn_' + r.id + '"></span>';
            html += '<span id="comment_btn_' + r.id + '"></span>';
            html += '<div style="margin-left:auto;font-size:1.4rem;cursor:pointer;">🔖</div>';
            html += '</div>';

            // Лайки і опис
            html += '<div style="padding:0 16px 10px;">';
            html += '<div style="font-weight:700;font-size:0.82rem;margin-bottom:4px;">' + (r.likes||0) + ' вподобань</div>';
            if (r.title) {
                html += '<div style="font-size:0.85rem;"><span style="font-weight:700;">' + r.author + '</span> ' + r.title + '</div>';
            }
            if (r.lure) html += '<div style="font-size:0.82rem;color:#888;margin-top:2px;">🎣 ' + r.lure + '</div>';

            // Хештеги
            var tags = [];
            if (r.fish) tags.push('#' + (r.fish==='🐟'?'риба':r.fishName||'риба'));
            if (r.water) tags.push('#' + r.water.replace(/\s/g,''));
            tags.push('#magicfish', '#рибалка');
            html += '<div style="font-size:0.78rem;color:#3b82f6;margin-top:4px;">' + tags.join(' ') + '</div>';

            if (r.comments && r.comments.length > 0) {
                html += '<div style="font-size:0.8rem;color:#888;margin-top:4px;">Переглянути всі коментарі (' + r.comments.length + ')</div>';
                var lastComment = r.comments[r.comments.length-1];
                html += '<div style="font-size:0.83rem;margin-top:2px;"><span style="font-weight:700;">' + lastComment.author + '</span> ' + lastComment.text + '</div>';
            }
            html += '<div style="font-size:0.7rem;color:#aaa;margin-top:6px;text-transform:uppercase;">' + r.date + '</div>';
            html += '</div>';
            html += '</div>';
        });
    }

    html += '</div>';
    app.innerHTML = html;

    // Кнопки лайків і коментарів через DOM
    reports.slice().reverse().forEach(function(r) {
        var likeSpan = document.getElementById('like_btn_' + r.id);
        var commentSpan = document.getElementById('comment_btn_' + r.id);
        var liked = myLikes[r.id] || false;

        if (likeSpan) {
            var likeBtn = document.createElement('div');
            likeBtn.style.cssText = 'font-size:1.6rem;cursor:pointer;transition:transform 0.1s;';
            likeBtn.textContent = liked ? '❤️' : '🤍';
            likeBtn.onclick = (function(rid) { return function() {
                var likes = JSON.parse(localStorage.getItem('mf_report_likes') || '{}');
                var reps = JSON.parse(localStorage.getItem('mf_reports') || '[]');
                var rep = reps.find(function(x){return x.id===rid;});
                if (!rep) return;
                if (likes[rid]) {
                    delete likes[rid];
                    rep.likes = Math.max(0, (rep.likes||1)-1);
                } else {
                    likes[rid] = true;
                    rep.likes = (rep.likes||0)+1;
                    addPoints('like');
                }
                localStorage.setItem('mf_report_likes', JSON.stringify(likes));
                localStorage.setItem('mf_reports', JSON.stringify(reps));
                renderReports();
            }; })(r.id);
            likeSpan.appendChild(likeBtn);
        }

        if (commentSpan) {
            var comBtn = document.createElement('div');
            comBtn.style.cssText = 'font-size:1.5rem;cursor:pointer;margin-left:4px;';
            comBtn.textContent = '💬';
            comBtn.onclick = (function(rid) { return function() {
                var text = prompt('Ваш коментар:');
                if (!text) return;
                var reps = JSON.parse(localStorage.getItem('mf_reports') || '[]');
                var rep = reps.find(function(x){return x.id===rid;});
                if (!rep) return;
                if (!rep.comments) rep.comments = [];
                rep.comments.push({
                    author: currentUser?currentUser.nickname:'Гість',
                    text: text,
                    date: new Date().toLocaleDateString('uk-UA')
                });
                localStorage.setItem('mf_reports', JSON.stringify(reps));
                addPoints('comment');
                renderReports();
            }; })(r.id);
            commentSpan.appendChild(comBtn);
        }
    });

    // Кнопка чекіну
    document.getElementById('addReportBtn').onclick = function() {
        showCheckinForm();
    };
}

        '<button id="ci_submit" style="width:100%;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:40px;padding:14px;font-weight:700;font-size:1rem;cursor:pointer;margin-bottom:8px;">📍 Опублікувати чекін</button>' +
        '<button id="ci_cancel" style="width:100%;background:#eee;border:none;border-radius:40px;padding:12px;cursor:pointer;">Скасувати</button>';

    overlay.appendChild(modal);
    document.body.appendChild(overlay);

    // Автоматично визначаємо геолокацію
    if (currentLocation) {
        document.getElementById('ci_geo_status').innerHTML = '✅ Геолокація: ' + currentLocation.lat.toFixed(4) + ', ' + currentLocation.lng.toFixed(4);
    } else {
        document.getElementById('ci_geo_status').textContent = '📍 Геолокація не визначена';
    }

    modal.querySelector('#ci_cancel').onclick = function() { overlay.remove(); };

    // Обробник фото
    var photoData = null;
    var photoInput = modal.querySelector('#ci_photo');
    if (photoInput) {
        photoInput.onchange = function(e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(ev) {
                photoData = ev.target.result;
                var preview = modal.querySelector('#ci_photo_preview');
                var label = modal.querySelector('#ci_photo_label');
                if (preview) {
                    preview.innerHTML = '<img src="' + photoData + '" style="max-height:150px;border-radius:12px;max-width:100%;">';
                }
                if (label) label.style.borderColor = '#27ae60';
            };
            reader.readAsDataURL(file);
        };
    }
    overlay.onclick = function(e) { if (e.target===overlay) overlay.remove(); };

    modal.querySelector('#ci_submit').onclick = function() {
        var water = document.getElementById('ci_water').value.trim();
        var fish  = document.getElementById('ci_fish').value;
        var weight = document.getElementById('ci_weight').value;
        var length = document.getElementById('ci_length').value;
        var lure  = document.getElementById('ci_lure').value.trim();
        var text  = document.getElementById('ci_text').value.trim();

        var report = {
            id: Date.now(),
            fish: fish,
            water: water,
            weight: weight || null,
            length: length || null,
            lure: lure,
            title: text,
            photo: photoData || null,
            author: currentUser?currentUser.nickname:'Гість',
            date: new Date().toLocaleDateString('uk-UA'),
            likes: 0,
            comments: [],
            lat: currentLocation?currentLocation.lat:null,
            lng: currentLocation?currentLocation.lng:null
        };

        var reports = JSON.parse(localStorage.getItem('mf_reports') || '[]');
        reports.push(report);
        localStorage.setItem('mf_reports', JSON.stringify(reports));
        addPoints('checkin');
        overlay.remove();
        renderReports();
    };
}

function loadCustomCategories() {
    var customCats = JSON.parse(localStorage.getItem('mf_custom_cats') || '[]');
    customCats.forEach(function(c) {
        if (!ratingCategories.find(function(r){ return r.id === c.id; })) {
            ratingCategories.push({ id: c.id, name: c.name, emoji: c.emoji, items: [] });
        }
    });
}

function loadCustomRatingItems() {
    var customItems = JSON.parse(localStorage.getItem('mf_custom_items') || '{}');
    Object.keys(customItems).forEach(function(catId) {
        var cat = ratingCategories.find(function(c){ return c.id === catId; });
        if (cat) {
            customItems[catId].forEach(function(item) {
                if (!cat.items.find(function(i){ return i.id === item.id; })) {
                    cat.items.push(item);
                }
            });
        }
    });
}

function renderLureRating() {
    localStorage.setItem('mf_current_section', 'lurerating');

    var myVotes = JSON.parse(localStorage.getItem('mf_my_votes') || '{}');
    var votes = allVotes[selectedCat] || {};
    var comments = allComments[selectedCat] || {};

    var html = '<div class="nickname-header">👤 ' + (currentUser ? currentUser.nickname : '') + '</div>';
    html += '<div class="card">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">';
    html += '<h1 style="margin:0;">⭐ ' + T('menu_rating') + '</h1>';
    html += '<button onclick="renderMainMenu()" class="back-btn">' + T('back') + '</button>';
    html += '</div>';

    // Вкладки категорій
    html += '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;" id="catTabsContainer"></div>';

    // Кнопка додати розділ
    html += '<button id="addCatBtn" style="background:#e8f5e9;border:2px dashed #27ae60;border-radius:40px;padding:6px 14px;font-size:0.78rem;color:#27ae60;cursor:pointer;font-weight:700;margin:2px;">➕ Розділ</button>';

    // Список товарів
    var sorted = cat.items.map(function(l) {
        var v = votes[l.id] || {up:0, down:0};
        return Object.assign({}, l, {up: v.up||0, down: v.down||0, score: (v.up||0)-(v.down||0)});
    }).sort(function(a,b){ return b.score - a.score; });

    sorted.forEach(function(l, i) {
        var isTop = i < 3 && l.score > 0;
        var medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i+1)+'.';
        var myVote = myVotes[selectedCat+':'+l.id] || null;
        var itemComments = comments[l.id] || [];

        html += '<div style="background:' + (isTop?'#fffbeb':'#f9f9f9') + ';border-radius:16px;padding:12px;margin-bottom:10px;">';

        // Заголовок
        html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">';
        html += '<div style="font-size:1.2rem;width:26px;text-align:center;">' + medal + '</div>';
        html += '<div style="font-size:1.4rem;">' + l.emoji + '</div>';
        html += '<div style="flex:1;"><div style="font-weight:700;font-size:0.9rem;">' + l.name + '</div>';
        html += '<div style="font-size:0.72rem;color:#888;">' + l.cat + '</div></div>';
        html += '<div style="text-align:center;margin-right:4px;">';
        html += '<div style="font-size:1.1rem;font-weight:900;color:' + (l.score>0?'#27ae60':l.score<0?'#e74c3c':'#aaa') + ';">' + (l.score>0?'+':'') + l.score + '</div>';
        html += '<div style="font-size:0.65rem;color:#aaa;">рейтинг</div></div>';
        html += '</div>';

        // Кнопки голосування
        html += '<div style="display:flex;gap:8px;margin-bottom:8px;" id="vote_row_' + selectedCat + '_' + l.id + '">';
        html += '<span id="upbtn_' + selectedCat + '_' + l.id + '"></span>';
        html += '<span id="downbtn_' + selectedCat + '_' + l.id + '"></span>';
        html += '<span style="font-size:0.8rem;color:#888;align-self:center;">👍 ' + l.up + ' · 👎 ' + l.down + '</span>';
        html += '<button id="commentbtn_' + selectedCat + '_' + l.id + '" style="margin-left:auto;background:transparent;border:1px solid #ddd;border-radius:10px;padding:5px 10px;font-size:0.78rem;cursor:pointer;">💬 Відгук</button>';
        html += '</div>';

        if (itemComments.length > 0) {
            html += '<div style="border-top:1px solid #eee;padding-top:8px;">';

                var voteIcon = c.vote === 'up' ? '👍' : '👎';
                html += '<div style="background:#fff;border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:0.82rem;">';
                html += '<div style="display:flex;justify-content:space-between;margin-bottom:3px;">';
                html += '<span style="font-weight:700;color:#1f3b4c;">' + voteIcon + ' ' + (c.author||'Гість') + '</span>';

            if (itemComments.length > 3) {
                html += '<div style="font-size:0.75rem;color:#888;text-align:center;">+ ще ' + (itemComments.length-3) + ' відгуків</div>';
            }
            html += '</div>';

        html += '</div>';

    html += '</div>';
    app.innerHTML = html;

    // Вкладки категорій через DOM
    var tabsContainer = document.getElementById('catTabsContainer');
    ratingCategories.forEach(function(c) {
        var active = c.id === selectedCat;
        var btn = document.createElement('button');
        btn.textContent = c.emoji + ' ' + c.name;
        btn.style.cssText = 'background:' + (active?'#1f3b4c':'#f0f0f0') + ';color:' + (active?'#fff':'#333') + ';border:none;border-radius:40px;padding:6px 12px;font-size:0.78rem;cursor:pointer;font-weight:' + (active?'700':'400') + ';margin:2px;';
        btn.onclick = (function(cid){ return function(){ selectRatingCat(cid); }; })(c.id);
        tabsContainer.appendChild(btn);
    });

    // Кнопка Додати розділ
    var addCatBtn = document.getElementById('addCatBtn');
    if (addCatBtn) addCatBtn.onclick = function() { showAddCategory(); };

    // Кнопки голосування і відгуку через DOM
    sorted.forEach(function(l) {
        var myVote = myVotes[selectedCat+':'+l.id] || null;

        var upSpan = document.getElementById('upbtn_' + selectedCat + '_' + l.id);
        var downSpan = document.getElementById('downbtn_' + selectedCat + '_' + l.id);
        var commentBtn = document.getElementById('commentbtn_' + selectedCat + '_' + l.id);

        if (upSpan) {
            var upBtn = document.createElement('button');
            upBtn.textContent = '👍 За';

            if (myVote !== 'up') upBtn.onclick = (function(lid){ return function(){ voteRatingItem(lid,'up'); }; })(l.id);
            upSpan.appendChild(upBtn);
        }

        if (downSpan) {
            var downBtn = document.createElement('button');
            downBtn.textContent = '👎 Проти';
            downBtn.style.cssText = 'background:' + (myVote==='down'?'#e74c3c':'#fde8e8') + ';color:' + (myVote==='down'?'#fff':'#e74c3c') + ';border:1px solid #e74c3c;border-radius:10px;padding:6px 12px;cursor:pointer;font-size:0.82rem;font-weight:' + (myVote==='down'?'700':'400') + ';';
            if (myVote !== 'down') downBtn.onclick = (function(lid){ return function(){ voteRatingItem(lid,'down'); }; })(l.id);
            downSpan.appendChild(downBtn);
        }

        if (commentBtn) {
            commentBtn.onclick = (function(lid, lname){ return function() {
                showRatingCommentForm(lid, lname, selectedCat);
            }; })(l.id, l.name);
        }
    });

    // Кнопка Додати свою снасть
    var addBtn = document.getElementById('addCustomItemBtn');
    if (addBtn) addBtn.onclick = function() {
        showAddCustomItem(selectedCat, cat.name);
    };
}

        // Генеруємо унікальний id
        var newId = 'custom_' + Date.now();

        // Додаємо в категорію
        var cat_obj = ratingCategories.find(function(c){ return c.id === catId; });
        if (cat_obj) {
            cat_obj.items.push({ id: newId, name: name, emoji: emoji, cat: cat });
        }

        // Зберігаємо голос
        var allVotes = JSON.parse(localStorage.getItem('mf_rating_votes') || '{}');
        var myVotes = JSON.parse(localStorage.getItem('mf_my_votes') || '{}');
        if (!allVotes[catId]) allVotes[catId] = {};
        allVotes[catId][newId] = { up: selectedVote==='up'?1:0, down: selectedVote==='down'?1:0 };
        myVotes[catId+':'+newId] = selectedVote;
        localStorage.setItem('mf_rating_votes', JSON.stringify(allVotes));
        localStorage.setItem('mf_my_votes', JSON.stringify(myVotes));

        // Зберігаємо відгук якщо є
        if (review) {
            var allComments = JSON.parse(localStorage.getItem('mf_rating_comments') || '{}');
            if (!allComments[catId]) allComments[catId] = {};
            if (!allComments[catId][newId]) allComments[catId][newId] = [];
            allComments[catId][newId].push({
                vote: selectedVote, text: review,
                author: currentUser ? currentUser.nickname : 'Гість',
                date: new Date().toLocaleDateString('uk-UA')
            });
            localStorage.setItem('mf_rating_comments', JSON.stringify(allComments));
        }

        // Зберігаємо користувацькі снасті
        var customItems = JSON.parse(localStorage.getItem('mf_custom_items') || '{}');
        if (!customItems[catId]) customItems[catId] = [];
        customItems[catId].push({ id: newId, name: name, emoji: emoji, cat: cat,
            author: currentUser ? currentUser.nickname : 'Гість' });
        localStorage.setItem('mf_custom_items', JSON.stringify(customItems));

        addPoints('add_item');
        overlay.remove();
        renderLureRating();
        alert('✅ Снасть додано! Дякуємо за відгук.');
    };
}

window.voteRatingItem = function(itemId, voteType) {
    var selectedCat = localStorage.getItem('mf_rating_cat') || 'lures';
    var allVotes = JSON.parse(localStorage.getItem('mf_rating_votes') || '{}');
    var myVotes = JSON.parse(localStorage.getItem('mf_my_votes') || '{}');
    if (!allVotes[selectedCat]) allVotes[selectedCat] = {};
    if (!allVotes[selectedCat][itemId]) allVotes[selectedCat][itemId] = {up:0, down:0};
    var oldVote = myVotes[selectedCat+':'+itemId];
    if (oldVote) {
        allVotes[selectedCat][itemId][oldVote] = Math.max(0, (allVotes[selectedCat][itemId][oldVote]||1)-1);
    }
    allVotes[selectedCat][itemId][voteType] = (allVotes[selectedCat][itemId][voteType]||0) + 1;
    myVotes[selectedCat+':'+itemId] = voteType;
    localStorage.setItem('mf_rating_votes', JSON.stringify(allVotes));
    localStorage.setItem('mf_my_votes', JSON.stringify(myVotes));
    addPoints('vote');
    renderLureRating();
};

function renderFishingPlans() {
    localStorage.setItem('mf_current_section', 'fishingplans');
    var app = document.getElementById('appRoot');
    var plans = JSON.parse(localStorage.getItem('mf_plans') || '[]');

    var html = '<div class="nickname-header">👤 ' + (currentUser ? currentUser.nickname : '') + '</div>';
    html += '<div class="card">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">';
    html += '<h1 style="margin:0;">' + T('plans_title') + '</h1>';
    html += '<button onclick="renderMainMenu()" class="back-btn">' + T('back') + '</button>';
    html += '</div>';
    html += '<div style="font-size:0.82rem;color:#888;margin-bottom:14px;">Організовуйте спільні виїзди на рибалку</div>';
    html += '<button id="addPlanBtn" style="width:100%;background:#f39c12;color:#1a0a00;border:none;border-radius:14px;padding:13px;font-weight:700;cursor:pointer;margin-bottom:16px;">📅 Запланувати виїзд</button>';

    if (plans.length === 0) {
        html += '<div style="text-align:center;padding:32px;color:#aaa;"><div style="font-size:3rem;">📋</div><div>Немає запланованих виїздів</div></div>';
    } else {
        var now = new Date();
        plans.sort(function(a,b){ return new Date(a.dateVal) - new Date(b.dateVal); });
        plans.forEach(function(p) {
            var isPast = new Date(p.dateVal) < now;
            html += '<div style="background:' + (isPast ? '#f5f5f5' : '#fff') + ';border-radius:18px;padding:14px;margin-bottom:12px;border:1px solid ' + (isPast ? '#ddd' : '#f39c12') + ';opacity:' + (isPast ? '0.6' : '1') + ';">';
            html += '<div style="display:flex;justify-content:space-between;align-items:start;">';
            html += '<div><div style="font-weight:700;font-size:0.95rem;">' + p.title + '</div>';
            html += '<div style="font-size:0.78rem;color:#888;margin-top:3px;">📅 ' + p.date + ' · 📍 ' + (p.water||'місце не вказано') + '</div></div>';
            html += '<span style="background:' + (isPast ? '#eee' : '#fff3cd') + ';color:#856404;padding:4px 10px;border-radius:40px;font-size:0.72rem;font-weight:700;">' + (isPast ? 'Минуло' : '👥 ' + (p.members||1)) + '</span>';
            html += '</div>';
            if (p.text) html += '<div style="font-size:0.82rem;color:#555;margin-top:8px;">' + p.text + '</div>';
            if (!isPast) {
                html += '<button onclick="joinPlan(' + p.id + ')" style="margin-top:10px;background:#27ae60;color:#fff;border:none;border-radius:10px;padding:8px 16px;font-size:0.82rem;cursor:pointer;font-weight:600;">✋ Я їду!</button>';
            }
            html += '</div>';
        });
    }
    html += '</div>';
    app.innerHTML = html;

    document.getElementById('addPlanBtn').onclick = function() {
        var title  = prompt('Назва виїзду:'); if (!title) return;
        var date   = prompt('Дата (напр. 15.06.2025):'); if (!date) return;
        var water  = prompt('Водойма:') || '';
        var text   = prompt('Деталі (що ловимо, збір тощо):') || '';
        var dateVal = date.split('.').reverse().join('-');
        plans.push({ id:Date.now(), title:title, date:date, dateVal:dateVal,
            water:water, text:text, members:1,
            author: currentUser ? currentUser.nickname : 'Гість' });
        localStorage.setItem('mf_plans', JSON.stringify(plans));
        renderFishingPlans();
    };

    window.joinPlan = function(id) {
        var p = plans.find(function(x){return x.id===id;});
        if (p) {
            p.members = (p.members||1) + 1;
            localStorage.setItem('mf_plans', JSON.stringify(plans));
            addPoints('join_plan');
            renderFishingPlans();
        }
    };
}

    var html = '<div class="nickname-header">👤 ' + (currentUser?currentUser.nickname:'') + '</div>';
    html += '<div class="card">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">';
    html += '<h1 style="margin:0;">' + method.emoji + ' ' + method.name + '</h1>';
    html += '<button id="methodBackBtn" class="back-btn">' + T('back') + '</button></div>';
    html += '<div style="background:#f0f7ff;border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:0.85rem;color:#555;">' + method.desc + '</div>';
    html += '<button id="addMethodBtn" style="width:100%;background:#e8f5e9;border:2px dashed ' + method.color + ';border-radius:14px;padding:13px;color:' + method.color + ';font-weight:700;cursor:pointer;margin-bottom:14px;">+ Додати пораду / питання</button>';

    if (posts.length === 0) {
        html += '<div style="text-align:center;padding:24px;color:#aaa;"><div style="font-size:2.5rem;">' + method.emoji + '</div><div>Поки немає записів</div></div>';
    } else {
        posts.slice().reverse().forEach(function(p) {
            html += '<div style="background:#f9f9f9;border-radius:14px;padding:12px;margin-bottom:8px;">';
            html += '<div style="font-weight:700;font-size:0.88rem;margin-bottom:4px;">' + p.title + '</div>';
            html += '<div style="font-size:0.72rem;color:#888;margin-bottom:6px;">' + p.author + ' · ' + p.date + '</div>';
            if (p.text) html += '<div style="font-size:0.83rem;color:#444;">' + p.text + '</div>';
            html += '</div>';
        });
    }
    html += '</div>';
    app.innerHTML = html;

    var backBtn = document.getElementById('methodBackBtn');
    if (backBtn) backBtn.onclick = function() {
        localStorage.removeItem('mf_method_sel');
        renderFishingMethods();
    };

    document.getElementById('addMethodBtn').onclick = function() {
        var title = prompt('Тема / питання:'); if (!title) return;
        var text = prompt('Деталі:') || '';
        posts.push({ id:Date.now(), title:title, text:text,
            author: currentUser?currentUser.nickname:'Гість',
            date: new Date().toLocaleDateString('uk-UA') });
        localStorage.setItem('mf_method_' + method.id, JSON.stringify(posts));
        renderMethodDetail(method);
    };
}

// ========== ЧОВНИ ТА МОТОРИ ==========
function renderBoats() {
    localStorage.setItem('mf_current_section', 'boats');
    var app = document.getElementById('appRoot');
    var posts = JSON.parse(localStorage.getItem('mf_boats') || '[]');
    var cats = ['Гумові човни ПВХ','Алюмінієві човни','Катери','Підвісні мотори','Електромотори','Ехолоти та GPS','Обладнання','Безпека на воді','Інше'];

    var html = '<div class="nickname-header">👤 ' + (currentUser?currentUser.nickname:'') + '</div>';
    html += '<div class="card">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">';
    html += '<h1 style="margin:0;">' + T('boats_title') + '</h1>';
    html += '<button onclick="renderMainMenu()" class="back-btn">' + T('back') + '</button></div>';

    var selCat = localStorage.getItem('mf_boats_cat') || 'all';
    html += '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;" id="boatsCatTabs"></div>';
    html += '<button id="addBoatBtn" style="width:100%;background:#fff3e0;border:2px dashed #e65100;border-radius:14px;padding:13px;color:#e65100;font-weight:700;cursor:pointer;margin-bottom:14px;">' + T('forum_new_topic') + '</button>';

    var filtered = selCat === 'all' ? posts : posts.filter(function(p){ return p.cat === selCat; });
    if (filtered.length === 0) {
        html += '<div style="text-align:center;padding:32px;color:#aaa;"><div style="font-size:3rem;">🚤</div><div>Поки немає тем</div></div>';
    } else {
        filtered.slice().reverse().forEach(function(p) {
            html += '<div style="background:#fff8f0;border-radius:16px;padding:12px;margin-bottom:10px;">';
            html += '<div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:6px;">';
            html += '<div style="font-weight:700;font-size:0.92rem;">' + p.title + '</div>';
            html += '<span style="background:#ffe0b2;color:#e65100;padding:3px 8px;border-radius:40px;font-size:0.7rem;">' + p.cat + '</span></div>';
            html += '<div style="font-size:0.72rem;color:#888;margin-bottom:6px;">' + p.author + ' · ' + p.date + '</div>';
            if (p.text) html += '<div style="font-size:0.83rem;color:#444;">' + p.text + '</div>';
            html += '</div>';
        });
    }
    html += '</div>';
    app.innerHTML = html;

    var tabs = document.getElementById('boatsCatTabs');
    ['all'].concat(cats).forEach(function(c) {
        var active = c === selCat;
        var btn = document.createElement('button');
        btn.textContent = c === 'all' ? T('forum_all_cats') : c;
        btn.style.cssText = 'background:' + (active?'#e65100':'#f0f0f0') + ';color:' + (active?'#fff':'#333') + ';border:none;border-radius:40px;padding:6px 12px;font-size:0.78rem;cursor:pointer;margin:2px;';
        btn.onclick = (function(cat){ return function(){ localStorage.setItem('mf_boats_cat', cat); renderBoats(); }; })(c);
        tabs.appendChild(btn);
    });

    document.getElementById('addBoatBtn').onclick = function() {
        var catList = cats.map(function(c,i){ return (i+1)+'. '+c; }).join(', ');
        var catIdx = prompt('Категорія: ' + catList);
        if (!catIdx) return;
        var cat = cats[parseInt(catIdx)-1] || 'Інше';
        var title = prompt('Тема:'); if (!title) return;
        var text = prompt('Опис:') || '';
        posts.push({ id:Date.now(), title:title, cat:cat, text:text,
            author: currentUser?currentUser.nickname:'Гість',
            date: new Date().toLocaleDateString('uk-UA') });
        localStorage.setItem('mf_boats', JSON.stringify(posts));
        renderBoats();
    };
}
