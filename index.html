        </div>

        ${canAdd ? `<button id="addShBtn" class="btn btn-block" style="margin-bottom:16px;background:linear-gradient(135deg,#27ae60,#2ecc71);color:white;">📢 Розмістити оголошення</button>` : ''}

        <!-- Категорії -->
        <div id="shCategories"></div>
        <!-- Підкатегорії -->
        <div id="shSubcats" style="display:none;"></div>
        <!-- Список товарів -->
        <div id="shListings" style="display:none;"></div>
      </div>
    </div>`;

    document.getElementById('backMarket').onclick = () => renderMainMenu();
    document.getElementById('addShBtn')?.addEventListener('click', () => showAddListingModal(() => renderCategories()));
    document.getElementById('shSearchBtn').onclick = () => { searchQuery = document.getElementById('shSearch').value.trim(); renderSearchResults(); };
    document.getElementById('shSearch').onkeydown = e => { if (e.key==='Enter') { searchQuery = e.target.value.trim(); renderSearchResults(); } };

    function renderCategories() {
        currentCatId = null; currentSub = null;
        const catsDiv = document.getElementById('shCategories');
        const subsDiv = document.getElementById('shSubcats');
        const listDiv = document.getElementById('shListings');
        catsDiv.style.display = 'block';
        subsDiv.style.display = 'none';
        listDiv.style.display = 'none';

        // Лічильники по категоріях
        const counts = {};
        listings.filter(l=>l.status==='active').forEach(l => { counts[l.category] = (counts[l.category]||0)+1; });

        catsDiv.innerHTML = `
        <div style="font-size:0.8rem;font-weight:700;color:#888;letter-spacing:1px;margin-bottom:12px;">КАТЕГОРІЇ ОГОЛОШЕНЬ</div>
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;">
            ${SECONDHAND_CATS.map(cat => {
                const cnt = counts[cat.id] || 0;
                return `<button data-cat="${cat.id}" style="background:white;border:1.5px solid #eee;border-radius:18px;padding:14px 10px;text-align:left;cursor:pointer;transition:0.15s;display:flex;align-items:center;gap:8px;box-shadow:0 2px 6px rgba(0,0,0,0.06);">
                    <span style="font-size:1.4rem;">${cat.icon}</span>
                    <div style="min-width:0;">
                        <div style="font-size:0.82rem;font-weight:700;color:#1f3b4c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${cat.label.replace(/^[^\s]+\s/,'')}</div>
                        <div style="font-size:0.7rem;color:#aaa;">${cnt} оголошень</div>
                    </div>
                </button>`;
            }).join('')}
        </div>`;

        catsDiv.querySelectorAll('[data-cat]').forEach(btn => {
            btn.onmouseover = () => { btn.style.borderColor='#2a5f7a'; btn.style.background='#f0f8ff'; };
            btn.onmouseout  = () => { btn.style.borderColor='#eee';    btn.style.background='white'; };
            btn.onclick = () => { currentCatId = btn.dataset.cat; renderSubcats(); };
        });
    }

    function renderSubcats() {
        const cat = SECONDHAND_CATS.find(c=>c.id===currentCatId);
        if (!cat) return;
        const catsDiv = document.getElementById('shCategories');
        const subsDiv = document.getElementById('shSubcats');
        const listDiv = document.getElementById('shListings');
        catsDiv.style.display = 'none';
        subsDiv.style.display = 'block';
        listDiv.style.display = 'none';

        const subCounts = {};
        listings.filter(l=>l.status==='active'&&l.category===currentCatId).forEach(l => { subCounts[l.subcategory||''] = (subCounts[l.subcategory||'']||0)+1; });
        const totalCat = listings.filter(l=>l.status==='active'&&l.category===currentCatId).length;

        let brandsHtml = '';
        if (cat.brands) {
            brandsHtml = `<div style="font-size:0.8rem;font-weight:700;color:#888;letter-spacing:1px;margin:14px 0 8px;">БРЕНДИ</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;">
                ${cat.brands.map(b=>`<button data-sub="${b}" class="sub-brand-btn" style="background:#e8f4fd;color:#1565c0;border:none;border-radius:40px;padding:6px 14px;font-size:0.82rem;font-weight:600;cursor:pointer;">${b}</button>`).join('')}
            </div>`;
        }

        subsDiv.innerHTML = `
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
            <button id="backToCats" style="background:#eee;border:none;border-radius:40px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:0.85rem;">← Назад</button>
            <div style="font-weight:800;font-size:1rem;color:#1f3b4c;">${cat.label}</div>
        </div>
        <!-- Всі товари категорії -->
        <button data-sub="__all__" style="width:100%;background:linear-gradient(135deg,#1f3b4c,#2a5f7a);color:white;border:none;border-radius:16px;padding:12px;font-weight:700;cursor:pointer;margin-bottom:12px;font-size:0.9rem;">
            📋 Всі оголошення категорії (${totalCat})
        </button>
        ${brandsHtml}
        <div style="font-size:0.8rem;font-weight:700;color:#888;letter-spacing:1px;margin-bottom:8px;">ПІДКАТЕГОРІЇ ОГОЛОШЕНЬ</div>
        <div style="display:flex;flex-direction:column;gap:6px;">
            ${cat.sub.map(s => {
                const cnt = subCounts[s]||0;
                return `<button data-sub="${s}" style="background:white;border:1.5px solid #eee;border-radius:14px;padding:12px 16px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,0.05);">
                    <span style="font-size:0.88rem;font-weight:600;color:#1f3b4c;">${s}</span>
                    <span style="font-size:0.75rem;color:#aaa;background:#f0f0f0;padding:2px 10px;border-radius:40px;">${cnt}</span>
                </button>`;
            }).join('')}
        </div>`;

        document.getElementById('backToCats').onclick = () => renderCategories();
        subsDiv.querySelectorAll('[data-sub]').forEach(btn => {
            btn.onclick = () => {
                currentSub = btn.dataset.sub === '__all__' ? null : btn.dataset.sub;
                renderListings();
            };
        });
    }

    function renderListings() {
        const cat = SECONDHAND_CATS.find(c=>c.id===currentCatId);
        const catsDiv = document.getElementById('shCategories');
        const subsDiv = document.getElementById('shSubcats');
        const listDiv = document.getElementById('shListings');
        catsDiv.style.display = 'none';
        subsDiv.style.display = 'none';
        listDiv.style.display = 'block';

        let filtered = listings.filter(l => l.status==='active' && l.category===currentCatId);
        if (currentSub) filtered = filtered.filter(l => l.subcategory===currentSub);

        const sym = getCurrencySymbol();
        listDiv.innerHTML = `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
            <button id="backToSubs" style="background:#eee;border:none;border-radius:40px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:0.85rem;">← Назад</button>
            <div style="font-weight:700;font-size:0.9rem;color:#1f3b4c;">${cat?.label||''} ${currentSub?'· '+currentSub:''}</div>
            <span style="font-size:0.8rem;color:#aaa;">${filtered.length} оголошень</span>
        </div>
        <!-- Сортування -->
        <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;">
            <button class="sort-btn active" data-sort="new" style="background:#1e3a3a;color:white;border:none;border-radius:40px;padding:6px 14px;font-size:0.8rem;font-weight:700;cursor:pointer;">🆕 Нові</button>
            <button class="sort-btn" data-sort="cheap" style="background:#eee;border:none;border-radius:40px;padding:6px 14px;font-size:0.8rem;font-weight:600;cursor:pointer;">💰 Дешевші</button>
            <button class="sort-btn" data-sort="exp" style="background:#eee;border:none;border-radius:40px;padding:6px 14px;font-size:0.8rem;font-weight:600;cursor:pointer;">💎 Дорожчі</button>
        </div>
        <div id="shItemsList"></div>
        ${canAdd ? `<button id="addShBtn2" class="btn btn-block" style="margin-top:16px;">📢 Розмістити оголошення в цій категорії</button>` : ''}`;

        document.getElementById('backToSubs').onclick = () => renderSubcats();
        document.getElementById('addShBtn2')?.addEventListener('click', () => showAddListingModal(() => renderListings(), currentCatId, currentSub));

        // Сортування
        let sortedListings = [...filtered];
        listDiv.querySelectorAll('.sort-btn').forEach(btn => {
            btn.onclick = () => {
                listDiv.querySelectorAll('.sort-btn').forEach(b => { b.style.background='#eee'; b.style.color='#333'; });
                btn.style.background='#1e3a3a'; btn.style.color='white';
                if (btn.dataset.sort==='cheap') sortedListings.sort((a,b)=>a.price-b.price);
                else if (btn.dataset.sort==='exp') sortedListings.sort((a,b)=>b.price-a.price);
                else sortedListings.sort((a,b)=>b.id-a.id);
                renderItems(sortedListings);
            };
        });

        function renderItems(items) {
            const itemsDiv = document.getElementById('shItemsList');
            if (items.length === 0) {
                itemsDiv.innerHTML = `<div style="text-align:center;padding:30px;color:#aaa;">
                    <div style="font-size:2.5rem;margin-bottom:8px;">😕</div>
                    <div>Немає активних оголошень у цій підкатегорії</div>
                    ${canAdd?'<button id="addFirstBtn" class="btn" style="margin-top:12px;">📢 Розмістити перше оголошення</button>':''}
                </div>`;
                document.getElementById('addFirstBtn')?.addEventListener('click', () => showAddListingModal(()=>renderListings(), currentCatId, currentSub));
                return;
            }
            itemsDiv.innerHTML = '';
            items.forEach(l => {
                const div = document.createElement('div');
                div.style.cssText = 'background:white;border-radius:20px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.07);display:flex;gap:12px;cursor:pointer;transition:0.15s;';
                div.onmouseover = () => div.style.background='#fef9e6';
                div.onmouseout  = () => div.style.background='white';
                const photos = l.photos && l.photos.length > 0 ? l.photos : (l.photo ? [l.photo] : []);
                div.innerHTML = `
                    <div style="width:85px;height:85px;border-radius:14px;overflow:hidden;flex-shrink:0;background:#f0f0f0;display:flex;align-items:center;justify-content:center;">
                        ${photos[0] ? `<img src="${photos[0]}" style="width:100%;height:100%;object-fit:cover;">` : `<span style="font-size:2rem;">${cat?.icon||'🎣'}</span>`}
                    </div>
                    <div style="flex:1;min-width:0;">
                        <div style="font-weight:700;font-size:0.95rem;color:#1f3b4c;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${l.title}</div>
                        <div style="font-size:1.1rem;font-weight:900;color:#f39c12;margin-bottom:4px;">${sym}${l.price.toLocaleString()}</div>
                        <div style="font-size:0.78rem;color:#888;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">${l.desc}</div>
                        <div style="display:flex;align-items:center;justify-content:space-between;">
                            <span style="font-size:0.72rem;color:#aaa;">👁️ ${l.views||0} · 📅 ${l.date||''}</span>
                            <button class="contact-btn" data-seller="${l.seller}" style="background:#1f3b4c;color:white;border:none;border-radius:40px;padding:5px 12px;font-size:0.78rem;font-weight:700;cursor:pointer;">📞 Зв'язатись</button>
                        </div>
                    </div>`;
                div.querySelector('.contact-btn').onclick = e => {
                    e.stopPropagation();
                    showListingDetails(l, cat);
                };
                div.onclick = () => showListingDetails(l, cat);
                // Збільшуємо лічильник переглядів
                l.views = (l.views||0) + 1;
                itemsDiv.appendChild(div);
            });
        }
        renderItems(sortedListings);
    }

    function renderSearchResults() {
        if (!searchQuery) { renderCategories(); return; }
        const catsDiv = document.getElementById('shCategories');
        const subsDiv = document.getElementById('shSubcats');
        const listDiv = document.getElementById('shListings');
        catsDiv.style.display = 'none';
        subsDiv.style.display = 'none';
        listDiv.style.display = 'block';
        const sym = getCurrencySymbol();
        const q = searchQuery.toLowerCase();
        const found = listings.filter(l => l.status==='active' && (
            l.title.toLowerCase().includes(q) ||
            l.desc.toLowerCase().includes(q) ||
            (l.subcategory||'').toLowerCase().includes(q)
        ));
        listDiv.innerHTML = `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
            <button id="backToMain" style="background:#eee;border:none;border-radius:40px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:0.85rem;">← Назад</button>
            <div>🔍 «${searchQuery}» — ${found.length} результатів</div>
        </div>
        <div id="shSearchResults"></div>`;
        document.getElementById('backToMain').onclick = () => { searchQuery=''; renderCategories(); };
        const resultsDiv = document.getElementById('shSearchResults');
        if (found.length === 0) {
            resultsDiv.innerHTML = '<div style="text-align:center;padding:30px;color:#aaa;">😕 Нічого не знайдено</div>';
            return;
        }
        found.forEach(l => {
            const cat = SECONDHAND_CATS.find(c=>c.id===l.category);
            const div = document.createElement('div');
            div.style.cssText = 'background:white;border-radius:20px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.07);display:flex;gap:12px;cursor:pointer;';
            const photos = l.photos && l.photos.length > 0 ? l.photos : (l.photo ? [l.photo] : []);
            div.innerHTML = `
                <div style="width:75px;height:75px;border-radius:14px;overflow:hidden;flex-shrink:0;background:#f0f0f0;display:flex;align-items:center;justify-content:center;">
                    ${photos[0]?`<img src="${photos[0]}" style="width:100%;height:100%;object-fit:cover;">`:`<span style="font-size:1.8rem;">${cat?.icon||'🎣'}</span>`}
                </div>
                <div style="flex:1;">
                    <div style="font-size:0.72rem;color:#1565c0;font-weight:600;margin-bottom:2px;">${cat?.label||l.category}</div>
                    <div style="font-weight:700;font-size:0.9rem;color:#1f3b4c;">${l.title}</div>
                    <div style="font-size:1rem;font-weight:900;color:#f39c12;">${sym}${l.price.toLocaleString()}</div>
                    <button class="contact-btn2" data-seller="${l.seller}" style="background:#1f3b4c;color:white;border:none;border-radius:40px;padding:5px 12px;font-size:0.78rem;font-weight:700;cursor:pointer;margin-top:6px;">📞 Зв'язатись</button>
                </div>`;
            div.querySelector('.contact-btn2').onclick = e => { e.stopPropagation(); showListingDetails(l, cat); };
            div.onclick = () => showListingDetails(l, cat);
            resultsDiv.appendChild(div);
        });
    }

    renderCategories();
}

function showListingDetails(l, cat) {
    const sym = getCurrencySymbol();
    const photos = l.photos && l.photos.length > 0 ? l.photos : (l.photo ? [l.photo] : []);
    let photosHtml = photos.length > 0
        ? `<div style="display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px;">
            ${photos.map((p,i)=>`<img src="${p}" style="width:${photos.length===1?'100%':'120px'};height:${photos.length===1?'220px':'120px'};object-fit:cover;border-radius:16px;flex-shrink:0;">`).join('')}
           </div>`
        : `<div style="height:120px;background:#f0f0f0;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:3rem;margin-bottom:14px;">${cat?.icon||'🎣'}</div>`;

    // Знаходимо продавця
    const seller = currentUser.nickname === l.seller ? currentUser : { nickname: l.seller, phone: null };

    const modal = openModal(`
        ${photosHtml}
        <div style="font-size:0.75rem;color:#1565c0;font-weight:600;margin-bottom:4px;">${cat?.label||''} ${l.subcategory?'· '+l.subcategory:''}</div>
        <h3 style="font-size:1.2rem;margin-bottom:6px;">${l.title}</h3>
        <div style="font-size:1.5rem;font-weight:900;color:#f39c12;margin-bottom:12px;">${sym}${l.price.toLocaleString()}</div>
        <div style="background:#f5f7f0;border-radius:16px;padding:12px;margin-bottom:14px;font-size:0.85rem;color:#333;line-height:1.6;">${l.desc||'Без опису'}</div>
        <div style="font-size:0.8rem;color:#888;margin-bottom:14px;">
            👤 Продавець: <strong>${l.seller}</strong> · 📅 ${l.date||''} · 👁️ ${l.views||0} переглядів
        </div>
        <button id="contactSellerBtn" class="btn btn-block" style="margin-bottom:8px;">📞 Зв'язатись з автором</button>
        <button class="close-modal">Закрити</button>
    `);
    modal.querySelector('.close-modal').onclick = () => modal.remove();
    modal.querySelector('#contactSellerBtn').onclick = () => {
        alert(`💬 Чат з продавцем "${l.seller}"\n\nПовідомлення: "Доброго дня! Мене цікавить ваш товар: ${l.title}"\n\n(Повноцінний чат буде після підключення Supabase)`);
    };
}

function renderTournaments() {
    
    const app=document.getElementById('appRoot');
    const canOrg=canOrganizeTournament();
    const now=new Date();
    app.innerHTML=`
    <div class="nickname-header">👤 ${currentUser.nickname}</div>
    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h1>🏆 Турніри</h1><button id="backTournaments" class="back-btn">← Назад</button>
        </div>
        <div style="background:linear-gradient(135deg,#fff9e6,#fff3cd);border-radius:20px;padding:14px;margin-bottom:16px;">
            <strong>🔥 Активних: ${getActiveTournamentsCount()}</strong> · 👥 Учасників: ${getTotalParticipantsCount()}
        </div>
        ${canOrg?'<button id="createTBtn" class="btn btn-block" style="margin-bottom:16px;">➕ Створити турнір</button>':'<div style="background:#f0f0f0;border-radius:16px;padding:10px;margin-bottom:16px;font-size:0.82rem;color:#777;">Організовувати можуть: магазини, виробники, власники водойм</div>'}
        <div id="tournamentList"></div>
    </div>`;
    document.getElementById('backTournaments').onclick=()=>renderMainMenu();
    const listDiv=document.getElementById('tournamentList');
    tournaments.slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(t=>{
        const isReg=t.participants&&t.participants.includes(currentUser.nickname);
        const isFull=t.participants&&t.participants.length>=t.maxParticipants;
        const isPast=new Date(t.date)<now;
        const pct=Math.min(100,Math.round(((t.participants||[]).length/t.maxParticipants)*100));
        const card=document.createElement('div');card.className='tournament-card';
        card.innerHTML=`
            <div class="tournament-title">🏆 ${t.title}</div>
            <div class="tournament-meta">
                <span class="t-badge t-date">📅 ${new Date(t.date).toLocaleDateString('uk-UA')}</span>
                <span class="t-badge t-place">📍 ${t.place}</span>
                <span class="t-badge t-fee">💰 ${t.fee} грн внесок</span>
            </div>
            <div style="font-size:0.85rem;color:#555;margin-bottom:8px;">${t.description}</div>
            <div style="font-size:0.85rem;margin-bottom:6px;"><strong>🎁</strong> ${t.prizes}</div>
            <div style="font-size:0.8rem;color:#aaa;margin-bottom:4px;">👥 ${(t.participants||[]).length}/${t.maxParticipants} · Орг: ${t.organizer}</div>
            <div class="participants-bar"><div class="participants-fill" style="width:${pct}%"></div></div>
            ${isPast?'<button class="register-btn" disabled>Турнір завершено</button>':isFull?'<button class="register-btn" disabled>Місця заповнені</button>':isReg?`<button class="register-btn registered" data-tid="${t.id}">✅ Ви зареєстровані — скасувати</button>`:`<button class="register-btn" data-tid="${t.id}">🎯 ЗАРЕЄСТРУВАТИСЯ</button>`}`;
        listDiv.appendChild(card);
        card.querySelector('[data-tid]')?.addEventListener('click', btn => {
            const tid=parseInt(card.querySelector('[data-tid]').dataset.tid), tour=tournaments.find(x=>x.id===tid);
            if (!tour) return;
            if (isReg) { if(confirm('Скасувати реєстрацію?')){tour.participants=tour.participants.filter(p=>p!==currentUser.nickname);saveAll();renderTournaments();} }
            else { tour.participants.push(currentUser.nickname); saveAll(); const p=addPoints('tournament',`🏆 Реєстрація на турнір: ${tour.title}`); renderTournaments(); alert(`🎉 Ви зареєстровані!\n💰 Внесок ${tour.fee} грн на місці.\n🏅 +${p} балів нараховано!`); }
        });
    });
    if (canOrg) document.getElementById('createTBtn').onclick=()=>{
        const modal=openModal(`<h3>🏆 Новий турнір</h3>
            <input id="tTitle" placeholder="Назва турніру">
            <input id="tDate" type="date" min="${new Date().toISOString().split('T')[0]}">
            <input id="tPlace" placeholder="Місце">
            <input id="tPrizes" placeholder="Призи (напр. 1 місце — 3000 грн)">
            <input id="tFee" type="number" min="0" placeholder="Внесок (грн)">
            <input id="tMax" type="number" min="2" max="500" placeholder="Макс. учасників">
            <textarea id="tDesc" placeholder="Опис / правила"></textarea>
            <button id="saveTournament" class="btn btn-block">🏆 Створити</button>
            <button class="close-modal">Скасувати</button>`);
        modal.querySelector('.close-modal').onclick=()=>modal.remove();
        document.getElementById('saveTournament').onclick=()=>{
            const title=document.getElementById('tTitle').value.trim(), date=document.getElementById('tDate').value, place=document.getElementById('tPlace').value.trim(), prizes=document.getElementById('tPrizes').value.trim();
            if(!title||!date||!place||!prizes){alert("Заповніть обов'язкові поля");return;}
            tournaments.push({id:Date.now(),title,date,place,prizes,fee:parseInt(document.getElementById('tFee').value)||0,maxParticipants:parseInt(document.getElementById('tMax').value)||30,participants:[],organizer:currentUser.nickname,description:document.getElementById('tDesc').value||'',createdAt:new Date().toISOString()});
            saveAll(); modal.remove(); renderTournaments();
        };
    };
}

// --- Фаза Місяця (без бібліотек, проста формула) ---
function getMoonPhase(date) {
    const year = date.getFullYear(), month = date.getMonth()+1, day = date.getDate();
    let jd = 367*year - Math.floor(7*(year+Math.floor((month+9)/12))/4)
              + Math.floor(275*month/9) + day + 1721013.5
              + (date.getHours() - date.getTimezoneOffset()/60) / 24;
    const phase = ((jd - 2451550.1) / 29.530588853) % 1;
    const p = phase < 0 ? phase + 1 : phase;
    // 0=новий, 0.25=перша чверть, 0.5=повний, 0.75=остання чверть
    if (p < 0.03 || p > 0.97) return { name:'🌑 Новий місяць',    score:2, icon:'🌑', phase:p };
    if (p < 0.22)              return { name:'🌒 Молодик',          score:1, icon:'🌒', phase:p };
    if (p < 0.28)              return { name:'🌓 Перша чверть',     score:1, icon:'🌓', phase:p };
    if (p < 0.47)              return { name:'🌔 Прибуває',         score:0, icon:'🌔', phase:p };
    if (p < 0.53)              return { name:'🌕 Повний місяць',    score:2, icon:'🌕', phase:p };
    if (p < 0.72)              return { name:'🌖 Спадає',           score:0, icon:'🌖', phase:p };
    if (p < 0.78)              return { name:'🌗 Остання чверть',   score:1, icon:'🌗', phase:p };
    return                            { name:'🌘 Старий місяць',    score:1, icon:'🌘', phase:p };
}

// --- Алгоритм розрахунку індексу кльову ---
function calculateBiteIndex(weather, moon) {
    let score = 5; // базовий
    const factors = [];

    const temp = weather.temperature;
    if (temp >= 10 && temp <= 25) {
        score += 2; factors.push({ label:'🌡️ Температура', value:`${temp}°C`, note:'Оптимальна для більшості риб', delta:+2, good:true });
    } else if (temp > 25 && temp <= 30) {
        score += 1; factors.push({ label:'🌡️ Температура', value:`${temp}°C`, note:'Трохи тепло, але клів є', delta:+1, good:true });
    } else if (temp < 0) {
        score -= 2; factors.push({ label:'🌡️ Температура', value:`${temp}°C`, note:'Дуже холодно — риба млява', delta:-2, good:false });
    } else if (temp > 30) {
        score -= 1; factors.push({ label:'🌡️ Температура', value:`${temp}°C`, note:'Спека — риба йде на глибину', delta:-1, good:false });
    } else {
        score += 0; factors.push({ label:'🌡️ Температура', value:`${temp}°C`, note:'Прохолодно, але терпимо', delta:0, good:null });
    }

    const wind = weather.windspeed;
    if (wind >= 1 && wind <= 5) {
        score += 1; factors.push({ label:'💨 Вітер', value:`${wind} м/с`, note:'Легкий вітер — ідеально', delta:+1, good:true });
    } else if (wind > 5 && wind <= 10) {
        score += 0; factors.push({ label:'💨 Вітер', value:`${wind} м/с`, note:'Помірний — клів середній', delta:0, good:null });
    } else if (wind > 10) {
        score -= 2; factors.push({ label:'💨 Вітер', value:`${wind} м/с`, note:'Сильний вітер — небезпечно на воді', delta:-2, good:false });
    } else {
        score += 0; factors.push({ label:'💨 Вітер', value:`${wind} м/с`, note:'Штиль — риба обережна', delta:0, good:null });
    }

    const pressure = weather.pressure;
    const pressureDelta = weather.pressureDelta || 0;
    if (pressureDelta >= -1 && pressureDelta <= 1) {
        score += 2; factors.push({ label:'📊 Тиск', value:`${Math.round(pressure)} гПа`, note:'Стабільний — відмінний клів', delta:+2, good:true });
    } else if (pressureDelta > 1) {
        score += 1; factors.push({ label:'📊 Тиск', value:`${Math.round(pressure)} гПа`, note:'Повільно зростає — клів покращується', delta:+1, good:true });
    } else if (pressureDelta < -2) {
        score -= 2; factors.push({ label:'📊 Тиск', value:`${Math.round(pressure)} гПа`, note:'Різке падіння — риба не бере', delta:-2, good:false });
    } else {
        score -= 1; factors.push({ label:'📊 Тиск', value:`${Math.round(pressure)} гПа`, note:'Падає — клів знижений', delta:-1, good:false });
    }

    const clouds = weather.cloudcover;
    if (clouds >= 40 && clouds <= 80) {
        score += 1; factors.push({ label:'☁️ Хмарність', value:`${clouds}%`, note:'Помірна — риба менш обережна', delta:+1, good:true });
    } else if (clouds > 80) {
        score += 1; factors.push({ label:'☁️ Хмарність', value:`${clouds}%`, note:'Похмуро — хижак активний', delta:+1, good:true });
    } else {
        score -= 1; factors.push({ label:'☁️ Хмарність', value:`${clouds}%`, note:'Ясно — риба бачить приманку краще', delta:-1, good:false });
    }

    const rain = weather.precipitation || 0;
    if (rain > 5) {
        score -= 1; factors.push({ label:'🌧️ Опади', value:`${rain} мм/год`, note:'Сильний дощ — клів послаблений', delta:-1, good:false });
    } else if (rain > 0 && rain <= 2) {
        score += 1; factors.push({ label:'🌧️ Опади', value:`${rain} мм/год`, note:'Легкий дощ — клів активний!', delta:+1, good:true });
    } else {
        factors.push({ label:'🌧️ Опади', value:'Немає', note:'Без опадів', delta:0, good:null });
    }

    // Місяць
    score += moon.score;
    factors.push({ label:'🌕 Фаза місяця', value:moon.name, note: moon.score===2?'Максимальна активність':moon.score===1?'Підвищена активність':'Звичайна активність', delta:moon.score, good:moon.score>=1 });

    // Час доби
    const hour = new Date().getHours();
    let timeFactor = { delta:0, note:'Звичайний час' };
    if ((hour>=5&&hour<=9)||(hour>=18&&hour<=21)) { score+=1; timeFactor={delta:+1, note:'Ранок/вечір — пік активності'}; }
    else if (hour>=22||hour<=4) { timeFactor={delta:0, note:'Ніч — залежить від виду риби'}; }
    else { score-=1; timeFactor={delta:-1, note:'День — риба менш активна'}; }
    factors.push({ label:'⏰ Час доби', value:hour+':'+(new Date().getMinutes().toString().padStart(2,'0')), note:timeFactor.note, delta:timeFactor.delta, good:timeFactor.delta>=0 });

    // Нормалізація 0–10
    const index = Math.max(0, Math.min(10, score));
    return { index, factors };
}

// --- Отримати погоду з Open-Meteo ---
async function fetchWeatherForForecast(lat, lng) {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true&hourly=temperature_2m,pressure_msl,cloudcover,precipitation,windspeed_10m&timezone=auto&forecast_days=1`;
    const resp = await fetch(url);
    const data = await resp.json();
    const cw = data.current_weather;
    const hourIdx = data.hourly.time.findIndex(t => t.includes(new Date().toISOString().substr(0,13)));
    const hi = hourIdx >= 0 ? hourIdx : 0;
    const pressure = data.hourly.pressure_msl[hi] || 1013;
    const pressurePrev = data.hourly.pressure_msl[Math.max(0,hi-3)] || pressure;
    return {
        temperature:  Math.round(cw.temperature),
        windspeed:    Math.round(cw.windspeed / 3.6), // км/год → м/с
        weathercode:  cw.weathercode,
        pressure,
        pressureDelta: (pressure - pressurePrev) / 3,
        cloudcover:   data.hourly.cloudcover[hi] || 50,
        precipitation:data.hourly.precipitation[hi] || 0,
    };
}

        '</div>' +

        '<input id="orderCity" type="text" placeholder="Мiсто *" style="margin-bottom:8px;">' +
        '<input id="orderNP" type="text" placeholder="Вiддiлення Новоi Пошти *" style="margin-bottom:8px;">' +
        '<textarea id="orderComment" placeholder="Коментар" style="margin-bottom:12px;border-radius:16px;padding:12px;border:1px solid #ccc;width:100%;font-size:1rem;box-sizing:border-box;"></textarea>' +
        '<button id="orderSubmitBtn" class="btn btn-block" style="margin-bottom:8px;">&#x1F4E6; Пiдтвердити замовлення</button>' +
        '<button class="close-modal" style="width:100%;background:#eee;border:none;border-radius:40px;padding:12px;cursor:pointer;font-size:0.95rem;">Скасувати</button>' +
        '<div id="orderStatus" style="margin-top:8px;font-size:0.82rem;text-align:center;"></div>'
    );
    modal.querySelector('.close-modal').onclick = function() { modal.remove(); };
    modal.querySelector('#orderSubmitBtn').onclick = async function() {
        var name    = document.getElementById('orderName').value.trim();
        var phone   = document.getElementById('orderPhone').value.trim();
        var city    = document.getElementById('orderCity').value.trim();
        var np      = document.getElementById('orderNP').value.trim();
        var comment = document.getElementById('orderComment').value.trim();
        var statusEl = document.getElementById('orderStatus');
        if (!name || !phone || !city || !np) {
            statusEl.style.color = '#e74c3c';
            statusEl.textContent = 'Заповнiть всi обов язковi поля';
            return;
        }
        var btn = modal.querySelector('#orderSubmitBtn');
        btn.disabled = true;
        btn.textContent = 'Вiдправляємо...';
        try {
            var res = await fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({
                    access_key: 'd191f4ae-9d84-43f5-89bc-6df9e989073c',
                    subject: 'Нове замовлення GTR: ' + productName,
                    product: productName,
                    price: productPrice + ' грн',
                    name: name, phone: phone, city: city,
                    nova_poshta: np, comment: comment || '-',
                    from_name: 'MagicFish GTR Shop'
                })
            });
            if (res.ok) {
                var mc = modal.querySelector('.modal-content');
                mc.innerHTML = '';
                var successDiv = document.createElement('div');
                successDiv.style.textAlign = 'center';
                successDiv.style.padding = '20px';
                successDiv.innerHTML = '<div style="font-size:3rem;margin-bottom:12px;">&#x2705;</div>' +
                    '<div style="font-size:1.1rem;font-weight:700;color:#27ae60;margin-bottom:8px;">Замовлення прийнято!</div>' +
                    '<div style="font-size:0.85rem;color:#555;margin-bottom:16px;">Ми звяжемось з вами найближчим часом</div>';
                var closeBtn = document.createElement('button');
                closeBtn.textContent = 'Чудово!';
                closeBtn.style.cssText = 'background:#27ae60;color:#fff;border:none;border-radius:40px;padding:12px 30px;font-weight:700;cursor:pointer;';
                closeBtn.onclick = function() { modal.remove(); };
                successDiv.appendChild(closeBtn);
                mc.appendChild(successDiv);
            } else {
                throw new Error('error');
            }
        } catch(e) {
            statusEl.style.color = '#e74c3c';
            statusEl.textContent = 'Помилка. Зателефонуйте: +380503334455';
            btn.disabled = false;
            btn.textContent = 'Пiдтвердити замовлення';
        }
    };
}

    function renderLog() {
        const el = document.getElementById('gtrLog');
        if (!el) return;

            el.innerHTML = '<div style="text-align:center;padding:20px;color:#bbb;font-size:0.85rem;">поклювань ще не було</div>';
            return;

        el.innerHTML = '';

            const div = document.createElement('div');
            div.style.cssText = 'background:white;border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,0.06);';

    function addBite(ch) {
        const now = new Date();
        const time = [now.getHours(), now.getMinutes(), now.getSeconds()].map(n => String(n).padStart(2,'0')).join(':');
        ch.bites++;
        gtrTotalBites++;
        const biteEl = document.getElementById('gtrBiteCount');
        if (biteEl) { biteEl.textContent = gtrTotalBites; biteEl.style.animation = 'none'; setTimeout(() => biteEl.style.animation = '', 10); }
        gtrLog.unshift({ channel: ch.name, rod: ch.rod, time, color: ch.color });
        if (gtrLog.length > 50) gtrLog.pop();
        renderChannels();
        renderLog();
        if (gtrVibrOn && navigator.vibrate) navigator.vibrate([300, 100, 300]);
    }

    function startSim() {
        gtrSimTimer = setInterval(() => {
            const active = gtrChannels.filter(c => c.active);
            if (active.length === 0) return;
            if (Math.random() > 0.6) {
                const ch = active[Math.floor(Math.random() * active.length)];
                addBite(ch);
            }
        }, 5000);
    }

    function ensureLeafletFallback() {
        if (typeof L !== 'undefined') return; // Leaflet є — все добре
        window.L = {
            _maps: [],
            map: function(el) {
                if (typeof el === 'string') el = document.getElementById(el);
                if (!el) return this._dummyMap();

                const mapObj = {
                    _el: el, _lat: 49, _lng: 32, _zoom: 6,
                    _markers: [],
                    setView: function(latlng, zoom) {
                        this._lat = Array.isArray(latlng) ? latlng[0] : latlng.lat || 49;

                        const lat = this._lat, lng = this._lng, z = Math.min(this._zoom, 14);

                    bindPopup: function() { return this; },
                    on: function() { return this; }
                };
                L._maps.push(mapObj);

            },

function saveAll() {
    try {
        localStorage.setItem('mf_waterbodies', JSON.stringify(waterbodies));
        localStorage.setItem('mf_listings', JSON.stringify(listings));
        localStorage.setItem('mf_news', JSON.stringify(newsItems));
        localStorage.setItem('mf_tournaments', JSON.stringify(tournaments));
        localStorage.setItem('mf_campings', JSON.stringify(campings));
        localStorage.setItem('mf_tours', JSON.stringify(tours));
        localStorage.setItem('mf_store_products', JSON.stringify(storeProducts));
        if (currentUser) localStorage.setItem('mf_user', JSON.stringify(currentUser));
    } catch(e) {}
}
function loadAll() {
    try {
        let w=localStorage.getItem('mf_waterbodies'); 
        if(w) waterbodies=JSON.parse(w);
        // Ініціалізація 20 водойм при першому запуску
        else if(waterbodies.length === 0) {
            localStorage.setItem('mf_waterbodies', JSON.stringify(waterbodies));
        }
        let l=localStorage.getItem('mf_listings'); if(l) listings=JSON.parse(l);
        let n=localStorage.getItem('mf_news'); if(n) newsItems=JSON.parse(n);
        let u=localStorage.getItem('mf_user'); if(u) currentUser=JSON.parse(u);
        let tr=localStorage.getItem('mf_tournaments'); if(tr) tournaments=JSON.parse(tr);
        let cp=localStorage.getItem('mf_campings'); if(cp) campings=JSON.parse(cp);
        let to=localStorage.getItem('mf_tours'); if(to) tours=JSON.parse(to);
        let sp=localStorage.getItem('mf_store_products'); if(sp) storeProducts=JSON.parse(sp);
    } catch(e) {}
}

// ========== ГЕОЛОКАЦІЯ (покращена точність) ==========
function getUserLocation(callback) {
    if (!navigator.geolocation) { 
        console.log('Geolocation not supported');
        if (callback) callback(false); 
        return; 
    }

    // Покращені опції для точності
    const options = {
        enableHighAccuracy: true,  // Максимальна точність
        timeout: 15000,            // 15 секунд на отримання
        maximumAge: 0              // Не використовувати кеш
    };

    const tryGeo = () => navigator.geolocation.getCurrentPosition(
        pos => { 
            currentLocation = {
                lat: pos.coords.latitude, 
                lng: pos.coords.longitude,
                accuracy: pos.coords.accuracy
            };
            console.log('Location obtained:', currentLocation);
            if(callback) callback(true); 
        },
        (err) => {
            console.log('Geolocation error:', err.code, err.message);
            // Показуємо зрозумілу помилку користувачу
            if (err.code === 1) {
                alert('❌ Доступ до геолокації заборонено.\n\nДозвольте доступ до місцезнаходження в налаштуваннях браузера.');
            } else if (err.code === 2) {
                alert('❌ Не вдалося визначити місце.\n\nПеревірте що GPS увімкнено.');
            } else if (err.code === 3) {
                alert('⏱️ Час очікування вийшов.\n\nСпробуйте ще раз.');
            }
            if (callback) callback(false);
        },
        options
    );

    if (window.location.protocol !== 'https:' && window.location.protocol !== 'http:') {
        try { tryGeo(); } catch(e) { 
            console.log('Geolocation exception:', e);
            if (callback) callback(false); 
        }
    } else { 
        tryGeo(); 
    }
}

// ========== UNIVERSAL LOCATION PICKER ==========
function createLocationPicker(opts = {}) {
    const { 
        initialLat = null, 
        initialLng = null, 
        onChange = null,  // callback(lat, lng, address)
        showMap = true,
        country = 'Україна'
    } = opts;

    let selectedLat = initialLat;
    let selectedLng = initialLng;
    let selectedRegion = '';
    let selectedCity = '';
    let pickerMap = null;
    let marker = null;

    const container = document.createElement('div');
    container.style.cssText = 'margin-bottom:14px;';
    
    container.innerHTML = `
        <div style="font-weight:700;margin-bottom:8px;">📍 Місцезнаходження</div>
        
        <!-- GPS Auto -->
        <button id="gpsAutoBtn" type="button" style="width:100%;background:#2c5a6e;color:white;border:none;border-radius:40px;padding:10px;font-weight:700;cursor:pointer;margin-bottom:8px;">📍 Визначити автоматично (GPS)</button>
        
        <!-- Address selector -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
            <select id="regionSelect" style="padding:10px;border-radius:16px;border:1.5px solid #ddd;">
                <option value="">Оберіть область</option>
                ${Object.keys(UA_REGIONS).map(r=>`<option value="${r}">${r}</option>`).join('')}
            </select>
            <select id="citySelect" style="padding:10px;border-radius:16px;border:1.5px solid #ddd;" disabled>
                <option value="">Спочатку область</option>
            </select>
        </div>
        
        <!-- Map -->
        ${showMap ? '<div id="locationPickerMap" style="height:250px;border-radius:16px;margin-bottom:8px;border:2px solid #ddd;"></div>' : ''}
        
        <!-- Manual coords -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <input id="manualLatInput" type="number" step="0.0001" placeholder="Широта" value="${initialLat||''}" style="padding:10px;border-radius:16px;border:1.5px solid #ddd;">
            <input id="manualLngInput" type="number" step="0.0001" placeholder="Довгота" value="${initialLng||''}" style="padding:10px;border-radius:16px;border:1.5px solid #ddd;">
        </div>
        <div id="locationStatus" style="font-size:0.8rem;color:#888;margin-top:6px;"></div>
    `;

    // Initialize map if showMap
    setTimeout(() => {
        if (showMap) {
            ensureLeafletFallback();
            const mapDiv = container.querySelector('#locationPickerMap');
            if (mapDiv && typeof L !== 'undefined') {
                pickerMap = L.map(mapDiv).setView([initialLat || 49, initialLng || 32], initialLat ? 12 : 6);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {attribution:'OSM'}).addTo(pickerMap);
                
                if (initialLat && initialLng) {
                    marker = L.marker([initialLat, initialLng], {draggable: true}).addTo(pickerMap);
                    marker.on('dragend', function(e) {
                        const pos = e.target.getLatLng();
                        updateLocation(pos.lat, pos.lng, 'Переміщено на карті');
                    });
                }
                
                // Click to place marker
                pickerMap.on('click', function(e) {
                    if (marker) pickerMap.removeLayer(marker);
                    marker = L.marker([e.latlng.lat, e.latlng.lng], {draggable: true}).addTo(pickerMap);
                    marker.on('dragend', function(ev) {
                        const pos = ev.target.getLatLng();
                        updateLocation(pos.lat, pos.lng, 'Переміщено на карті');
                    });
                    updateLocation(e.latlng.lat, e.latlng.lng, 'Обрано на карті');
                });
                
                setTimeout(() => { if (pickerMap) pickerMap.invalidateSize(); }, 100);
            }
        }
    }, 100);

    function updateLocation(lat, lng, source) {
        selectedLat = lat;
        selectedLng = lng;
        container.querySelector('#manualLatInput').value = lat.toFixed(6);
        container.querySelector('#manualLngInput').value = lng.toFixed(6);
        const status = container.querySelector('#locationStatus');
        status.textContent = `✅ ${source}: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
        status.style.color = '#27ae60';
        
        if (pickerMap && marker) {
            marker.setLatLng([lat, lng]);
            pickerMap.setView([lat, lng], 12);
        } else if (pickerMap) {
            if (marker) pickerMap.removeLayer(marker);
            marker = L.marker([lat, lng], {draggable: true}).addTo(pickerMap);
            marker.on('dragend', function(e) {
                const pos = e.target.getLatLng();
                updateLocation(pos.lat, pos.lng, 'Переміщено на карті');
            });
            pickerMap.setView([lat, lng], 12);
        }
        
        const address = [selectedCity, selectedRegion, country].filter(Boolean).join(', ');
        if (onChange) onChange(lat, lng, address);
    }

    // GPS button
    container.querySelector('#gpsAutoBtn').onclick = () => {
        const btn = container.querySelector('#gpsAutoBtn');
        btn.textContent = '⏳ Визначаємо...';
        btn.disabled = true;
        getUserLocation(ok => {
            btn.disabled = false;
            btn.textContent = '📍 Визначити автоматично (GPS)';
            if (ok && currentLocation) {
                updateLocation(currentLocation.lat, currentLocation.lng, 'GPS');
            } else {
                const status = container.querySelector('#locationStatus');
                status.textContent = '❌ GPS недоступний. Оберіть на карті або вкажіть область/місто.';
                status.style.color = '#c62828';
            }
        });
    };

    // Region selector
    container.querySelector('#regionSelect').onchange = (e) => {
        selectedRegion = e.target.value;
        const citySelect = container.querySelector('#citySelect');
        if (selectedRegion) {
            const region = UA_REGIONS[selectedRegion];
            citySelect.disabled = false;
            citySelect.innerHTML = '<option value="">Оберіть місто</option>' + 
                region.cities.map(c=>`<option value="${c}">${c}</option>`).join('');
            // Auto-set to region center if no city selected yet
            if (!selectedCity) {
                updateLocation(region.lat, region.lng, `Область: ${selectedRegion}`);
            }
        } else {
            citySelect.disabled = true;
            citySelect.innerHTML = '<option value="">Спочатку область</option>';
        }
    };

    // City selector
    container.querySelector('#citySelect').onchange = (e) => {
        selectedCity = e.target.value;
        if (selectedCity && selectedRegion) {
            const region = UA_REGIONS[selectedRegion];
            // Approximate: use region center + small offset based on city index
            const cityIndex = region.cities.indexOf(selectedCity);
            const lat = region.lat + (cityIndex * 0.05);
            const lng = region.lng + (cityIndex * 0.05);
            updateLocation(lat, lng, `${selectedCity}, ${selectedRegion}`);
        }
    };

    // Manual input
    container.querySelector('#manualLatInput').oninput = (e) => {
        const lat = parseFloat(e.target.value);
        const lng = parseFloat(container.querySelector('#manualLngInput').value);
        if (!isNaN(lat) && !isNaN(lng)) {
            updateLocation(lat, lng, 'Введено вручну');
        }
    };
    container.querySelector('#manualLngInput').oninput = (e) => {
        const lat = parseFloat(container.querySelector('#manualLatInput').value);
        const lng = parseFloat(e.target.value);
        if (!isNaN(lat) && !isNaN(lng)) {
            updateLocation(lat, lng, 'Введено вручну');
        }
    };

    return {
        el: container,
        getLocation: () => ({ lat: selectedLat, lng: selectedLng, region: selectedRegion, city: selectedCity }),
        setLocation: (lat, lng) => updateLocation(lat, lng, 'Встановлено'),
    };
}

// ========== УТИЛІТИ ==========
function getDistance(lat1,lng1,lat2,lng2) {
    const R=6371000, dlat=(lat2-lat1)*Math.PI/180, dlng=(lng2-lng1)*Math.PI/180;
    const a=Math.sin(dlat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dlng/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function canChangeStatus(lat,lng) { return currentLocation && getDistance(currentLocation.lat,currentLocation.lng,lat,lng)<=300; }
function canOrganizeTournament() { return currentUser && ['waterowner','manufacturer','camping','resort','travelagency'].includes(currentUser.role); }
function canAddListing() {
    if (!currentUser) return false;
    const myListings = listings.filter(l=>l.seller===currentUser.nickname&&l.status!=='deleted').length;
    if (currentUser.role==='manufacturer') return true; // unlimited
    if (currentUser.role==='store') return myListings < 50;
    if (currentUser.role==='travelagency') return myListings < 10;
    if (currentUser.role==='waterowner'||currentUser.role==='resort') return myListings < 5;
    if (currentUser.role==='camping') return myListings < 3;
    // Base access (user) gets 50 listings
    return myListings < 50;
}
function myActiveListingsCount() { return listings.filter(l=>l.seller===currentUser.nickname&&l.status==='active').length; }
function getActiveTournamentsCount() { return tournaments.filter(t=>new Date(t.date)>=new Date()).length; }
function getTotalParticipantsCount() { return tournaments.reduce((s,t)=>s+(t.participants?t.participants.length:0),0); }

function updateSubscriptionStatus() {
    const now = new Date();
    const roles = ['seller','store','waterowner','manufacturer'];
    const expFields = { store:'storeExpiry', waterowner:'waterOwnerExpiry', manufacturer:'manufacturerExpiry', camping:'campingExpiry', resort:'resortExpiry', travelagency:'travelagencyExpiry' };
    roles.forEach(r => { if (currentUser.role===r && currentUser[expFields[r]] && new Date(currentUser[expFields[r]])<now) { currentUser.role='user'; currentUser[expFields[r]]=null; } });
    saveAll();
}

function openModal(html) {
    const modal = document.createElement('div');
    modal.className = 'modal active';
    modal.innerHTML = `<div class="modal-content">${html}</div>`;
    document.body.appendChild(modal);
    modal.addEventListener('click', e => { if(e.target===modal) modal.remove(); });
    return modal;
}

                <button data-del="${i}" style="position:absolute;top:-6px;right:-6px;background:#e74c3c;color:white;border:none;border-radius:50%;width:22px;height:22px;font-size:0.75rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:900;line-height:1;">✕</button>
            </div>`).join('')}
            ${photos.length < maxPhotos ? `
            <label style="width:80px;height:80px;border:2px dashed #ccc;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#fafafa;flex-shrink:0;transition:0.2s;" id="addPhotoLabel">
                <span style="font-size:1.5rem;">📷</span>
                <span style="font-size:0.65rem;color:#aaa;margin-top:2px;">Додати</span>
                <input type="file" accept="image/*" ${capture?'capture="environment"':''} multiple style="display:none;" id="photoFileInput">
            </label>` : ''}
        </div>
        <div style="font-size:0.72rem;color:#aaa;">До ${maxPhotos} фото · JPG, PNG · Перше фото — головне</div>`;

        // Видалення фото
        wrap.querySelectorAll('[data-del]').forEach(btn => {
            btn.onclick = e => {
                e.preventDefault();
                photos.splice(parseInt(btn.dataset.del), 1);
                render();
            };
        });

        // Завантаження нових фото
        const fileInput = wrap.querySelector('#photoFileInput');
        if (fileInput) {
            fileInput.onchange = async function() {
                const files = Array.from(this.files).slice(0, maxPhotos - photos.length);
                for (const file of files) {
                    const b64 = await fileToBase64(file);
                    // Стиснення якщо > 500кб
                    const compressed = await compressImage(b64, 800);
                    photos.push(compressed);
                }
                render();
            };
        }
    }

    render();

    return {
        el: wrap,
        getPhotos: () => photos,
        getFirst: () => photos[0] || '',
        setPhotos: (arr) => { photos = [...arr]; render(); }
    };
}

// Файл → base64
function fileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

// Стиснення зображення через canvas
function compressImage(base64, maxWidth = 800) {
    return new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.75));
        };
        img.onerror = () => resolve(base64); // якщо помилка — повертаємо оригінал
        img.src = base64;
    });
}

    // ---- Supabase Auth helpers ----
    async function afterSupabaseLogin(user) {
        // Перевіряємо чи вже є профіль у localStorage
        const savedUser = localStorage.getItem('mf_user');
        if (savedUser) {
            try {
                const parsed = JSON.parse(savedUser);
                if (parsed.email === user.email && parsed.nickname) {
                    currentUser = parsed;
                    renderMainMenu();
                    return;
                }
            } catch(e) {}
        }
        // Новий користувач — вибір нікнейму
        currentUser = { nickname:'', email: user.email, role:'user', hasBasicPaid:true, lang:appLang, country:appCountry, currency:appCurrency };
        saveAll();
        renderPickNickname('supabase');
    }

    // ---- Email OTP ----
    let otpSent = false;
    document.getElementById('emailAuthBtn').onclick = async function() {
        const email = document.getElementById('authEmail').value.trim();
        const statusDiv = document.getElementById('authStatus');
        const btn = document.getElementById('emailAuthBtn');

        if (!otpSent) {
            // Крок 1 — надсилаємо OTP
            if (!email || !email.includes('@')) {
                statusDiv.textContent = '❌ Введіть коректний email';
                return;
            }
            btn.disabled = true;
            btn.textContent = '⏳ Надсилаємо код...';
            statusDiv.textContent = '';
            const { error } = await supabase.auth.signInWithOtp({ email });
            if (error) {
                statusDiv.textContent = '❌ ' + error.message;
                btn.disabled = false;
                btn.textContent = '📧 Увійти через Email';
                return;
            }
            otpSent = true;
            document.getElementById('authEmail').disabled = true;
            document.getElementById('otpBlock').style.display = 'block';
            btn.disabled = false;
            btn.textContent = '✅ Підтвердити код';
            statusDiv.style.color = '#27ae60';
            statusDiv.textContent = '📨 Код надіслано на ' + email;
        } else {
            // Крок 2 — перевіряємо OTP
            const otp = document.getElementById('authOtp').value.trim();
            if (otp.length !== 6) {
                statusDiv.style.color = '#e74c3c';
                statusDiv.textContent = '❌ Введіть 6-значний код';
                return;
            }
            btn.disabled = true;
            btn.textContent = '⏳ Перевіряємо...';
            const { data, error } = await supabase.auth.verifyOtp({ email, token: otp, type: 'email' });
            if (error) {
                statusDiv.style.color = '#e74c3c';
                statusDiv.textContent = '❌ Невірний код. Спробуйте ще раз.';
                btn.disabled = false;
                btn.textContent = '✅ Підтвердити код';
                return;
            }
            await afterSupabaseLogin(data.user);
        }
    };

    // ---- Google OAuth ----
    document.getElementById('googleBtn').onclick = async function() {
        const { error } = await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.href }
        });
        if (error) alert('❌ ' + error.message);
    };

    // ---- Apple — заглушка ----
    document.getElementById('appleBtn').onclick = function() {
        alert('🍎 Вхід через Apple буде доступний найближчим часом');
    };

    // ---- Перевірка сесії при завантаженні ----
    supabase.auth.getSession().then(function(result) {
        const session = result.data && result.data.session;
        if (session && session.user) {
            afterSupabaseLogin(session.user);
        }
    });
}

function renderPickNickname(provider) {

    app.innerHTML = `

        <div style="font-size:2.5rem;">🎣</div>
        <div style="font-size:1.3rem;font-weight:900;color:#1f3b4c;margin-top:8px;">Welcome to MagicFish!</div>
        <div style="font-size:0.85rem;color:#888;margin-top:4px;">Signed in via ${provider === 'google' ? 'Google 🔵' : 'Apple 🍎'}</div>
      </div>
      <div style="background:#e8f5e9;border-radius:20px;padding:14px;margin-bottom:20px;font-size:0.85rem;color:#1b5e20;">
        🎉 <strong>Вітаємо у MagicFish!</strong><br>
        Оберіть унікальний нікнейм — так вас бачитимуть інші рибалки.<br>
        <span style="opacity:0.8;">Доступ повністю безкоштовний 🐟</span>
      </div>
      <div class="input-group">
        <label>🎣 Your unique nickname</label>
        <input type="text" id="pickNick" placeholder="e.g. SomFisher, Щука_Pro, Carp_King" maxlength="24">
        <div id="nickHint" style="font-size:0.78rem;color:#aaa;margin-top:4px;padding-left:12px;">2–24 characters, letters, numbers, _</div>
      </div>
      <button id="confirmNickBtn" class="btn btn-block" style="margin-top:8px;">✅ Confirm nickname →</button>
    </div>`;

    const nickInput = document.getElementById('pickNick');
    const hint = document.getElementById('nickHint');
    nickInput.oninput = () => {
        const v = nickInput.value.trim();
        const taken = ['admin','magicfish','support','gtr'];
        if (v.length < 2) { hint.style.color='#aaa'; hint.textContent='2–24 characters'; }
        else if (!/^[a-zA-Zа-яА-ЯіІїЇєЄёЁ0-9_]+$/.test(v)) { hint.style.color='#e74c3c'; hint.textContent='❌ Only letters, numbers, _'; }
        else if (taken.includes(v.toLowerCase())) { hint.style.color='#e74c3c'; hint.textContent='❌ This nickname is taken'; }
        else { hint.style.color='#27ae60'; hint.textContent=`✅ "${v}" is available!`; }
    };

    document.getElementById('confirmNickBtn').onclick = () => {
        const nick = nickInput.value.trim();
        if (nick.length < 2) { alert('Min 2 characters'); return; }
        if (!/^[a-zA-Zа-яА-ЯіІїЇєЄёЁ0-9_]+$/.test(nick)) { alert('Only letters, numbers, _'); return; }
        currentUser.nickname = nick;
        saveAll();
        currentUser.hasBasicPaid = true;
        addPoints('first_login');
        saveAll();
        renderAskGeolocation();
    };
}

// ========== ЗАПИТ ГЕОЛОКАЦІЇ ПІСЛЯ РЕЄСТРАЦІЇ ==========
function renderAskGeolocation() {
    const app = document.getElementById('appRoot');
    app.innerHTML = '<div class="card" style="text-align:center;">' +
      '<div style="font-size:3.5rem;margin-bottom:8px;">📍</div>' +
      '<div style="font-size:1.25rem;font-weight:900;color:#1f3b4c;margin-bottom:8px;">Дозвольте визначити ваше місце</div>' +
      '<div style="font-size:0.88rem;color:#555;margin-bottom:20px;line-height:1.6;">' +
        'MagicFish використовує геолокацію для:<br>' +
        '🎣 <b>Водойми поруч</b> — сортування за відстанню<br>' +
        '🆘 <b>SOS</b> — точні координати для рятувальників<br>' +
        '📍 <b>Чекіни</b> — підтвердження що ви на місці<br>' +
        '🏕️ <b>Кемпінги і бази</b> — найближчі до вас' +
      '</div>' +
      '<button id="geoAllowBtn" class="btn btn-block" style="margin-bottom:12px;background:#27ae60;font-size:1rem;">' +
        '📍 Дозволити геолокацію' +
      '</button>' +
      '<button id="geoSkipBtn" class="btn btn-block btn-secondary" style="font-size:0.9rem;">' +
        '✖ Пропустити' +
      '</button>' +
      '<div id="geoStatus" style="margin-top:14px;font-size:0.82rem;color:#888;"></div>' +
    '</div>';

    document.getElementById('geoAllowBtn').onclick = function() {
        var statusDiv = document.getElementById('geoStatus');
        var allowBtn  = document.getElementById('geoAllowBtn');
        allowBtn.disabled = true;
        allowBtn.textContent = '⏳ Визначаємо...';
        statusDiv.textContent = '';
        if (!navigator.geolocation) {
            statusDiv.innerHTML = '❌ Геолокація не підтримується браузером';
            allowBtn.disabled = false;
            allowBtn.textContent = '📍 Дозволити геолокацію';
            return;
        }
        navigator.geolocation.getCurrentPosition(
            function(pos) {
                currentLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
                currentUser.locationDenied = false;
                saveAll();
                statusDiv.innerHTML = '✅ Визначено: ' + pos.coords.latitude.toFixed(4) + ', ' + pos.coords.longitude.toFixed(4) + ' (±' + Math.round(pos.coords.accuracy) + 'м)';
                setTimeout(function() { renderMainMenu(); }, 800);
            },
            function(err) {
                statusDiv.innerHTML = '⚠️ Не вдалось визначити. Перевірте дозволи браузера.';
                allowBtn.disabled = false;
                allowBtn.textContent = '📍 Спробувати ще раз';
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    };

    document.getElementById('geoSkipBtn').onclick = function() {
        currentUser.locationDenied = true;
        saveAll();
        renderMainMenu();
        setTimeout(function() { showGeoWarningBanner(); }, 300);
    };
}

function showGeoWarningBanner() {
    if (document.getElementById('geoWarningBanner')) return;
    var warn = document.createElement('div');
    warn.id = 'geoWarningBanner';
    warn.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#e65100;color:#fff;padding:10px 16px;font-size:0.82rem;z-index:9999;display:flex;align-items:center;gap:10px;';
    var span = document.createElement('span');
    span.style.flex = '1';
    span.textContent = '⚠️ Геолокація вимкнена — SOS, «Поруч» і чекіни будуть неточними';
    var btn1 = document.createElement('button');
    btn1.textContent = 'Увімкнути';
    btn1.style.cssText = 'background:#fff;color:#e65100;border:none;border-radius:8px;padding:4px 10px;font-weight:700;cursor:pointer;';
    btn1.onclick = function() { warn.remove(); renderAskGeolocation(); };
    var btn2 = document.createElement('button');
    btn2.textContent = '✕';
    btn2.style.cssText = 'background:transparent;color:#fff;border:none;font-size:1.1rem;cursor:pointer;';
    btn2.onclick = function() { warn.remove(); };
    warn.appendChild(span);
    warn.appendChild(btn1);
    warn.appendChild(btn2);
    document.body.appendChild(warn);
}

    { id:'badge_fisher',  title:'🥇 Значок «Рибалка місяця»',       cost:200, desc:'Відображається у профілі та оголошеннях',icon:'🥇', color:'#fff3e0' },

function getUserPoints() { return currentUser.points || 0; }
function addPoints(type, customLabel) {
    if (!currentUser.points) currentUser.points = 0;
    if (!currentUser.pointsHistory) currentUser.pointsHistory = [];
    const cfg = POINTS_CONFIG[type];
    if (!cfg) return;
    currentUser.points += cfg.points;
    currentUser.pointsHistory.unshift({
        label: customLabel || cfg.label,
        points: cfg.points,
        date: new Date().toLocaleDateString('uk-UA'),
        time: new Date().toLocaleTimeString('uk-UA', {hour:'2-digit',minute:'2-digit'})
    });
    if (currentUser.pointsHistory.length > 50) currentUser.pointsHistory.pop();
    saveAll();
    return cfg.points;
}
function spendPoints(cost) {
    if ((currentUser.points||0) < cost) return false;
    currentUser.points -= cost;
    if (!currentUser.pointsHistory) currentUser.pointsHistory = [];
    currentUser.pointsHistory.unshift({
        label: '🛍️ Обмін балів на нагороду',
        points: -cost,
        date: new Date().toLocaleDateString('uk-UA'),
        time: new Date().toLocaleTimeString('uk-UA', {hour:'2-digit',minute:'2-digit'})
    });
    saveAll();
    return true;
}

    // ---- Мої оголошення ----
    function renderListingsTab(content) {
        const myL = listings.filter(l=>l.seller===currentUser.nickname);
        const canAdd = canAddListing();
        let limitHtml = '';
        if (listingLimit > 0 && listingLimit < 999) {
            const usedPct = Math.min(100, Math.round((activeCount/listingLimit)*100));
            limitHtml = `<div style="margin-bottom:16px;"><div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:4px;"><span>📢 Мої оголошення</span><span style="font-weight:700;">${activeCount} / ${listingLimit}</span></div><div class="limit-bar"><div class="limit-fill" style="width:${usedPct}%"></div></div></div>`;
        }
        let addBtnHtml = '';
        if (hasBasic && (role==='seller'||role==='store'||role==='manufacturer'||role==='waterowner')) {
            addBtnHtml = `<button id="addListingBtn" class="btn btn-block" style="margin-bottom:16px;">📢 Розмістити оголошення</button>`;
        } else if (hasBasic && role==='user') {
            addBtnHtml = `<div style="background:#fff9e6;border-radius:20px;padding:12px;margin-bottom:16px;font-size:0.85rem;color:#b76e00;">💡 Купіть підписку «Продавець» (100 грн/міс) щоб розміщувати оголошення</div>`;
        }
        content.innerHTML = limitHtml + addBtnHtml + (myL.length===0?`<div style="text-align:center;padding:30px;color:#aaa;"><div style="font-size:3rem;">📦</div><div style="font-size:1rem;margin-top:8px;">Немає активних оголошень</div></div>`:'');
        myL.forEach(l => {
            const div = document.createElement('div');
            div.className = 'olx-listing';
            const pillClass = l.status==='active'?'pill-active':'pill-sold';
            const pillText = l.status==='active'?'Активне':l.status==='sold'?'Продано':'Видалено';
            div.innerHTML = `
                <div class="olx-listing-img">${l.photo?`<img src="${l.photo}" style="width:100%;height:100%;object-fit:cover;border-radius:16px;">`:'🎣'}</div>

                    <div class="olx-listing-price">${l.price} грн</div>
                    <div class="olx-listing-meta">👁️ ${l.views||0} переглядів · ${l.date||'—'}</div>
                    <div style="margin-top:4px;"><span class="status-pill ${pillClass}">${pillText}</span></div>
                    <div class="olx-listing-actions">
                        ${l.status==='active'?`<button class="olx-listing-actions btn-edit-l" data-id="${l.id}">✏️ Ред.</button><button class="btn-sold-l" data-id="${l.id}">✅ Продано</button><button class="btn-del-l" data-id="${l.id}">🗑️ Видалити</button>`:''}
                    </div>
                </div>
            `;
            content.appendChild(div);
            div.querySelector('[data-id].btn-edit-l')?.addEventListener('click', () => showEditListingModal(l, () => { renderListingsTab(content); }));
            div.querySelector('.btn-sold-l')?.addEventListener('click', () => { if(confirm('Позначити як продано?')){l.status='sold';saveAll();renderListingsTab(content);} });
            div.querySelector('.btn-del-l')?.addEventListener('click', () => { if(confirm('Видалити оголошення?')){listings=listings.filter(x=>x.id!==l.id);saveAll();renderListingsTab(content);} });
        });
        const addBtn = document.getElementById('addListingBtn');
        if (addBtn) addBtn.onclick = () => { if(!canAddListing()){alert(`Ліміт ${listingLimit} оголошень вичерпано.`);return;} showAddListingModal(()=>renderListingsTab(content)); };

            const modal = openModal(`<h3>📝 Нова новина</h3><input id="nTitle" placeholder="Заголовок"><textarea id="nContent" placeholder="Текст"></textarea><input id="nLink" placeholder="Посилання (необов'язково)"><button id="saveNews" class="btn btn-block">Опублікувати</button><button class="close-modal">Скасувати</button>`);
            modal.querySelector('.close-modal').onclick=()=>modal.remove();

        };
        content.querySelectorAll('.btn-del-l').forEach(b=>{b.onclick=()=>{if(confirm('Видалити?')){newsItems.splice(parseInt(b.dataset.i),1);saveAll();renderMyNewsTab(content);}}});
    }
}

// ---- Форми оголошень ----
function showAddListingModal(onDone, presetCat=null, presetSub=null) {
    const catOptions = SECONDHAND_CATS.map(c=>`<option value="${c.id}" ${c.id===presetCat?'selected':''}>${c.label}</option>`).join('');
    const modal = openModal(`<h3>📢 Нове рекламне оголошення</h3>
        <div id="photoUploaderSlot"></div>
        <input id="lTitle" placeholder="Назва товару" style="margin-top:8px;">
        <input id="lPrice" type="number" placeholder="Ціна (грн)">
        <textarea id="lDesc" placeholder="Опис товару або послуги, контакти, умови..." rows="3"></textarea>
        <select id="lCat" style="margin-bottom:8px;">${catOptions}</select>
        <input id="lSub" placeholder="Підкатегорія (напр. Карпові, Honda, до 5м...)" value="${presetSub||''}">
        <button id="saveListing" class="btn btn-block" style="margin-top:8px;">📢 Розмістити оголошення</button>
        <button class="close-modal">Скасувати</button>`);

    const uploader = createPhotoUploader({ label:'📷 Фото товару (до 5 шт)', maxPhotos:5 });
    modal.querySelector('#photoUploaderSlot').appendChild(uploader.el);
    modal.querySelector('.close-modal').onclick = () => modal.remove();

    modal.querySelector('#saveListing').onclick = async () => {
        const title = modal.querySelector('#lTitle').value.trim();
        const price = parseInt(modal.querySelector('#lPrice').value);
        if (!title || isNaN(price)) { alert("Назва та ціна обов'язкові"); return; }
        const btn = modal.querySelector('#saveListing');
        btn.textContent = '⏳ Зберігаємо...'; btn.disabled = true;
        listings.push({
            id: Date.now(), seller: currentUser.nickname, title, price,
            desc: modal.querySelector('#lDesc').value,
            photo: uploader.getFirst(),
            photos: uploader.getPhotos(),
            category: modal.querySelector('#lCat').value,
            subcategory: modal.querySelector('#lSub').value.trim(),
            status:'active', views:0, date: new Date().toLocaleDateString('uk-UA')
        });
        saveAll(); modal.remove();
        if (onDone) onDone();
    };
}

function showEditListingModal(l, onDone) {
    const catOptions = Object.keys(categoryLabels).map(k=>`<option value="${k}" ${k===l.category?'selected':''}>${categoryLabels[k]}</option>`).join('');
    const modal = openModal(`<h3>✏️ Редагування</h3>
        <div id="photoUploaderSlot"></div>
        <input id="lTitle" value="${l.title}" style="margin-top:8px;">
        <input id="lPrice" type="number" value="${l.price}">
        <textarea id="lDesc" rows="3">${l.desc}</textarea>
        <select id="lCat">${catOptions}</select>
        <button id="saveListing" class="btn btn-block" style="margin-top:8px;">💾 Зберегти</button>
        <button class="close-modal">Скасувати</button>`);

    const existingPhotos = l.photos || (l.photo ? [l.photo] : []);
    const uploader = createPhotoUploader({ label:'📷 Фото товару', maxPhotos:5, existingPhotos });
    modal.querySelector('#photoUploaderSlot').appendChild(uploader.el);
    modal.querySelector('.close-modal').onclick = () => modal.remove();

    modal.querySelector('#saveListing').onclick = async () => {
        l.title = modal.querySelector('#lTitle').value.trim();
        l.price = parseInt(modal.querySelector('#lPrice').value) || l.price;
        l.desc = modal.querySelector('#lDesc').value;
        l.category = modal.querySelector('#lCat').value;
        l.photo = uploader.getFirst();
        l.photos = uploader.getPhotos();
        saveAll(); modal.remove(); if (onDone) onDone();
    };
}

function renderCampings() {
    ensureLeafletFallback();
    
    const app = document.getElementById('appRoot');
    app.innerHTML = `
    <div class="nickname-header">👤 ${currentUser.nickname}</div>
    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h1>🏕️ Кемпінги</h1>
            <button id="backCampings" class="back-btn">← Назад</button>
        </div>
        <div class="search-bar">
            <input id="campSearch" placeholder="🔍 Пошук кемпінгу...">
            <button id="campSortBtn" class="btn btn-secondary">📍 Поруч</button>
        </div>
        <button id="getCampLocation" class="btn btn-location btn-block">📍 Визначити моє місце</button>
        <div id="campLocationStatus" style="margin:8px 0;font-size:0.85rem;color:#888;text-align:center;"></div>
        <div id="campMap" class="map-container"></div>
        <div id="campList"></div>
    </div>`;
    document.getElementById('backCampings').onclick = () => renderMainMenu();
    document.getElementById('getCampLocation').onclick = () => {
        getUserLocation(ok => {
            if(ok) {
                const acc = currentLocation.accuracy ? ` (±${Math.round(currentLocation.accuracy)}м)` : '';
                document.getElementById('campLocationStatus').innerHTML = `✅ Місце визначено: ${currentLocation.lat.toFixed(4)}, ${currentLocation.lng.toFixed(4)}${acc}`;
                renderCampList(true);
            } else {
                document.getElementById('campLocationStatus').innerHTML = '❌ Не вдалося визначити місце';
            }
        });
    };
    document.getElementById('campSortBtn').onclick = () => { 
        if(!currentLocation){alert("❌ Спочатку натисніть 'Визначити моє місце'");return;} 
        renderCampList(true); 
    };
    document.getElementById('campSearch').oninput = () => renderCampList(false);

    let campMap = null;
    function renderCampList(sortByDist) {
        const q = document.getElementById('campSearch').value.toLowerCase();
        let filtered = campings.filter(c => 
            c.name.toLowerCase().includes(q) || 
            c.city.toLowerCase().includes(q) ||
            c.services.toLowerCase().includes(q)
        );
        if (sortByDist && currentLocation) {
            filtered.sort((a,b)=>
                getDistance(currentLocation.lat,currentLocation.lng,a.lat,a.lng)-
                getDistance(currentLocation.lat,currentLocation.lng,b.lat,b.lng)
            );
        }
        const listDiv = document.getElementById('campList');
        listDiv.innerHTML = '';
        const mapDiv = document.getElementById('campMap');
        if (campMap) campMap.remove();
        campMap = L.map(mapDiv).setView([49,32],6);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'OSM'}).addTo(campMap);
        setTimeout(() => { if(campMap) campMap.invalidateSize(); }, 300);
        
        filtered.forEach(c => {
            L.marker([c.lat,c.lng]).addTo(campMap).bindPopup(`<b>${c.name}</b><br>📍 ${c.city}`);
            let dist = currentLocation ? `<div style="color:#27ae60;font-size:0.85rem;font-weight:700;margin-top:8px;">📏 ${Math.round(getDistance(currentLocation.lat,currentLocation.lng,c.lat,c.lng)/1000)} км від вас</div>` : '';
            const card = document.createElement('div');
            card.style.cssText = 'background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);cursor:pointer;';
            card.innerHTML = `
                <div style="font-size:1.8rem;margin-bottom:8px;">⛺</div>
                <div style="font-weight:800;font-size:1.05rem;color:#1f3b4c;margin-bottom:4px;">${c.name}</div>
                <div style="font-size:0.85rem;color:#888;margin-bottom:8px;">📍 ${c.city}</div>
                <div style="font-size:0.82rem;color:#555;margin-bottom:8px;">${c.services}</div>
                <div style="display:flex;gap:6px;align-items:center;">
                    <a href="tel:${c.phone}" style="background:#27ae60;color:white;padding:6px 14px;border-radius:20px;text-decoration:none;font-size:0.8rem;font-weight:700;">📞 ${c.phone}</a>
                    <button onclick="event.stopPropagation();window.open('https://www.google.com/maps?q=${c.lat},${c.lng}','_blank')" style="background:#3b82f6;color:white;border:none;padding:6px 14px;border-radius:20px;font-size:0.8rem;font-weight:700;cursor:pointer;">🗺️ Карта</button>
                </div>
                ${dist}`;
            listDiv.appendChild(card);
        });
        if (currentLocation) { 
            campMap.setView([currentLocation.lat,currentLocation.lng],8); 
            L.marker([currentLocation.lat,currentLocation.lng]).addTo(campMap).bindPopup('📍 Ви тут'); 
        }
    }
    renderCampList(false);
}
