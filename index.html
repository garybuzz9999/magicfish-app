function renderWaterbodies() {
    ensureLeafletFallback();
    
    const app = document.getElementById('appRoot');
    app.innerHTML = `
    <div class="nickname-header">👤 ${currentUser.nickname}</div>
    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h1>🗺️ Водойми</h1><button id="backWater" class="back-btn">← Назад</button>
        </div>
        <button id="getLocationBtn" class="btn btn-location btn-block">📍 Визначити моє місце</button>
        <div id="locationStatus" style="margin-bottom:12px;font-size:0.85rem;color:#888;"></div>
        <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
            <button id="waterSortNearby" class="btn btn-secondary" style="flex:1;min-width:80px;">📍 Поруч</button>
            <button id="waterFilterAll"  class="btn btn-secondary" style="flex:1;min-width:60px;">🗺️ Всі</button>
            <button id="waterFilterFree" class="btn btn-secondary" style="flex:1;min-width:80px;">🎣 Безкоштовні</button>
            <button id="waterFilterPaid" class="btn btn-secondary" style="flex:1;min-width:60px;">💰 Платні</button>
        </div>
        <div id="waterMap" class="map-container"></div>
        <div id="waterList"></div>
    </div>`;
    document.getElementById('backWater').onclick = () => renderMainMenu();
    function renderWaterCards() {
        const acc = currentLocation?.accuracy ? ` (±${Math.round(currentLocation.accuracy)}м)` : '';
        document.getElementById('locationStatus').innerHTML = currentLocation ? `✅ ${currentLocation.lat.toFixed(5)}, ${currentLocation.lng.toFixed(5)}${acc}` : '❌ Місце не визначено';
        var listDiv = document.getElementById('waterList');
        listDiv.innerHTML = '';
        var displayList = waterbodies.slice();
        if (typeof waterFilter !== 'undefined') {
            if (waterFilter === 'free') displayList = displayList.filter(function(w){ return !w.paid; });
            if (waterFilter === 'paid') displayList = displayList.filter(function(w){ return  w.paid; });
        }
        if (typeof waterSortNearby !== 'undefined' && waterSortNearby && currentLocation) {
            displayList.sort(function(a,b){ return getDistance(currentLocation.lat,currentLocation.lng,a.lat,a.lng) - getDistance(currentLocation.lat,currentLocation.lng,b.lat,b.lng); });
        }
        if (displayList.length === 0) {
            listDiv.innerHTML = '<div style="text-align:center;padding:24px;color:#888;">Нічого не знайдено</div>';
        }
        displayList.forEach(water => {
            const statusClass = water.status==='biting'?'status-biting':water.status==='not_biting'?'status-not-biting':'status-unknown';
            const statusText = water.status==='biting'?'🟢 Клює!':water.status==='not_biting'?'🔴 Не клює':'⚪ Немає даних';
            const crowns = '👑'.repeat(Math.min(water.crown||0,5))+(water.crown>5?`+${water.crown-5}`:'');
            const card = document.createElement('div');
            card.className = 'water-card';
            if (water.paid) card.onclick = e => { if(e.target.tagName!=='BUTTON') showWaterDetails(water); };
            card.innerHTML = `
                <div class="water-header">
                    <span class="water-name">${water.name} <span style="color:#f39c12">${crowns}</span></span>
                    ${water.paid?'<span class="price-badge">💰 Платна</span>':'<span class="free-badge">🎣 Безкоштовна</span>'}
                </div>
                ${water.promo?`<div class="promo">🎁 ${water.promo}</div>`:''}
                <div class="status ${statusClass}">${statusText}</div>
                <div class="clickable-coord" data-lat="${water.lat}" data-lng="${water.lng}">📍 ${water.lat}, ${water.lng}</div>
                <div>
                    <button class="action-btn" id="bite_${water.id}" ${!canChangeStatus(water.lat,water.lng)?'disabled':''}>🐟 Клює</button>
                    <button class="action-btn" id="nobite_${water.id}" ${!canChangeStatus(water.lat,water.lng)?'disabled':''}>😴 Не клює</button>
                    <button class="action-btn" id="crown_${water.id}" ${!canChangeStatus(water.lat,water.lng)?'disabled':''}>👑 +Рейтинг</button>
                </div>
                <div class="alarm-future">📡 Сигналізатор GTR (підключення)</div>`;
            listDiv.appendChild(card);
            card.querySelector(`#bite_${water.id}`).onclick = e => { e.stopPropagation();  if(!canChangeStatus(water.lat,water.lng)){alert("❌ Потрібно бути в радіусі 300 м");return;} water.status='biting'; saveAll(); const p=addPoints('checkin',`📍 Чекін «Клює» — ${water.name}`); if(p) alert(`✅ Чекін збережено! +${p} балів 🏅`); renderWaterCards(); };
            card.querySelector(`#nobite_${water.id}`).onclick = e => { e.stopPropagation();  if(!canChangeStatus(water.lat,water.lng)){alert("❌ Потрібно бути в радіусі 300 м");return;} water.status='not_biting'; saveAll(); const p=addPoints('checkin',`📍 Чекін «Не клює» — ${water.name}`); if(p) alert(`✅ Чекін збережено! +${p} балів 🏅`); renderWaterCards(); };
            card.querySelector(`#crown_${water.id}`).onclick = e => { e.stopPropagation(); if(!canChangeStatus(water.lat,water.lng)){alert("❌ Потрібно бути в радіусі 300 м");return;} water.crown=(water.crown||0)+1; saveAll(); renderWaterCards(); };
            card.querySelector('.clickable-coord').onclick = e => { e.stopPropagation(); window.open(`https://www.google.com/maps?q=${water.lat},${water.lng}`,'_blank'); };
        });
        if (mapWater) mapWater.remove();
        const mapDiv = document.getElementById('waterMap');
        if (!mapDiv) return;
        mapWater = L.map(mapDiv, { zoomControl: true }).setView([49,32],6);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'OSM'}).addTo(mapWater);
        waterbodies.forEach(w => {
            const icon = L.divIcon({ html: w.status==='biting'?'🟢':w.status==='not_biting'?'🔴':'⚪', className:'', iconSize:[24,24] });
            const wStatusText = w.status==='biting'?'🟢 Клює':w.status==='not_biting'?'🔴 Не клює':'⚪ Невідомо';
            L.marker([w.lat,w.lng], {icon}).addTo(mapWater).bindPopup('<b>'+w.name+'</b><br>'+wStatusText+'<br>👑 '+(w.crown||0));
        });
        if (currentLocation) { mapWater.setView([currentLocation.lat,currentLocation.lng],12); L.marker([currentLocation.lat,currentLocation.lng]).addTo(mapWater).bindPopup('📍 Ви тут'); }
        // Фікс для планшету — карта не рендерилась в прихованому контейнері
        setTimeout(() => { if(mapWater) mapWater.invalidateSize(); }, 300);
    }
    document.getElementById('getLocationBtn').onclick = () => getUserLocation(()=>{ updateWaterFilterButtons(); renderWaterCards(); });

    var waterFilter = 'all';
    var waterSortNearby = false;

    function updateWaterFilterButtons() {
        var btnAll  = document.getElementById('waterFilterAll');
        var btnFree = document.getElementById('waterFilterFree');
        var btnPaid = document.getElementById('waterFilterPaid');
        var btnNear = document.getElementById('waterSortNearby');
        if (!btnAll) return;
        [btnAll, btnFree, btnPaid].forEach(function(b) { b.style.background=''; b.style.color=''; });
        var active = waterFilter==='free' ? btnFree : waterFilter==='paid' ? btnPaid : btnAll;
        active.style.background = '#2196F3';
        active.style.color = '#fff';
        btnNear.style.background = waterSortNearby ? '#27ae60' : '';
        btnNear.style.color      = waterSortNearby ? '#fff'    : '';
    }

    document.getElementById('waterFilterAll').onclick = function() {
        waterFilter = 'all'; waterSortNearby = false; updateWaterFilterButtons(); renderWaterCards();
    };
    document.getElementById('waterFilterFree').onclick = function() {
        waterFilter = 'free'; updateWaterFilterButtons(); renderWaterCards();
    };
    document.getElementById('waterFilterPaid').onclick = function() {
        waterFilter = 'paid'; updateWaterFilterButtons(); renderWaterCards();
    };
    document.getElementById('waterSortNearby').onclick = function() {
        if (!currentLocation) {
            getUserLocation(function() { waterSortNearby = true; updateWaterFilterButtons(); renderWaterCards(); });
            return;
        }
        waterSortNearby = !waterSortNearby;
        updateWaterFilterButtons(); renderWaterCards();
    };

    updateWaterFilterButtons();
    renderWaterCards();
}

            cat:  { el: document.getElementById('storeCatalogView'), btn: document.getElementById('viewCatBtn'),  bg:'#1f3b4c', color:'white' },

        });

        <div style="font-size:0.8rem;font-weight:700;color:#888;letter-spacing:1px;margin-bottom:12px;">КАТЕГОРІЇ НОВИХ ТОВАРІВ</div>

                const cnt = counts[cat.id] || 0;
                return `<button data-cat="${cat.id}" style="background:white;border:1.5px solid ${cnt>0?'#2a5f7a':'#eee'};border-radius:18px;padding:14px 10px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 2px 6px rgba(0,0,0,0.06);${cnt===0?'opacity:0.5':''}">

    function renderCatalogProducts() {
        const cat = SECONDHAND_CATS.find(c=>c.id===currentCatId);

            <button class="sort-cat-btn" data-s="za" style="background:#eee;border:none;border-radius:40px;padding:6px 14px;font-size:0.8rem;font-weight:600;cursor:pointer;">💎 Дорожчі</button>

                            ${p.inStock ? '<span style="background:#e8f5e9;color:#2e7d32;padding:3px 10px;border-radius:40px;font-size:0.72rem;font-weight:700;">✅ В наявності</span>' : '<span style="background:#fce4ec;color:#c62828;padding:3px 10px;border-radius:40px;font-size:0.72rem;font-weight:700;">❌ Немає</span>'}

    document.getElementById('catSearchBtn').onclick = () => {
        const q = document.getElementById('catSearch').value.trim().toLowerCase();
        if (!q) { renderCatalogCategories(); return; }
        const found = storeProducts.filter(p =>
            p.title.toLowerCase().includes(q) ||
            (p.brand||'').toLowerCase().includes(q) ||
            p.desc.toLowerCase().includes(q) ||
            (p.subcategory||'').toLowerCase().includes(q) ||
            p.storeName.toLowerCase().includes(q)
        );
        const content = document.getElementById('catalogContent');
        content.innerHTML = `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
            <button id="backFromSearch" style="background:#eee;border:none;border-radius:40px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:0.85rem;">← Назад</button>
            <div>🔍 «${q}» — ${found.length} товарів</div>
        </div>
        <div id="catalogProductsList"></div>`;
        document.getElementById('backFromSearch').onclick = () => renderCatalogCategories();
        renderProdList(found);

    document.getElementById('shSearch').onkeydown = e => { if (e.key==='Enter') { searchQuery = e.target.value.trim(); renderSearchResults(); } };

    function renderCategories() {
        currentCatId = null; currentSub = null;
        const catsDiv = document.getElementById('shCategories');
        const subsDiv = document.getElementById('shSubcats');
        const listDiv = document.getElementById('shListings');
        catsDiv.style.display = 'block';

        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;">
            ${SECONDHAND_CATS.map(cat => {
                const cnt = counts[cat.id] || 0;

        const catsDiv = document.getElementById('shCategories');
        const subsDiv = document.getElementById('shSubcats');
        const listDiv = document.getElementById('shListings');
        catsDiv.style.display = 'none';
        subsDiv.style.display = 'block';
        listDiv.style.display = 'none';

        const subCounts = {};
        listings.filter(l=>l.status==='active'&&l.category===currentCatId).forEach(l => { subCounts[l.subcategory||''] = (subCounts[l.subcategory||'']||0)+1; });
        const totalCat = listings.filter(l=>l.status==='active'&&l.category===currentCatId).length;

        let brandsHtml = '';
        if (cat.brands) {
            brandsHtml = `<div style="font-size:0.8rem;font-weight:700;color:#888;letter-spacing:1px;margin:14px 0 8px;">БРЕНДИ</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;">
                ${cat.brands.map(b=>`<button data-sub="${b}" class="sub-brand-btn" style="background:#e8f4fd;color:#1565c0;border:none;border-radius:40px;padding:6px 14px;font-size:0.82rem;font-weight:600;cursor:pointer;">${b}</button>`).join('')}
            </div>`;
        }

        subsDiv.innerHTML = `
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">
            <button id="backToCats" style="background:#eee;border:none;border-radius:40px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:0.85rem;">← Назад</button>
            <div style="font-weight:800;font-size:1rem;color:#1f3b4c;">${cat.label}</div>
        </div>
        <!-- Всі товари категорії -->
        <button data-sub="__all__" style="width:100%;background:linear-gradient(135deg,#1f3b4c,#2a5f7a);color:white;border:none;border-radius:16px;padding:12px;font-weight:700;cursor:pointer;margin-bottom:12px;font-size:0.9rem;">
            📋 Всі оголошення категорії (${totalCat})
        </button>
        ${brandsHtml}
        <div style="font-size:0.8rem;font-weight:700;color:#888;letter-spacing:1px;margin-bottom:8px;">ПІДКАТЕГОРІЇ ОГОЛОШЕНЬ</div>
        <div style="display:flex;flex-direction:column;gap:6px;">
            ${cat.sub.map(s => {
                const cnt = subCounts[s]||0;
                return `<button data-sub="${s}" style="background:white;border:1.5px solid #eee;border-radius:14px;padding:12px 16px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,0.05);">
                    <span style="font-size:0.88rem;font-weight:600;color:#1f3b4c;">${s}</span>
                    <span style="font-size:0.75rem;color:#aaa;background:#f0f0f0;padding:2px 10px;border-radius:40px;">${cnt}</span>
                </button>`;

        document.getElementById('backToCats').onclick = () => renderCategories();
        subsDiv.querySelectorAll('[data-sub]').forEach(btn => {
            btn.onclick = () => {
                currentSub = btn.dataset.sub === '__all__' ? null : btn.dataset.sub;
                renderListings();
            };
        });
    }

    function renderListings() {
        const cat = SECONDHAND_CATS.find(c=>c.id===currentCatId);
        const catsDiv = document.getElementById('shCategories');
        const subsDiv = document.getElementById('shSubcats');
        const listDiv = document.getElementById('shListings');
        catsDiv.style.display = 'none';
        subsDiv.style.display = 'none';
        listDiv.style.display = 'block';

        let filtered = listings.filter(l => l.status==='active' && l.category===currentCatId);
        if (currentSub) filtered = filtered.filter(l => l.subcategory===currentSub);

        const sym = getCurrencySymbol();
        listDiv.innerHTML = `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;">
            <button id="backToSubs" style="background:#eee;border:none;border-radius:40px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:0.85rem;">← Назад</button>
            <div style="font-weight:700;font-size:0.9rem;color:#1f3b4c;">${cat?.label||''} ${currentSub?'· '+currentSub:''}</div>
            <span style="font-size:0.8rem;color:#aaa;">${filtered.length} оголошень</span>
        </div>
        <!-- Сортування -->
        <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;">
            <button class="sort-btn active" data-sort="new" style="background:#1e3a3a;color:white;border:none;border-radius:40px;padding:6px 14px;font-size:0.8rem;font-weight:700;cursor:pointer;">🆕 Нові</button>
            <button class="sort-btn" data-sort="cheap" style="background:#eee;border:none;border-radius:40px;padding:6px 14px;font-size:0.8rem;font-weight:600;cursor:pointer;">💰 Дешевші</button>
            <button class="sort-btn" data-sort="exp" style="background:#eee;border:none;border-radius:40px;padding:6px 14px;font-size:0.8rem;font-weight:600;cursor:pointer;">💎 Дорожчі</button>
        </div>
        <div id="shItemsList"></div>
        ${canAdd ? `<button id="addShBtn2" class="btn btn-block" style="margin-top:16px;">📢 Розмістити оголошення в цій категорії</button>` : ''}`;

        document.getElementById('backToSubs').onclick = () => renderSubcats();
        document.getElementById('addShBtn2')?.addEventListener('click', () => showAddListingModal(() => renderListings(), currentCatId, currentSub));

        // Сортування
        let sortedListings = [...filtered];
        listDiv.querySelectorAll('.sort-btn').forEach(btn => {
            btn.onclick = () => {
                listDiv.querySelectorAll('.sort-btn').forEach(b => { b.style.background='#eee'; b.style.color='#333'; });
                btn.style.background='#1e3a3a'; btn.style.color='white';
                if (btn.dataset.sort==='cheap') sortedListings.sort((a,b)=>a.price-b.price);
                else if (btn.dataset.sort==='exp') sortedListings.sort((a,b)=>b.price-a.price);
                else sortedListings.sort((a,b)=>b.id-a.id);
                renderItems(sortedListings);
            };
        });

        function renderItems(items) {
            const itemsDiv = document.getElementById('shItemsList');
            if (items.length === 0) {
                itemsDiv.innerHTML = `<div style="text-align:center;padding:30px;color:#aaa;">
                    <div style="font-size:2.5rem;margin-bottom:8px;">😕</div>
                    <div>Немає активних оголошень у цій підкатегорії</div>
                    ${canAdd?'<button id="addFirstBtn" class="btn" style="margin-top:12px;">📢 Розмістити перше оголошення</button>':''}
                </div>`;
                document.getElementById('addFirstBtn')?.addEventListener('click', () => showAddListingModal(()=>renderListings(), currentCatId, currentSub));
                return;
            }
            itemsDiv.innerHTML = '';
            items.forEach(l => {
                const div = document.createElement('div');
                div.style.cssText = 'background:white;border-radius:20px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.07);display:flex;gap:12px;cursor:pointer;transition:0.15s;';
                div.onmouseover = () => div.style.background='#fef9e6';
                div.onmouseout  = () => div.style.background='white';
                const photos = l.photos && l.photos.length > 0 ? l.photos : (l.photo ? [l.photo] : []);
                div.innerHTML = `
                    <div style="width:85px;height:85px;border-radius:14px;overflow:hidden;flex-shrink:0;background:#f0f0f0;display:flex;align-items:center;justify-content:center;">
                        ${photos[0] ? `<img src="${photos[0]}" style="width:100%;height:100%;object-fit:cover;">` : `<span style="font-size:2rem;">${cat?.icon||'🎣'}</span>`}
                    </div>
                    <div style="flex:1;min-width:0;">
                        <div style="font-weight:700;font-size:0.95rem;color:#1f3b4c;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${l.title}</div>
                        <div style="font-size:1.1rem;font-weight:900;color:#f39c12;margin-bottom:4px;">${sym}${l.price.toLocaleString()}</div>
                        <div style="font-size:0.78rem;color:#888;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;">${l.desc}</div>
                        <div style="display:flex;align-items:center;justify-content:space-between;">
                            <span style="font-size:0.72rem;color:#aaa;">👁️ ${l.views||0} · 📅 ${l.date||''}</span>
                            <button class="contact-btn" data-seller="${l.seller}" style="background:#1f3b4c;color:white;border:none;border-radius:40px;padding:5px 12px;font-size:0.78rem;font-weight:700;cursor:pointer;">📞 Зв'язатись</button>
                        </div>
                    </div>`;
                div.querySelector('.contact-btn').onclick = e => {
                    e.stopPropagation();
                    showListingDetails(l, cat);
                };
                div.onclick = () => showListingDetails(l, cat);
                // Збільшуємо лічильник переглядів
                l.views = (l.views||0) + 1;
                itemsDiv.appendChild(div);
            });
        }
        renderItems(sortedListings);
    }

    function renderSearchResults() {
        if (!searchQuery) { renderCategories(); return; }
        const catsDiv = document.getElementById('shCategories');
        const subsDiv = document.getElementById('shSubcats');
        const listDiv = document.getElementById('shListings');
        catsDiv.style.display = 'none';
        subsDiv.style.display = 'none';
        listDiv.style.display = 'block';
        const sym = getCurrencySymbol();
        const q = searchQuery.toLowerCase();
        const found = listings.filter(l => l.status==='active' && (
            l.title.toLowerCase().includes(q) ||
            l.desc.toLowerCase().includes(q) ||
            (l.subcategory||'').toLowerCase().includes(q)
        ));
        listDiv.innerHTML = `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
            <button id="backToMain" style="background:#eee;border:none;border-radius:40px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:0.85rem;">← Назад</button>
            <div>🔍 «${searchQuery}» — ${found.length} результатів</div>
        </div>
        <div id="shSearchResults"></div>`;
        document.getElementById('backToMain').onclick = () => { searchQuery=''; renderCategories(); };
        const resultsDiv = document.getElementById('shSearchResults');
        if (found.length === 0) {
            resultsDiv.innerHTML = '<div style="text-align:center;padding:30px;color:#aaa;">😕 Нічого не знайдено</div>';
            return;
        }
        found.forEach(l => {
            const cat = SECONDHAND_CATS.find(c=>c.id===l.category);
            const div = document.createElement('div');
            div.style.cssText = 'background:white;border-radius:20px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.07);display:flex;gap:12px;cursor:pointer;';
            const photos = l.photos && l.photos.length > 0 ? l.photos : (l.photo ? [l.photo] : []);
            div.innerHTML = `
                <div style="width:75px;height:75px;border-radius:14px;overflow:hidden;flex-shrink:0;background:#f0f0f0;display:flex;align-items:center;justify-content:center;">
                    ${photos[0]?`<img src="${photos[0]}" style="width:100%;height:100%;object-fit:cover;">`:`<span style="font-size:1.8rem;">${cat?.icon||'🎣'}</span>`}
                </div>
                <div style="flex:1;">
                    <div style="font-size:0.72rem;color:#1565c0;font-weight:600;margin-bottom:2px;">${cat?.label||l.category}</div>
                    <div style="font-weight:700;font-size:0.9rem;color:#1f3b4c;">${l.title}</div>
                    <div style="font-size:1rem;font-weight:900;color:#f39c12;">${sym}${l.price.toLocaleString()}</div>
                    <button class="contact-btn2" data-seller="${l.seller}" style="background:#1f3b4c;color:white;border:none;border-radius:40px;padding:5px 12px;font-size:0.78rem;font-weight:700;cursor:pointer;margin-top:6px;">📞 Зв'язатись</button>
                </div>`;
            div.querySelector('.contact-btn2').onclick = e => { e.stopPropagation(); showListingDetails(l, cat); };
            div.onclick = () => showListingDetails(l, cat);
            resultsDiv.appendChild(div);
        });
    }

    renderCategories();
}

function showListingDetails(l, cat) {
    const sym = getCurrencySymbol();
    const photos = l.photos && l.photos.length > 0 ? l.photos : (l.photo ? [l.photo] : []);
    let photosHtml = photos.length > 0
        ? `<div style="display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px;">
            ${photos.map((p,i)=>`<img src="${p}" style="width:${photos.length===1?'100%':'120px'};height:${photos.length===1?'220px':'120px'};object-fit:cover;border-radius:16px;flex-shrink:0;">`).join('')}
           </div>`
        : `<div style="height:120px;background:#f0f0f0;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:3rem;margin-bottom:14px;">${cat?.icon||'🎣'}</div>`;

    // Знаходимо продавця
    const seller = currentUser.nickname === l.seller ? currentUser : { nickname: l.seller, phone: null };

    const modal = openModal(`
        ${photosHtml}
        <div style="font-size:0.75rem;color:#1565c0;font-weight:600;margin-bottom:4px;">${cat?.label||''} ${l.subcategory?'· '+l.subcategory:''}</div>
        <h3 style="font-size:1.2rem;margin-bottom:6px;">${l.title}</h3>
        <div style="font-size:1.5rem;font-weight:900;color:#f39c12;margin-bottom:12px;">${sym}${l.price.toLocaleString()}</div>
        <div style="background:#f5f7f0;border-radius:16px;padding:12px;margin-bottom:14px;font-size:0.85rem;color:#333;line-height:1.6;">${l.desc||'Без опису'}</div>
        <div style="font-size:0.8rem;color:#888;margin-bottom:14px;">
            👤 Продавець: <strong>${l.seller}</strong> · 📅 ${l.date||''} · 👁️ ${l.views||0} переглядів
        </div>
        <button id="contactSellerBtn" class="btn btn-block" style="margin-bottom:8px;">📞 Зв'язатись з автором</button>
        <button class="close-modal">Закрити</button>
    `);
    modal.querySelector('.close-modal').onclick = () => modal.remove();
    modal.querySelector('#contactSellerBtn').onclick = () => {
        alert(`💬 Чат з продавцем "${l.seller}"\n\nПовідомлення: "Доброго дня! Мене цікавить ваш товар: ${l.title}"\n\n(Повноцінний чат буде після підключення Supabase)`);
    };
}

function renderTournaments() {
    
    const app=document.getElementById('appRoot');
    const canOrg=canOrganizeTournament();
    const now=new Date();
    app.innerHTML=`
    <div class="nickname-header">👤 ${currentUser.nickname}</div>
    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">

        </div>
        <div style="background:linear-gradient(135deg,#fff9e6,#fff3cd);border-radius:20px;padding:14px;margin-bottom:16px;">
            <strong>🔥 Активних: ${getActiveTournamentsCount()}</strong> · 👥 Учасників: ${getTotalParticipantsCount()}
        </div>
        ${canOrg?'<button id="createTBtn" class="btn btn-block" style="margin-bottom:16px;">➕ Створити турнір</button>':'<div style="background:#f0f0f0;border-radius:16px;padding:10px;margin-bottom:16px;font-size:0.82rem;color:#777;">Організовувати можуть: магазини, виробники, власники водойм</div>'}
        <div id="tournamentList"></div>
    </div>`;
    document.getElementById('backTournaments').onclick=()=>renderMainMenu();
    const listDiv=document.getElementById('tournamentList');
    tournaments.slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(t=>{
        const isReg=t.participants&&t.participants.includes(currentUser.nickname);
        const isFull=t.participants&&t.participants.length>=t.maxParticipants;
        const isPast=new Date(t.date)<now;
        const pct=Math.min(100,Math.round(((t.participants||[]).length/t.maxParticipants)*100));
        const card=document.createElement('div');card.className='tournament-card';
        card.innerHTML=`
            <div class="tournament-title">🏆 ${t.title}</div>
            <div class="tournament-meta">
                <span class="t-badge t-date">📅 ${new Date(t.date).toLocaleDateString('uk-UA')}</span>
                <span class="t-badge t-place">📍 ${t.place}</span>
                <span class="t-badge t-fee">💰 ${t.fee} грн внесок</span>
            </div>
            <div style="font-size:0.85rem;color:#555;margin-bottom:8px;">${t.description}</div>
            <div style="font-size:0.85rem;margin-bottom:6px;"><strong>🎁</strong> ${t.prizes}</div>
            <div style="font-size:0.8rem;color:#aaa;margin-bottom:4px;">👥 ${(t.participants||[]).length}/${t.maxParticipants} · Орг: ${t.organizer}</div>
            <div class="participants-bar"><div class="participants-fill" style="width:${pct}%"></div></div>
            ${isPast?'<button class="register-btn" disabled>Турнір завершено</button>':isFull?'<button class="register-btn" disabled>Місця заповнені</button>':isReg?`<button class="register-btn registered" data-tid="${t.id}">✅ Ви зареєстровані — скасувати</button>`:`<button class="register-btn" data-tid="${t.id}">🎯 ЗАРЕЄСТРУВАТИСЯ</button>`}`;
        listDiv.appendChild(card);
        card.querySelector('[data-tid]')?.addEventListener('click', btn => {
            const tid=parseInt(card.querySelector('[data-tid]').dataset.tid), tour=tournaments.find(x=>x.id===tid);
            if (!tour) return;
            if (isReg) { if(confirm('Скасувати реєстрацію?')){tour.participants=tour.participants.filter(p=>p!==currentUser.nickname);saveAll();renderTournaments();} }
            else { tour.participants.push(currentUser.nickname); saveAll(); const p=addPoints('tournament',`🏆 Реєстрація на турнір: ${tour.title}`); renderTournaments(); alert(`🎉 Ви зареєстровані!\n💰 Внесок ${tour.fee} грн на місці.\n🏅 +${p} балів нараховано!`); }
        });
    });
    if (canOrg) document.getElementById('createTBtn').onclick=()=>{
        const modal=openModal(`<h3>🏆 Новий турнір</h3>
            <input id="tTitle" placeholder="Назва турніру">
            <input id="tDate" type="date" min="${new Date().toISOString().split('T')[0]}">
            <input id="tPlace" placeholder="Місце">
            <input id="tPrizes" placeholder="Призи (напр. 1 місце — 3000 грн)">
            <input id="tFee" type="number" min="0" placeholder="Внесок (грн)">
            <input id="tMax" type="number" min="2" max="500" placeholder="Макс. учасників">
            <textarea id="tDesc" placeholder="Опис / правила"></textarea>
            <button id="saveTournament" class="btn btn-block">🏆 Створити</button>
            <button class="close-modal">Скасувати</button>`);
        modal.querySelector('.close-modal').onclick=()=>modal.remove();
        document.getElementById('saveTournament').onclick=()=>{
            const title=document.getElementById('tTitle').value.trim(), date=document.getElementById('tDate').value, place=document.getElementById('tPlace').value.trim(), prizes=document.getElementById('tPrizes').value.trim();
            if(!title||!date||!place||!prizes){alert("Заповніть обов'язкові поля");return;}
            tournaments.push({id:Date.now(),title,date,place,prizes,fee:parseInt(document.getElementById('tFee').value)||0,maxParticipants:parseInt(document.getElementById('tMax').value)||30,participants:[],organizer:currentUser.nickname,description:document.getElementById('tDesc').value||'',createdAt:new Date().toISOString()});
            saveAll(); modal.remove(); renderTournaments();
        };
    };
}

            tours.push({ id:Date.now(), ...data, rating:5.0, reviews:0, participants:[], createdAt:new Date().toISOString() });
        }

        if (onDone) onDone(); else renderTours();
    };
}


// --- Фаза Місяця (без бібліотек, проста формула) ---
function getMoonPhase(date) {
    const year = date.getFullYear(), month = date.getMonth()+1, day = date.getDate();
    let jd = 367*year - Math.floor(7*(year+Math.floor((month+9)/12))/4)
              + Math.floor(275*month/9) + day + 1721013.5
              + (date.getHours() - date.getTimezoneOffset()/60) / 24;
    const phase = ((jd - 2451550.1) / 29.530588853) % 1;
    const p = phase < 0 ? phase + 1 : phase;
    // 0=новий, 0.25=перша чверть, 0.5=повний, 0.75=остання чверть
    if (p < 0.03 || p > 0.97) return { name:'🌑 Новий місяць',    score:2, icon:'🌑', phase:p };
    if (p < 0.22)              return { name:'🌒 Молодик',          score:1, icon:'🌒', phase:p };
    if (p < 0.28)              return { name:'🌓 Перша чверть',     score:1, icon:'🌓', phase:p };
    if (p < 0.47)              return { name:'🌔 Прибуває',         score:0, icon:'🌔', phase:p };
    if (p < 0.53)              return { name:'🌕 Повний місяць',    score:2, icon:'🌕', phase:p };
    if (p < 0.72)              return { name:'🌖 Спадає',           score:0, icon:'🌖', phase:p };
    if (p < 0.78)              return { name:'🌗 Остання чверть',   score:1, icon:'🌗', phase:p };
    return                            { name:'🌘 Старий місяць',    score:1, icon:'🌘', phase:p };
}

// --- Алгоритм розрахунку індексу кльову ---
function calculateBiteIndex(weather, moon) {
    let score = 5; // базовий
    const factors = [];

    const temp = weather.temperature;
    if (temp >= 10 && temp <= 25) {
        score += 2; factors.push({ label:'🌡️ Температура', value:`${temp}°C`, note:'Оптимальна для більшості риб', delta:+2, good:true });
    } else if (temp > 25 && temp <= 30) {
        score += 1; factors.push({ label:'🌡️ Температура', value:`${temp}°C`, note:'Трохи тепло, але клів є', delta:+1, good:true });
    } else if (temp < 0) {
        score -= 2; factors.push({ label:'🌡️ Температура', value:`${temp}°C`, note:'Дуже холодно — риба млява', delta:-2, good:false });
    } else if (temp > 30) {
        score -= 1; factors.push({ label:'🌡️ Температура', value:`${temp}°C`, note:'Спека — риба йде на глибину', delta:-1, good:false });
    } else {
        score += 0; factors.push({ label:'🌡️ Температура', value:`${temp}°C`, note:'Прохолодно, але терпимо', delta:0, good:null });
    }

    const wind = weather.windspeed;
    if (wind >= 1 && wind <= 5) {
        score += 1; factors.push({ label:'💨 Вітер', value:`${wind} м/с`, note:'Легкий вітер — ідеально', delta:+1, good:true });
    } else if (wind > 5 && wind <= 10) {
        score += 0; factors.push({ label:'💨 Вітер', value:`${wind} м/с`, note:'Помірний — клів середній', delta:0, good:null });
    } else if (wind > 10) {
        score -= 2; factors.push({ label:'💨 Вітер', value:`${wind} м/с`, note:'Сильний вітер — небезпечно на воді', delta:-2, good:false });
    } else {
        score += 0; factors.push({ label:'💨 Вітер', value:`${wind} м/с`, note:'Штиль — риба обережна', delta:0, good:null });
    }

    const pressure = weather.pressure;
    const pressureDelta = weather.pressureDelta || 0;
    if (pressureDelta >= -1 && pressureDelta <= 1) {
        score += 2; factors.push({ label:'📊 Тиск', value:`${Math.round(pressure)} гПа`, note:'Стабільний — відмінний клів', delta:+2, good:true });
    } else if (pressureDelta > 1) {
        score += 1; factors.push({ label:'📊 Тиск', value:`${Math.round(pressure)} гПа`, note:'Повільно зростає — клів покращується', delta:+1, good:true });
    } else if (pressureDelta < -2) {
        score -= 2; factors.push({ label:'📊 Тиск', value:`${Math.round(pressure)} гПа`, note:'Різке падіння — риба не бере', delta:-2, good:false });
    } else {
        score -= 1; factors.push({ label:'📊 Тиск', value:`${Math.round(pressure)} гПа`, note:'Падає — клів знижений', delta:-1, good:false });
    }

    const clouds = weather.cloudcover;
    if (clouds >= 40 && clouds <= 80) {
        score += 1; factors.push({ label:'☁️ Хмарність', value:`${clouds}%`, note:'Помірна — риба менш обережна', delta:+1, good:true });
    } else if (clouds > 80) {
        score += 1; factors.push({ label:'☁️ Хмарність', value:`${clouds}%`, note:'Похмуро — хижак активний', delta:+1, good:true });
    } else {
        score -= 1; factors.push({ label:'☁️ Хмарність', value:`${clouds}%`, note:'Ясно — риба бачить приманку краще', delta:-1, good:false });
    }

    const rain = weather.precipitation || 0;
    if (rain > 5) {
        score -= 1; factors.push({ label:'🌧️ Опади', value:`${rain} мм/год`, note:'Сильний дощ — клів послаблений', delta:-1, good:false });
    } else if (rain > 0 && rain <= 2) {
        score += 1; factors.push({ label:'🌧️ Опади', value:`${rain} мм/год`, note:'Легкий дощ — клів активний!', delta:+1, good:true });
    } else {
        factors.push({ label:'🌧️ Опади', value:'Немає', note:'Без опадів', delta:0, good:null });
    }

    // Місяць
    score += moon.score;
    factors.push({ label:'🌕 Фаза місяця', value:moon.name, note: moon.score===2?'Максимальна активність':moon.score===1?'Підвищена активність':'Звичайна активність', delta:moon.score, good:moon.score>=1 });

    // Час доби
    const hour = new Date().getHours();
    let timeFactor = { delta:0, note:'Звичайний час' };
    if ((hour>=5&&hour<=9)||(hour>=18&&hour<=21)) { score+=1; timeFactor={delta:+1, note:'Ранок/вечір — пік активності'}; }
    else if (hour>=22||hour<=4) { timeFactor={delta:0, note:'Ніч — залежить від виду риби'}; }
    else { score-=1; timeFactor={delta:-1, note:'День — риба менш активна'}; }
    factors.push({ label:'⏰ Час доби', value:hour+':'+(new Date().getMinutes().toString().padStart(2,'0')), note:timeFactor.note, delta:timeFactor.delta, good:timeFactor.delta>=0 });

    // Нормалізація 0–10
    const index = Math.max(0, Math.min(10, score));
    return { index, factors };
}

// --- Отримати погоду з Open-Meteo ---
async function fetchWeatherForForecast(lat, lng) {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true&hourly=temperature_2m,pressure_msl,cloudcover,precipitation,windspeed_10m&timezone=auto&forecast_days=1`;
    const resp = await fetch(url);
    const data = await resp.json();
    const cw = data.current_weather;
    const hourIdx = data.hourly.time.findIndex(t => t.includes(new Date().toISOString().substr(0,13)));
    const hi = hourIdx >= 0 ? hourIdx : 0;
    const pressure = data.hourly.pressure_msl[hi] || 1013;
    const pressurePrev = data.hourly.pressure_msl[Math.max(0,hi-3)] || pressure;
    return {
        temperature:  Math.round(cw.temperature),
        windspeed:    Math.round(cw.windspeed / 3.6), // км/год → м/с
        weathercode:  cw.weathercode,
        pressure,
        pressureDelta: (pressure - pressurePrev) / 3,
        cloudcover:   data.hourly.cloudcover[hi] || 50,
        precipitation:data.hourly.precipitation[hi] || 0,
    };
}

            el.appendChild(div);
        });
    }

    function addBite(ch) {
        const now = new Date();
        const time = [now.getHours(), now.getMinutes(), now.getSeconds()].map(n => String(n).padStart(2,'0')).join(':');
        ch.bites++;
        gtrTotalBites++;
        const biteEl = document.getElementById('gtrBiteCount');
        if (biteEl) { biteEl.textContent = gtrTotalBites; biteEl.style.animation = 'none'; setTimeout(() => biteEl.style.animation = '', 10); }
        gtrLog.unshift({ channel: ch.name, rod: ch.rod, time, color: ch.color });
        if (gtrLog.length > 50) gtrLog.pop();
        renderChannels();
        renderLog();
        if (gtrVibrOn && navigator.vibrate) navigator.vibrate([300, 100, 300]);
    }

    function startSim() {
        gtrSimTimer = setInterval(() => {
            const active = gtrChannels.filter(c => c.active);
            if (active.length === 0) return;
            if (Math.random() > 0.6) {
                const ch = active[Math.floor(Math.random() * active.length)];
                addBite(ch);
            }
        }, 5000);
    }

    document.getElementById('buyPhantomBtn').addEventListener('click', function() {
        showOrderForm('GTR Phantom BLE 4.0', 1890);
    });

    document.getElementById('gtrApiBtn').addEventListener('click', function() {
        openModal('<h3 style="color:#0d47a1;">📶 GTR Phantom BLE 4.0 — API</h3>' +
            '<p style="font-size:0.88rem;color:#333;line-height:1.6;">Офіційний API дозволяє підключити ваш GTR Phantom до MagicFish для:</p>' +
            '<ul style="font-size:0.85rem;color:#444;line-height:1.8;padding-left:18px;">' +
              '<li>📳 Вібро-сповіщення на телефон</li>' +
              '<li>📊 Статистика клювань в реальному часі</li>' +
              '<li>🗺️ Прив\'язка до водойми</li>' +
              '<li>👥 Поширення статусу з рибалками</li>' +
            '</ul>' +
            '<p style="font-size:0.82rem;color:#888;">Для отримання API-ключа зверніться до офіційного дистриб\'ютора GTR:</p>' +
            '<a href="mailto:api@gtrfishing.com" style="display:block;background:#1976d2;color:#fff;text-align:center;padding:12px;border-radius:12px;text-decoration:none;font-weight:700;margin-top:8px;">📧 api@gtrfishing.com</a>' +
            '<button class="close-modal" style="margin-top:12px;width:100%;">Зрозуміло</button>'
        );
        document.querySelector('.close-modal').onclick = function() { document.querySelector('.modal-overlay')?.remove(); };
    });

    document.getElementById('gtrConnectBtn').addEventListener('click', () => {
        gtrConnected = !gtrConnected;
        const btn = document.getElementById('gtrConnectBtn');
        const status = document.getElementById('gtrStatus');
        const disc = document.getElementById('gtrDisconnected');
        const conn = document.getElementById('gtrConnected');
        if (gtrConnected) {
            btn.textContent = '❌ Відключити';
            btn.style.background = '#e74c3c';
            btn.style.color = 'white';
            status.textContent = '🟢 підключено · GTR Phantom';
            status.style.color = '#27ae60';
            disc.style.display = 'none';
            conn.style.display = 'block';
            renderChannels();
            renderLog();
            startSim();
        } else {
            btn.textContent = '🔗 Підключити';
            btn.style.background = '';
            btn.style.color = '';
            status.textContent = 'не підключено';
            status.style.color = '#888';
            disc.style.display = 'block';
            conn.style.display = 'none';
            clearInterval(gtrSimTimer);
        }
    });

    document.getElementById('gtrVolSlider').addEventListener('input', function() {
        gtrVolume = this.value;
        document.getElementById('gtrVolLabel').textContent = gtrVolume + '%';
    });
    const sensLabels = { '1':'низька', '2':'середня', '3':'висока' };
    document.getElementById('gtrSensSlider').addEventListener('input', function() {
        gtrSens = this.value;
        document.getElementById('gtrSensLabel').textContent = sensLabels[this.value];
    });
    document.getElementById('gtrVibrBtn').addEventListener('click', function() {
        gtrVibrOn = !gtrVibrOn;
        this.textContent = gtrVibrOn ? 'УВІМК.' : 'ВИМК.';
        this.style.background = gtrVibrOn ? '#27ae60' : '#eee';
        this.style.color = gtrVibrOn ? 'white' : '#555';
    });
    let nightMode = false;
    document.getElementById('gtrNightBtn').addEventListener('click', function() {
        nightMode = !nightMode;
        this.textContent = nightMode ? 'УВІМК.' : 'ВИМК.';
        this.style.background = nightMode ? '#1f3b4c' : '#eee';
        this.style.color = nightMode ? 'white' : '#555';
        if (nightMode) { document.getElementById('gtrVolSlider').value = 20; gtrVolume = 20; document.getElementById('gtrVolLabel').textContent = '20%'; }
    });
    document.getElementById('gtrClearLog').addEventListener('click', () => {
        gtrLog = [];
        gtrChannels.forEach(c => c.bites = 0);
        gtrTotalBites = 0;
        const biteEl = document.getElementById('gtrBiteCount');
        if (biteEl) biteEl.textContent = '0';
        renderChannels();
        renderLog();
    });
}

function renderResorts() {
    ensureLeafletFallback();
    const app = document.getElementById('appRoot');
    app.innerHTML = `
    <div class="nickname-header">👤 ${currentUser.nickname}</div>
    <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <h1>🏖️ Бази відпочинку</h1>
            <button id="backResorts" class="back-btn">← Назад</button>
        </div>
        
        <!-- Route selector -->
        <div style="display:flex;gap:8px;margin-bottom:12px;">
            <button id="routeChop" class="btn btn-block" style="background:#27ae60;color:white;font-weight:700;">🚗 Київ → Чоп (М06)</button>
            <button id="routeWarsaw" class="btn btn-block" style="background:#3b82f6;color:white;font-weight:700;">🚗 Київ → Варшава (М07)</button>
        </div>
        
        <div class="search-bar">
            <input id="resortSearch" placeholder="🔍 Пошук бази...">
            <button id="resortSortBtn" class="btn btn-secondary">📍 Поруч</button>
        </div>
        <button id="getResortLocation" class="btn btn-location btn-block">📍 Визначити моє місце</button>
        <div id="resortLocationStatus" style="margin:8px 0;font-size:0.85rem;color:#888;text-align:center;"></div>
        <div id="resortMap" class="map-container"></div>
        <div id="resortList"></div>
    </div>`;
    
    document.getElementById('backResorts').onclick = () => renderMainMenu();
    
    let currentRoute = 'chop';
    let resortMap = null;
    
    document.getElementById('routeChop').onclick = () => { currentRoute = 'chop'; renderResortList(false); };
    document.getElementById('routeWarsaw').onclick = () => { currentRoute = 'warsaw'; renderResortList(false); };
    document.getElementById('getResortLocation').onclick = () => {
        getUserLocation(ok => {
            if(ok) {
                const acc = currentLocation.accuracy ? ` (±${Math.round(currentLocation.accuracy)}м)` : '';
                document.getElementById('resortLocationStatus').innerHTML = `✅ Місце визначено: ${currentLocation.lat.toFixed(4)}, ${currentLocation.lng.toFixed(4)}${acc}`;
                renderResortList(true);
            } else {
                document.getElementById('resortLocationStatus').innerHTML = '❌ Не вдалося визначити місце';
            }
        });
    };
    document.getElementById('resortSortBtn').onclick = () => { 
        if(!currentLocation){alert("❌ Спочатку натисніть 'Визначити моє місце'");return;} 
        renderResortList(true); 
    };
    document.getElementById('resortSearch').oninput = () => renderResortList(false);
    
    function renderResortList(sortByDist) {
        const q = document.getElementById('resortSearch').value.toLowerCase();
        const bases = currentRoute === 'chop' ? basesKyivChop : basesKyivWarsaw;
        
        let filtered = bases.filter(b => 
            b.name.toLowerCase().includes(q) || 
            b.city.toLowerCase().includes(q) ||
            b.services.toLowerCase().includes(q)
        );
        
        if (sortByDist && currentLocation) {
            filtered.sort((a,b)=>
                getDistance(currentLocation.lat,currentLocation.lng,a.lat,a.lng)-
                getDistance(currentLocation.lat,currentLocation.lng,b.lat,b.lng)
            );
        }
        
        const listDiv = document.getElementById('resortList');
        listDiv.innerHTML = '';
        const mapDiv = document.getElementById('resortMap');
        if (resortMap) resortMap.remove();
        resortMap = L.map(mapDiv).setView([49.5,26],7);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'OSM'}).addTo(resortMap);
        setTimeout(() => { if(resortMap) resortMap.invalidateSize(); }, 300);
        
        filtered.forEach(b => {
            const markerColor = currentRoute === 'chop' ? '🟢' : '🔵';
            L.marker([b.lat,b.lng]).addTo(resortMap).bindPopup(`${markerColor} <b>${b.name}</b><br>📍 ${b.city}`);
            
            let dist = currentLocation ? `<div style="color:#27ae60;font-size:0.85rem;font-weight:700;margin-top:8px;">📏 ${Math.round(getDistance(currentLocation.lat,currentLocation.lng,b.lat,b.lng)/1000)} км від вас</div>` : '';
            
            const card = document.createElement('div');
            card.style.cssText = 'background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08);border-left:4px solid '+(currentRoute==='chop'?'#27ae60':'#3b82f6')+';';
            card.innerHTML = `
                <div style="font-size:1.6rem;margin-bottom:8px;">🏖️</div>
                <div style="font-weight:800;font-size:1.05rem;color:#1f3b4c;margin-bottom:4px;">${b.name}</div>
                <div style="font-size:0.85rem;color:#888;margin-bottom:8px;">📍 ${b.city}</div>
                <div style="font-size:0.82rem;color:#555;margin-bottom:12px;line-height:1.4;">${b.services}</div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                    <a href="tel:${b.phone}" style="background:#27ae60;color:white;padding:6px 14px;border-radius:20px;text-decoration:none;font-size:0.8rem;font-weight:700;display:inline-block;">📞 ${b.phone}</a>
                    <button onclick="window.open('https://www.google.com/maps?q=${b.lat},${b.lng}','_blank')" style="background:#3b82f6;color:white;border:none;padding:6px 14px;border-radius:20px;font-size:0.8rem;font-weight:700;cursor:pointer;">🗺️ Карта</button>
                </div>
                ${dist}`;
            listDiv.appendChild(card);
        });
        
        if (currentLocation) { 
            resortMap.setView([currentLocation.lat,currentLocation.lng],8); 
            L.marker([currentLocation.lat,currentLocation.lng]).addTo(resortMap).bindPopup('📍 Ви тут'); 
        }
    }
    
    renderResortList(false);
}

// ========== ФОРУМ ==========
let forumTopics = JSON.parse(localStorage.getItem('mf_forum_topics') || '[]');
let forumPosts = JSON.parse(localStorage.getItem('mf_forum_posts') || '[]');

function saveForumData() {
    localStorage.setItem('mf_forum_topics', JSON.stringify(forumTopics));
    localStorage.setItem('mf_forum_posts', JSON.stringify(forumPosts));
}

function renderForum() {
    const app = document.getElementById('appRoot');
    app.innerHTML = `
    <div class="nickname-header">👤 ${currentUser.nickname}</div>
    <div class="card" style="padding:0;overflow:hidden;">
        <div style="background:linear-gradient(135deg,#1f3b4c,#2a5f7a);padding:16px 20px;border-radius:48px 48px 0 0;display:flex;align-items:center;justify-content:space-between;">
            <div>
                <div style="color:white;font-size:1.4rem;font-weight:900;">💬 Форум</div>
                <div style="color:rgba(255,255,255,0.75);font-size:0.8rem;">Обговорення · Поради · Запитання</div>
            </div>
            <button id="backForum" class="back-btn">← Назад</button>
        </div>
        <div style="padding:16px;">
            <button id="newTopicBtn" class="btn btn-block" style="margin-bottom:16px;background:#27ae60;color:white;">➕ Нова тема</button>
            <div id="forumTopicsList"></div>
        </div>
    </div>`;

    document.getElementById('backForum').onclick = () => renderMainMenu();
    document.getElementById('newTopicBtn').onclick = () => showNewTopicModal();

    renderForumTopics();
}

function renderForumTopics() {
    const listDiv = document.getElementById('forumTopicsList');
    if (!listDiv) return;
    
    const sorted = [...forumTopics].sort((a,b) => b.lastActivity - a.lastActivity);
    
    if (sorted.length === 0) {
        listDiv.innerHTML = `<div style="text-align:center;padding:40px;color:#aaa;">
            <div style="font-size:2.5rem;margin-bottom:8px;">💬</div>
            <div>Поки немає тем для обговорення</div>
            <div style="font-size:0.85rem;margin-top:6px;">Створи першу тему!</div>
        </div>`;
        return;
    }

    listDiv.innerHTML = sorted.map(topic => {
        const postsCount = forumPosts.filter(p => p.topicId === topic.id).length;
        const timeAgo = getTimeAgo(topic.lastActivity);
        return `<div class="forum-topic-card" data-topic="${topic.id}" style="background:white;border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.07);cursor:pointer;transition:0.15s;">
            <div style="display:flex;gap:10px;">
                <div style="font-size:1.8rem;flex-shrink:0;">💬</div>
                <div style="flex:1;min-width:0;">
                    <div style="font-weight:700;font-size:0.95rem;color:#1f3b4c;margin-bottom:3px;">${topic.title}</div>
                    <div style="font-size:0.8rem;color:#888;">👤 ${topic.author} · 📅 ${timeAgo} · 💬 ${postsCount} відповідей</div>
                </div>
            </div>
        </div>`;
    }).join('');

    document.querySelectorAll('.forum-topic-card').forEach(card => {
        card.onmouseover = () => card.style.background = '#fef9e6';
        card.onmouseout = () => card.style.background = 'white';
        card.onclick = () => {
            const topicId = parseInt(card.dataset.topic);
            renderForumTopic(topicId);
        };
    });
}

function showNewTopicModal() {
    const modal = openModal(`
        <h3>➕ Нова тема форуму</h3>
        <input id="topicTitle" placeholder="Назва теми" maxlength="100" style="margin-bottom:8px;">
        <textarea id="topicText" placeholder="Ваше питання або повідомлення..." rows="4" style="border-radius:16px;"></textarea>
        <button id="createTopicBtn" class="btn btn-block" style="margin-top:8px;">📝 Створити тему</button>
        <button class="close-modal" style="margin-top:8px;">Скасувати</button>
    `);
    modal.querySelector('.close-modal').onclick = () => modal.remove();
    modal.querySelector('#createTopicBtn').onclick = () => {
        const title = modal.querySelector('#topicTitle').value.trim();
        const text = modal.querySelector('#topicText').value.trim();
        if (!title || !text) { alert('Заповніть всі поля'); return; }
        
        const newTopic = {
            id: Date.now(),
            title,
            author: currentUser.nickname,
            createdAt: Date.now(),
            lastActivity: Date.now(),
        };
        forumTopics.push(newTopic);
        
        const firstPost = {
            id: Date.now() + 1,
            topicId: newTopic.id,
            author: currentUser.nickname,
            text,
            createdAt: Date.now(),
        };
        forumPosts.push(firstPost);
        
        saveForumData();
        modal.remove();
        renderForumTopic(newTopic.id);
    };
}

function renderForumTopic(topicId) {
    const topic = forumTopics.find(t => t.id === topicId);
    if (!topic) { renderForum(); return; }
    
    const posts = forumPosts.filter(p => p.topicId === topicId).sort((a,b) => a.createdAt - b.createdAt);
    
    const app = document.getElementById('appRoot');
    app.innerHTML = `
    <div class="nickname-header">👤 ${currentUser.nickname}</div>
    <div class="card" style="padding:0;overflow:hidden;">
        <div style="background:linear-gradient(135deg,#1f3b4c,#2a5f7a);padding:16px 20px;border-radius:48px 48px 0 0;">
            <button id="backToForum" class="back-btn" style="margin-bottom:8px;">← До списку тем</button>
            <div style="color:white;font-size:1.1rem;font-weight:900;">${topic.title}</div>
            <div style="color:rgba(255,255,255,0.75);font-size:0.8rem;">👤 ${topic.author} · 📅 ${getTimeAgo(topic.createdAt)}</div>
        </div>
        <div style="padding:16px;">
            <div id="forumPostsList"></div>
            <div style="margin-top:20px;background:#f5f7f0;border-radius:16px;padding:14px;">
                <div style="font-weight:700;margin-bottom:8px;">💬 Ваша відповідь</div>
                <textarea id="replyText" placeholder="Напишіть вашу відповідь..." rows="3" style="border-radius:16px;"></textarea>
                <button id="sendReplyBtn" class="btn btn-block" style="margin-top:8px;background:#27ae60;color:white;">📝 Надіслати відповідь</button>
            </div>
        </div>
    </div>`;

    document.getElementById('backToForum').onclick = () => renderForum();
    document.getElementById('sendReplyBtn').onclick = () => {
        const text = document.getElementById('replyText').value.trim();
        if (!text) { alert('Напишіть щось!'); return; }
        
        forumPosts.push({
            id: Date.now(),
            topicId: topic.id,
            author: currentUser.nickname,
            text,
            createdAt: Date.now(),
        });
        
        topic.lastActivity = Date.now();
        saveForumData();
        renderForumTopic(topicId);
    };

    const listDiv = document.getElementById('forumPostsList');
    listDiv.innerHTML = posts.map(post => `
        <div style="background:white;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,0.06);">
            <div style="font-size:0.8rem;color:#888;margin-bottom:6px;">👤 ${post.author} · ${getTimeAgo(post.createdAt)}</div>
            <div style="line-height:1.6;color:#333;">${post.text}</div>
        </div>
    `).join('');
}

function getTimeAgo(timestamp) {
    const now = Date.now();
    const diff = now - timestamp;
    const minutes = Math.floor(diff / 60000);
    const hours = Math.floor(diff / 3600000);
    const days = Math.floor(diff / 86400000);
    if (minutes < 1) return 'щойно';
    if (minutes < 60) return `${minutes} хв тому`;
    if (hours < 24) return `${hours} год тому`;
    return `${days} дн тому`;
}

// ========== RENDER SECTION ==========
function renderSection(section) {
    sessionStorage.setItem('lastSection', section);
    if (section==='waterbodies') renderWaterbodies();
    else if (section==='campings') renderCampings();
    else if (section==='resorts') renderResorts();
    else if (section==='stores') renderStores();
    else if (section==='sos') renderSOS();
    else if (section==='marketplace') renderMarketplace();
    else if (section==='news') renderNews();
    else if (section==='alarm') renderAlarm();
    else if (section==='forecast') renderForecast();
    else if (section==='forum') renderForum();
    else if (section==='tours') renderTours();
    else if (section==='gtr_cases') renderGTRCases();
    else if (section==='cabinet') renderCabinet();
    else renderMainMenu();
}
